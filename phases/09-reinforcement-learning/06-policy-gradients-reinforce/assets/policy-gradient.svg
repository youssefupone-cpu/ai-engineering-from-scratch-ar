<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">REINFORCE - صعود متدرج عند العائد المتوقع</text>

  <rect x="40" y="60" width="820" height="70" class="box"/>
  <text x="60" y="85" class="label">نظرية التدرج السياسي</text>
  <text x="60" y="108" class="content">غراد J(ثيتا) = E_pi [ sum_t G_t * سجل grad_theta pi_theta(a_t | s_t) ]</text>

  <rect x="40" y="150" width="820" height="80" class="hot"/>
  <text x="60" y="175" class="label">طرح واحد، تحديث واحد</text>
  <text x="60" y="198" class="content">طرح tau ~ pi_theta، إرجاع الحساب G_0، G_1،...، G_T</text>
  <text x="60" y="218" class="content">لكل (s_t, a_t): ثيتا += lr * (G_t - b(s_t)) * سجل التخرج pi_theta(a_t | s_t)</text>

  <rect x="40" y="250" width="260" height="140" class="box"/>
  <text x="170" y="275" text-anchor="middle" class="label">عمل عينة</text>
  <text x="60" y="300" class="content">logits = f_theta(s)</text>
  <text x="60" y="320" class="content">ع = softmax(logits)</text>
  <text x="60" y="340" class="content">أ ~ قاطع(ع)</text>
  <text x="170" y="370" text-anchor="middle" class="caption">العشوائية حسب التصميم</text>

  <rect x="320" y="250" width="260" height="140" class="box"/>
  <text x="450" y="275" text-anchor="middle" class="label">مهمة الائتمان</text>
  <text x="340" y="300" class="content">G_t = sum_{k&gt;=t} g^{k-t} r_{k+1}</text>
  <text x="340" y="320" class="content">مكافأة للذهاب فقط</text>
  <text x="340" y="340" class="content">خط الأساس: G_t - V(s_t)</text>
  <text x="450" y="370" text-anchor="middle" class="caption">غير متحيزة، وانخفاض التباين</text>

  <rect x="600" y="250" width="260" height="140" class="box"/>
  <text x="730" y="275" text-anchor="middle" class="label">تطبيق التدرج</text>
  <text x="620" y="300" class="content">سجل التخرج pi = e_a - p</text>
  <text x="620" y="320" class="content">ثيتا += lr * adv * grad</text>
  <text x="620" y="340" class="content">+ مكافأة الانتروبيا</text>
  <text x="730" y="370" text-anchor="middle" class="caption">على السياسة، على دفعات</text>

  <text x="450" y="430" text-anchor="middle" class="caption">PPO = التعزيز + نسبة IS المقصوصة · GRPO = التعزيز + خط الأساس النسبي للمجموعة · DPO = التعزيز بدون أخذ العينات</text>
</svg>