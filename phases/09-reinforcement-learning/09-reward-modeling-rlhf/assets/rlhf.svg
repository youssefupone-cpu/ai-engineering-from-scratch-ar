<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">RLHF: ثلاث مراحل، نموذج لغة واحد</text>

  <rect x="30" y="60" width="270" height="360" class="box"/>
  <text x="165" y="88" text-anchor="middle" class="label">المرحلة 1: SFT</text>
  <text x="50" y="118" class="content">data:  (prompt, ideal_response)</text>
  <text x="50" y="140" class="content">الخسارة: احتمالية تسجيل الرمز المميز التالي</text>
  <text x="50" y="162" class="content">الإخراج: pi_SFT (عروض توضيحية)</text>
  <text x="165" y="200" text-anchor="middle" class="caption">متحيز نحو السلوك الجيد</text>
  <text x="165" y="220" text-anchor="middle" class="caption">لا يزال LM؛ يمكن أن يكذب، يتجول</text>

  <rect x="50" y="255" width="230" height="140" class="hot"/>
  <text x="165" y="280" text-anchor="middle" class="label">مرساة المجمدة</text>
  <text x="70" y="310" class="content">pi_ref = pi_SFT</text>
  <text x="70" y="332" class="content">R_phi init من pi_SFT</text>
  <text x="165" y="370" text-anchor="middle" class="caption">يبقى في المراحل 2-3</text>

  <rect x="315" y="60" width="270" height="360" class="box"/>
  <text x="450" y="88" text-anchor="middle" class="label">المرحلة الثانية: نموذج المكافأة</text>
  <text x="335" y="118" class="content">data: (x, y_+, y_-)  prefs</text>
  <text x="335" y="140" class="content">الخسارة: برادلي تيري</text>
  <text x="335" y="162" class="content">  -سجل سيج(R_phi(x,y_+)-R_phi(x,y_-))</text>
  <text x="335" y="200" class="content">الإخراج: العددية R_phi(x, y)</text>
  <text x="450" y="235" text-anchor="middle" class="caption">التفضيلات -&gt; المكافأة</text>

  <rect x="335" y="280" width="230" height="120" class="cool"/>
  <text x="450" y="305" text-anchor="middle" class="label">البديل 2026</text>
  <text x="355" y="330" class="content">DPO يتخطى R_phi بالكامل:</text>
  <text x="355" y="352" class="content">الخسارة المفضلة ذات الشكل المغلق على pi</text>
  <text x="450" y="385" text-anchor="middle" class="caption">نفس الجودة، وحساب أقل</text>

  <rect x="600" y="60" width="270" height="360" class="box"/>
  <text x="735" y="88" text-anchor="middle" class="label">المرحلة 3: PPO</text>
  <text x="620" y="118" class="content">عينة y ~ pi_theta(.|x)</text>
  <text x="620" y="140" class="content">المكافأة = R_phi(x, y)</text>
  <text x="620" y="162" class="content">          - بيتا * KL(pi_theta || pi_ref)</text>
  <text x="620" y="185" class="content">PPO التحديث البديل المقطوع</text>
  <text x="735" y="225" text-anchor="middle" class="caption">KL يبقي pi بالقرب من المشعب</text>
  <text x="735" y="245" text-anchor="middle" class="caption">حيث تم تدريب R_phi</text>

  <rect x="620" y="275" width="230" height="125" class="hot"/>
  <text x="735" y="300" text-anchor="middle" class="label">diagnostics</text>
  <text x="640" y="325" class="content">يعني KL &lt;10</text>
  <text x="640" y="345" class="content">RM ارتفاع النتيجة</text>
  <text x="640" y="365" class="content">تقييم الإنسان: مستقر أو أعلى</text>
  <text x="735" y="390" text-anchor="middle" class="caption">العائق: إنذار اختراق المكافأة</text>

  <text x="450" y="450" text-anchor="middle" class="caption">2022: يتم شحن InstructGPT / ChatGPT على هذه الوصفة · 2026: DPO + GRPO يقوم بمعظم العمل</text>
</svg>