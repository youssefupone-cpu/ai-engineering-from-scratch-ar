<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .ent { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; }
      .cont { fill: #fce4ec; stroke: #c0392b; stroke-width: 1.5; }
      .neu { fill: #f5f5f5; stroke: #616161; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">NLI — مهمة واحدة وثلاثة استخدامات إنتاجية</text>

  <!-- Premise + Hypothesis input -->
  <rect x="60" y="70" width="280" height="60" class="box"/>
  <text x="75" y="92" class="label">الفرضية (ر):</text>
  <text x="75" y="112" class="content">"قطة تنام على الأريكة."</text>

  <rect x="60" y="140" width="280" height="60" class="box"/>
  <text x="75" y="162" class="label">الفرضية (ح):</text>
  <text x="75" y="182" class="content">"هناك قطة في الغرفة."</text>

  <line x1="340" y1="135" x2="400" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Encoder -->
  <rect x="400" y="90" width="220" height="90" class="box"/>
  <text x="510" y="115" text-anchor="middle" class="label">التشفير المحولات</text>
  <text x="510" y="138" text-anchor="middle" class="content">[CLS] ت [SEP] ح [SEP]</text>
  <text x="510" y="160" text-anchor="middle" class="caption">ديبيرتا-v3 / روبرتا / BART</text>

  <line x1="620" y1="135" x2="680" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3-way softmax -->
  <rect x="680" y="70" width="180" height="50" class="ent"/>
  <text x="770" y="92" text-anchor="middle" class="label">entailment</text>
  <text x="770" y="110" text-anchor="middle" class="content">0.97</text>

  <rect x="680" y="125" width="180" height="50" class="neu"/>
  <text x="770" y="147" text-anchor="middle" class="label">neutral</text>
  <text x="770" y="165" text-anchor="middle" class="content">0.02</text>

  <rect x="680" y="180" width="180" height="50" class="cont"/>
  <text x="770" y="202" text-anchor="middle" class="label">contradiction</text>
  <text x="770" y="220" text-anchor="middle" class="content">0.01</text>

  <!-- Three uses below -->
  <text x="450" y="270" text-anchor="middle" class="title">نفس الموديل، ثلاث مقابس</text>

  <rect x="40" y="290" width="260" height="130" class="ent"/>
  <text x="170" y="315" text-anchor="middle" class="label">1. تصنيف صفر طلقة</text>
  <text x="170" y="340" text-anchor="middle" class="content">ر = وثيقة</text>
  <text x="170" y="358" text-anchor="middle" class="content">ح = "حول {التسمية}"</text>
  <text x="170" y="385" text-anchor="middle" class="caption">اختر تسمية الحد الأقصى</text>
  <text x="170" y="402" text-anchor="middle" class="caption">لا حاجة لبيانات التدريب</text>

  <rect x="320" y="290" width="260" height="130" class="ent"/>
  <text x="450" y="315" text-anchor="middle" class="label">2. الإخلاص (RAG)</text>
  <text x="450" y="340" text-anchor="middle" class="content">t = السياق المسترد</text>
  <text x="450" y="358" text-anchor="middle" class="content">h = مطالبة الإجابة التي تم إنشاؤها</text>
  <text x="450" y="385" text-anchor="middle" class="caption">يستلزم → المدعومة</text>
  <text x="450" y="402" text-anchor="middle" class="caption">RAGAS جوهر الإخلاص</text>

  <rect x="600" y="290" width="260" height="130" class="ent"/>
  <text x="730" y="315" text-anchor="middle" class="label">3. تلخيص التحقق من الحقائق</text>
  <text x="730" y="340" text-anchor="middle" class="content">ر = الوثيقة المصدر</text>
  <text x="730" y="358" text-anchor="middle" class="content">ح = الجملة الموجزة</text>
  <text x="730" y="385" text-anchor="middle" class="caption">تناقض → هلوسة</text>
  <text x="730" y="402" text-anchor="middle" class="caption">محايد → مطالبة غير مدعومة</text>
</svg>