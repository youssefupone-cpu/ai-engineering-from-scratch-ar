<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #f3ece0; stroke: #1a1a1a; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 13px; fill: #333; font-family: 'Menlo', monospace; }
      .note { font-size: 11px; fill: #666; font-style: italic; }
      .stage { font-size: 12px; fill: #c0392b; font-style: italic; text-anchor: middle; }
    </style>
  </defs>

  <rect class="box" x="20" y="30" width="860" height="120" rx="4"/>
  <text class="label" x="35" y="55">BIO وضع العلامات</text>
  <text class="note" x="35" y="75">قم بتسمية كل رمز بـ B-TYPE (البدء)، أو I-TYPE (من الداخل)، أو O (خارج)</text>

  <text class="content" x="40" y="110">الرمز المميز: رفعت شركة Apple دعوى قضائية ضد Google بسبب صفقة بحث iPhone الخاصة بها في US.</text>
  <text class="content" x="40" y="135">التسمية: B-ORG O B-ORG O O B-PROD O O O O B-GPE O</text>

  <rect class="box" x="20" y="180" width="200" height="160" rx="4"/>
  <text class="label" x="120" y="205" text-anchor="middle">rule-based</text>
  <text class="content" x="35" y="235">مباراة المعجم الجغرافي</text>
  <text class="content" x="35" y="255">ريكس + الإملاء</text>
  <text class="note" x="35" y="285">دقة عالية</text>
  <text class="note" x="35" y="305">تغطية صفر OOV</text>
  <text class="note" x="35" y="325">لا توضيح</text>

  <rect class="box" x="240" y="180" width="200" height="160" rx="4"/>
  <text class="label" x="340" y="205" text-anchor="middle">CRF</text>
  <text class="content" x="255" y="235">مميزات اليد:</text>
  <text class="content" x="255" y="255">  لاحقة,</text>
  <text class="content" x="255" y="275">  الجيران، حالة</text>
  <text class="note" x="255" y="305">يفرض صالحا</text>
  <text class="note" x="255" y="325">BIO التحولات</text>

  <rect class="box" x="460" y="180" width="200" height="160" rx="4"/>
  <text class="label" x="560" y="205" text-anchor="middle">BiLSTM-CRF</text>
  <text class="content" x="475" y="235">الميزات المستفادة</text>
  <text class="content" x="475" y="255">تضمين → بيلستم</text>
  <text class="content" x="475" y="275">  → CRF الرأس</text>
  <text class="note" x="475" y="305">لا مزيد من اليد</text>
  <text class="note" x="475" y="325">engineering</text>

  <rect class="hot" x="680" y="180" width="200" height="160" rx="4"/>
  <text class="label" x="780" y="205" text-anchor="middle">محول NER</text>
  <text class="content" x="695" y="235">ضبط دقيق BERT</text>
  <text class="content" x="695" y="255">رأس فئة الرمز المميز</text>
  <text class="content" x="695" y="275">مساحات مجمعة</text>
  <text class="note" x="695" y="305">أفضل دقة</text>
  <text class="note" x="695" y="325">معظم حساب</text>

  <text class="stage" x="450" y="370" text-anchor="middle">اختر الطريقة الأرخص التي تصل إلى شريط الدقة الخاص بك</text>
</svg>