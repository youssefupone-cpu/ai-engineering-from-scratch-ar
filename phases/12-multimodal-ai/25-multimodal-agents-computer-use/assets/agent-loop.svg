<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">حلقة الوكيل المتعددة الوسائط - الإدراك، والعقل، والتصرف، والمراقبة</text>

  <rect x="30" y="50" width="900" height="230" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">حلقة من أربع مراحل</text>

  <rect x="60" y="100" width="190" height="150" class="hot"/>
  <text x="155" y="122" text-anchor="middle" class="step">1. إدراك</text>
  <text x="155" y="142" text-anchor="middle" class="small">screenshot</text>
  <text x="155" y="158" text-anchor="middle" class="small">+ شجرة إمكانية الوصول</text>
  <text x="155" y="174" text-anchor="middle" class="small">+ الهدف + التاريخ</text>
  <text x="155" y="200" text-anchor="middle" class="step">VLM الترميز</text>
  <text x="155" y="220" text-anchor="middle" class="small">دقة عالية 1280+</text>
  <text x="155" y="236" text-anchor="middle" class="small">الجانب الأصلي</text>

  <path d="M 255 175 L 295 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="100" width="190" height="150" class="cool"/>
  <text x="395" y="122" text-anchor="middle" class="step">2. السبب</text>
  <text x="395" y="142" text-anchor="middle" class="small">خطة الخطوة التالية</text>
  <text x="395" y="158" text-anchor="middle" class="small">تعليمات الأرض</text>
  <text x="395" y="174" text-anchor="middle" class="small">للإحداثيات</text>
  <text x="395" y="200" text-anchor="middle" class="step">تنبعث منها JSON العمل</text>
  <text x="395" y="220" text-anchor="middle" class="small">{العمل، س، ص، تنازلي}</text>
  <text x="395" y="236" text-anchor="middle" class="small">يساعد element_desc</text>

  <path d="M 495 175 L 535 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="100" width="190" height="150" class="cold"/>
  <text x="635" y="122" text-anchor="middle" class="step">3. تصرف</text>
  <text x="635" y="142" text-anchor="middle" class="small">إرسال إلى المتصفح</text>
  <text x="635" y="158" text-anchor="middle" class="small">السيلينيوم / CDP</text>
  <text x="635" y="174" text-anchor="middle" class="small">أو OS سائق</text>
  <text x="635" y="200" text-anchor="middle" class="step">التحقق من النجاح</text>
  <text x="635" y="220" text-anchor="middle" class="small">العنصر موجود؟</text>
  <text x="635" y="236" text-anchor="middle" class="small">أعد المحاولة عند الفشل</text>

  <path d="M 735 175 L 775 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="100" width="130" height="150" class="reg"/>
  <text x="845" y="122" text-anchor="middle" class="step">4. لاحظ</text>
  <text x="845" y="142" text-anchor="middle" class="small">لقطة شاشة جديدة</text>
  <text x="845" y="158" text-anchor="middle" class="small">فرق الدولة</text>
  <text x="845" y="174" text-anchor="middle" class="small">فحص الهدف</text>
  <text x="845" y="200" text-anchor="middle" class="step">كرر أو القيام به</text>
  <text x="845" y="220" text-anchor="middle" class="small">الحد الأقصى للخطوات ~ 30</text>

  <path d="M 845 255 Q 845 270 845 280 L 845 300 Q 500 300 500 255 L 500 255" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="30" y="300" width="900" height="210" class="box"/>
  <text x="480" y="322" text-anchor="middle" class="head">الذاكرة + المعايير</text>

  <rect x="60" y="340" width="400" height="160" class="reg"/>
  <text x="260" y="362" text-anchor="middle" class="step">ضغط الذاكرة</text>
  <text x="260" y="382" text-anchor="middle" class="small">1. سلسلة الملخص: ملخص كل 5 خطوات</text>
  <text x="260" y="398" text-anchor="middle" class="small">2. تخطي الإطار: الأول + الأخير + كل ثالث</text>
  <text x="260" y="414" text-anchor="middle" class="small">3. تسجيل الدخول فقط: سجل الإجراءات النصية (كلود)</text>
  <text x="260" y="430" text-anchor="middle" class="small">4. مختلط: سجل + آخر 2 لقطات شاشة + ملخص</text>
  <text x="260" y="460" text-anchor="middle" class="caption">30 لقطة شاشة بحجم 2048 بكسل = 360 ألف رمز</text>
  <text x="260" y="476" text-anchor="middle" class="caption">الضغط إلزامي الخطوة الماضية ~ 10</text>

  <rect x="480" y="340" width="430" height="160" class="hot"/>
  <text x="695" y="362" text-anchor="middle" class="step">معايير 2026</text>
  <text x="695" y="384" text-anchor="middle" class="small">ScreenSpot-Pro: كلود 4.7 ~90 / Qwen2.5-VL 85</text>
  <text x="695" y="400" text-anchor="middle" class="small">VisualWebArena: الجوزاء 3 برو 27 / مفتوح ~20</text>
  <text x="695" y="416" text-anchor="middle" class="small">AgentVista: الحدود 27-40 / مفتوح 10-20</text>
  <text x="695" y="432" text-anchor="middle" class="small">النمس-UI: GPT-5 ~82 / Qwen2.5-VL ~70</text>
  <text x="695" y="462" text-anchor="middle" class="step">لا يزال صعبا</text>
  <text x="695" y="482" text-anchor="middle" class="caption">أفق طويل + انتعاش + تأريض جيد</text>
</svg>