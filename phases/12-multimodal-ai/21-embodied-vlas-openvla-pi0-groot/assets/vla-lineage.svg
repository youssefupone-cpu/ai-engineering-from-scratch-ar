<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">VLAs المضمنة — RT-2 إلى GR00T، قوس تنسيق الإجراء</text>

  <rect x="30" y="50" width="900" height="210" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">أربعة تنسيقات عمل مستخدمة اليوم</text>

  <rect x="50" y="90" width="200" height="160" class="hot"/>
  <text x="150" y="110" text-anchor="middle" class="step">منفصلة 256 بن</text>
  <text x="150" y="128" text-anchor="middle" class="small">RT-2 (2023)، OpenVLA</text>
  <text x="150" y="146" text-anchor="middle" class="small">رمز مميز واحد لكل DOF</text>
  <text x="150" y="162" text-anchor="middle" class="small">متوافق مع مفردات النص</text>
  <text x="150" y="186" text-anchor="middle" class="step">الايجابيات: بسيطة</text>
  <text x="150" y="206" text-anchor="middle" class="small">السلبيات: مطلوب حوالي 300 توك/ثانية</text>
  <text x="150" y="224" text-anchor="middle" class="small">الاستدلال 3-5 هرتز</text>

  <rect x="270" y="90" width="200" height="160" class="cool"/>
  <text x="370" y="110" text-anchor="middle" class="step">FAST (DCT + التكميم)</text>
  <text x="370" y="128" text-anchor="middle" class="small">تحسين 2024</text>
  <text x="370" y="146" text-anchor="middle" class="small">~10 رموز / مسار</text>
  <text x="370" y="162" text-anchor="middle" class="small">معاملات التردد المنخفض</text>
  <text x="370" y="186" text-anchor="middle" class="step">الايجابيات: 3-5x أسرع</text>
  <text x="370" y="206" text-anchor="middle" class="small">السلبيات: يفقد التردد العالي</text>
  <text x="370" y="224" text-anchor="middle" class="small">يستخدم بواسطة pi0-FAST</text>

  <rect x="490" y="90" width="200" height="160" class="cold"/>
  <text x="590" y="110" text-anchor="middle" class="step">رأس مطابق للتدفق</text>
  <text x="590" y="128" text-anchor="middle" class="small">بي0 (2024)</text>
  <text x="590" y="146" text-anchor="middle" class="small">الإخراج المستمر</text>
  <text x="590" y="162" text-anchor="middle" class="small">مسار 50 خطوة</text>
  <text x="590" y="186" text-anchor="middle" class="step">الايجابيات: نعومة</text>
  <text x="590" y="206" text-anchor="middle" class="small">5 خطوات إزالة الضوضاء</text>
  <text x="590" y="224" text-anchor="middle" class="small">~50 هرتز التحكم</text>

  <rect x="710" y="90" width="200" height="160" class="reg"/>
  <text x="810" y="110" text-anchor="middle" class="step">dual-system</text>
  <text x="810" y="128" text-anchor="middle" class="small">GR00T N1 (2025)</text>
  <text x="810" y="146" text-anchor="middle" class="small">النظام 2: VLM ~1 هرتز</text>
  <text x="810" y="162" text-anchor="middle" class="small">النظام 1: صغير ~ 100 هرتز</text>
  <text x="810" y="186" text-anchor="middle" class="step">الايجابيات: على نطاق الإنسان</text>
  <text x="810" y="206" text-anchor="middle" class="small">أهداف فرعية + تحكم سريع</text>
  <text x="810" y="224" text-anchor="middle" class="small">الأفضل لمن هم فوق 30 عامًا DOF</text>

  <rect x="30" y="280" width="900" height="230" class="box"/>
  <text x="480" y="302" text-anchor="middle" class="head">وصفة التدريب + السلامة</text>

  <rect x="60" y="320" width="260" height="180" class="cool"/>
  <text x="190" y="342" text-anchor="middle" class="step">co-fine-tune</text>
  <text x="190" y="362" text-anchor="middle" class="small">نسبة ~0.5:1 إلى 1:1</text>
  <text x="190" y="378" text-anchor="middle" class="small">الويب VQA + عروض الروبوت</text>
  <text x="190" y="396" text-anchor="middle" class="small">يحافظ على المعرفة العامة</text>
  <text x="190" y="416" text-anchor="middle" class="small">الروبوت فقط -&gt; ينسى اللغة</text>
  <text x="190" y="436" text-anchor="middle" class="step">المسار الدقيق</text>
  <text x="190" y="456" text-anchor="middle" class="small">LoRA على 100-1000 عرض توضيحي</text>
  <text x="190" y="472" text-anchor="middle" class="small">للتكيف مع الروبوت الجديد</text>

  <rect x="340" y="320" width="260" height="180" class="reg"/>
  <text x="470" y="342" text-anchor="middle" class="step">افتح تجسيد X</text>
  <text x="470" y="362" text-anchor="middle" class="small">22 مجموعة بيانات</text>
  <text x="470" y="378" text-anchor="middle" class="small">مسارات 1M</text>
  <text x="470" y="394" text-anchor="middle" class="small">22 تجسيدًا للروبوت</text>
  <text x="470" y="412" text-anchor="middle" class="small">ALOHA / الجسر / الروبوت</text>
  <text x="470" y="432" text-anchor="middle" class="step">مخطط موحد</text>
  <text x="470" y="452" text-anchor="middle" class="small">الدولة، الكاميرا، العمل</text>
  <text x="470" y="468" text-anchor="middle" class="small">open-source</text>

  <rect x="620" y="320" width="290" height="180" class="hot"/>
  <text x="765" y="342" text-anchor="middle" class="step">بوابات الأمان (خارج VLA)</text>
  <text x="765" y="362" text-anchor="middle" class="small">حدود مشتركة صعبة</text>
  <text x="765" y="378" text-anchor="middle" class="small">سرعة القطع</text>
  <text x="765" y="394" text-anchor="middle" class="small">حدود مساحة العمل</text>
  <text x="765" y="410" text-anchor="middle" class="small">HITL الموافقة على المهام الجديدة</text>
  <text x="765" y="436" text-anchor="middle" class="step">VLA يقترح، يفرض جهاز التحكم</text>
  <text x="765" y="462" text-anchor="middle" class="caption">تعامل دائمًا مع إخراج VLA كما كان سابقًا،</text>
  <text x="765" y="478" text-anchor="middle" class="caption">ليس أمرا</text>
</svg>