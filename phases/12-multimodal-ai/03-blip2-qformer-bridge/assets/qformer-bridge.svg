<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .frozen { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .train { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">BLIP-2 جسر Q-Former — 32 استعلامًا يضغط ViT للحصول على LLM مجمد</text>

  <rect x="40" y="60" width="180" height="200" class="frozen"/>
  <text x="130" y="82" text-anchor="middle" class="head">المجمدة فيت</text>
  <text x="130" y="102" text-anchor="middle" class="small">فيتامين ز/14، 1.1 ب</text>
  <text x="130" y="120" text-anchor="middle" class="small">إدخال 224 × 224</text>
  <text x="130" y="138" text-anchor="middle" class="small">شبكة التصحيح 16 × 16</text>
  <text x="130" y="156" text-anchor="middle" class="small">-&gt; 256 رمزًا للتصحيح</text>
  <text x="130" y="174" text-anchor="middle" class="small">خافت 1408</text>
  <text x="130" y="202" text-anchor="middle" class="caption">غير مدربين</text>
  <text x="130" y="220" text-anchor="middle" class="caption">إخراج الميزات المجمدة</text>
  <text x="130" y="240" text-anchor="middle" class="caption">256 × 1408 لكل صورة</text>

  <path d="M 225 160 L 290 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="258" y="150" text-anchor="middle" class="small">ك، ف</text>

  <rect x="295" y="60" width="250" height="300" class="train"/>
  <text x="420" y="82" text-anchor="middle" class="head">س-السابق (مدرب)</text>
  <text x="420" y="100" text-anchor="middle" class="small">12 طبقة، BERT-قاعدة init</text>

  <rect x="315" y="110" width="210" height="60" class="cool"/>
  <text x="420" y="128" text-anchor="middle" class="step">32 استفسارًا قابلاً للتعلم</text>
  <text x="420" y="146" text-anchor="middle" class="small">معلمات الجسر</text>
  <text x="420" y="162" text-anchor="middle" class="small">نفس 32 ناقلات لكل صورة</text>

  <rect x="315" y="178" width="210" height="60" class="box"/>
  <text x="420" y="196" text-anchor="middle" class="step">الاهتمام الذاتي (الاستفسارات فقط)</text>
  <text x="420" y="214" text-anchor="middle" class="small">تتفاعل الاستعلامات مع بعضها البعض</text>
  <text x="420" y="230" text-anchor="middle" class="small">ومع النص في المرحلة 1</text>

  <rect x="315" y="244" width="210" height="60" class="box"/>
  <text x="420" y="262" text-anchor="middle" class="step">cross-attention</text>
  <text x="420" y="280" text-anchor="middle" class="small">س من الاستعلامات، K/V من التصحيحات</text>
  <text x="420" y="296" text-anchor="middle" class="small">خريطة انتباه 32 × 256</text>

  <rect x="315" y="312" width="210" height="40" class="box"/>
  <text x="420" y="338" text-anchor="middle" class="step">FFN + LN (مشترك مع مسار النص)</text>

  <path d="M 550 160 L 620 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="150" text-anchor="middle" class="small">32 رمزا</text>

  <rect x="625" y="60" width="140" height="120" class="train"/>
  <text x="695" y="82" text-anchor="middle" class="head">الإسقاط الخطي</text>
  <text x="695" y="100" text-anchor="middle" class="small">768 -&gt; 4096 (LLM خافت)</text>
  <text x="695" y="118" text-anchor="middle" class="small">تدربت في المرحلة 2</text>
  <text x="695" y="138" text-anchor="middle" class="small">~3M المعلمات</text>
  <text x="695" y="158" text-anchor="middle" class="small">32 × LLM_dim الإخراج</text>

  <path d="M 770 120 L 830 120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="835" y="60" width="100" height="240" class="frozen"/>
  <text x="885" y="82" text-anchor="middle" class="head">مجمدة LLM</text>
  <text x="885" y="102" text-anchor="middle" class="small">OPT-6.7B أو</text>
  <text x="885" y="120" text-anchor="middle" class="small">Flan-T5-XXL</text>
  <text x="885" y="148" text-anchor="middle" class="small">32 رمزًا مرئيًا</text>
  <text x="885" y="164" text-anchor="middle" class="small">+ موجه النص</text>
  <text x="885" y="182" text-anchor="middle" class="small">-&gt; تسمية توضيحية / VQA</text>
  <text x="885" y="212" text-anchor="middle" class="caption">غير مدربين</text>
  <text x="885" y="230" text-anchor="middle" class="caption">LM جيل</text>
  <text x="885" y="248" text-anchor="middle" class="caption">التسمية التوضيحية أو الإجابة</text>

  <rect x="40" y="380" width="880" height="130" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">التدريب على مرحلتين</text>

  <rect x="60" y="420" width="415" height="75" class="cool"/>
  <text x="80" y="440" class="step">المرحلة 1: التمثيل (رقم LLM)</text>
  <text x="80" y="458" class="small">تدريب Q- السابق وحده مع</text>
  <text x="80" y="474" class="small">ITC (صورة نص متباين)</text>
  <text x="80" y="488" class="small">+ ITM (مطابقة الصورة والنص)</text>
  <text x="250" y="458" class="small">+ ITG (إنشاء نص مستند إلى الصورة)</text>
  <text x="250" y="474" class="small">الاستعلامات تعلم الترميز</text>
  <text x="250" y="488" class="small">كل من المعلومات الدلالية وفك تشفير النص</text>

  <rect x="490" y="420" width="415" height="75" class="train"/>
  <text x="510" y="440" class="step">المرحلة الثانية: التوليدية (مع المجمدة LLM)</text>
  <text x="510" y="458" class="small">مشروع 32 استعلامًا -&gt; LLM خافت</text>
  <text x="510" y="474" class="small">تسبق النص</text>
  <text x="510" y="488" class="small">قطار LM خسارة شاملة</text>
  <text x="680" y="458" class="small">جسر + جهاز عرض للتعلم</text>
  <text x="680" y="474" class="small">لإطعام LLM بشكل نظيف</text>
  <text x="680" y="488" class="small">إجمالي 188 مليون معلمة</text>
</svg>