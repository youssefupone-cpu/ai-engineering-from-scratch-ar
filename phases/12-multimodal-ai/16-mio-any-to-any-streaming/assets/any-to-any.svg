<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">MIO — أربع طرق، ومفردات مشتركة واحدة، وفك تشفير التدفق</text>

  <rect x="30" y="50" width="900" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">أربعة رموز، كلمة واحدة، محول واحد</text>

  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="180" height="70" class="hot"/>
    <text x="90" y="22" text-anchor="middle" class="step">text</text>
    <text x="90" y="42" text-anchor="middle" class="small">BPE الرمز المميز</text>
    <text x="90" y="58" text-anchor="middle" class="small">المعرفات 0.31999</text>

    <rect x="210" y="0" width="180" height="70" class="cool"/>
    <text x="300" y="22" text-anchor="middle" class="step">image</text>
    <text x="300" y="42" text-anchor="middle" class="small">SEED-Tokenizer</text>
    <text x="300" y="58" text-anchor="middle" class="small">المعرفات 32000..36095</text>

    <rect x="420" y="0" width="180" height="70" class="cold"/>
    <text x="510" y="22" text-anchor="middle" class="step">speech</text>
    <text x="510" y="42" text-anchor="middle" class="small">مُرمز الكلام RVQ</text>
    <text x="510" y="58" text-anchor="middle" class="small">8 طبقات من كتاب الشفرات</text>

    <rect x="630" y="0" width="180" height="70" class="reg"/>
    <text x="720" y="22" text-anchor="middle" class="step">music</text>
    <text x="720" y="42" text-anchor="middle" class="small">Encodec-class</text>
    <text x="720" y="58" text-anchor="middle" class="small">8192 مدخلا</text>
  </g>

  <path d="M 150 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 360 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 570 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 780 170 L 480 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="200" width="280" height="60" class="box"/>
  <text x="480" y="222" text-anchor="middle" class="step">محول واحد، خسارة NTP واحدة</text>
  <text x="480" y="240" text-anchor="middle" class="small">~48 ألف مفردات، نص + صورة + كلام + موسيقى</text>
  <text x="480" y="256" text-anchor="middle" class="small">البث الودي: رمز مميز، رمز مميز</text>

  <rect x="30" y="290" width="900" height="220" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">منهج من أربع مراحل + مسار فك التشفير</text>

  <rect x="60" y="330" width="180" height="170" class="hot"/>
  <text x="150" y="352" text-anchor="middle" class="step">محاذاة المرحلة 1</text>
  <text x="150" y="370" text-anchor="middle" class="small">أزواج النص والصور</text>
  <text x="150" y="386" text-anchor="middle" class="small">أزواج النص والكلام</text>
  <text x="150" y="402" text-anchor="middle" class="small">أزواج النص والموسيقى</text>
  <text x="150" y="428" text-anchor="middle" class="step">المرحلة 2 معشق</text>
  <text x="150" y="446" text-anchor="middle" class="small">مستندات متعددة الوسائط</text>
  <text x="150" y="462" text-anchor="middle" class="small">السياق عبر الوسائط</text>
  <text x="150" y="480" text-anchor="middle" class="small">OBELICS + بودكاست</text>

  <rect x="260" y="330" width="180" height="170" class="cool"/>
  <text x="350" y="352" text-anchor="middle" class="step">المرحلة 3 غنية بالكلام</text>
  <text x="350" y="370" text-anchor="middle" class="small">بيانات صوتية إضافية</text>
  <text x="350" y="386" text-anchor="middle" class="small">رفع جودة الكلام</text>
  <text x="350" y="402" text-anchor="middle" class="small">دون الانحدار النص</text>
  <text x="350" y="428" text-anchor="middle" class="step">المرحلة 4 SFT</text>
  <text x="350" y="446" text-anchor="middle" class="small">VQA، السرد</text>
  <text x="350" y="462" text-anchor="middle" class="small">حوار الكلام</text>
  <text x="350" y="480" text-anchor="middle" class="small">أي إلى أي المهام</text>

  <rect x="460" y="330" width="460" height="170" class="reg"/>
  <text x="690" y="352" text-anchor="middle" class="step">مسار فك تشفير التدفق (الهدف &lt;500 مللي ثانية TTFAB)</text>
  <text x="690" y="372" text-anchor="middle" class="small">الميكروفون -&gt; رموز الكلام (~40 مللي ثانية)</text>
  <text x="690" y="388" text-anchor="middle" class="small">موجه التعبئة المسبقة (حوالي 80 مللي ثانية عند 8B)</text>
  <text x="690" y="404" text-anchor="middle" class="small">رمز الإخراج الأول (~40 مللي ثانية)</text>
  <text x="690" y="420" text-anchor="middle" class="small">المتبقية-VQ الطبقات 1..7 فك التشفير المتوازي (~30 مللي ثانية)</text>
  <text x="690" y="436" text-anchor="middle" class="small">وحدة فك تشفير شكل موجة الكلام (~80 مللي ثانية)</text>
  <text x="690" y="462" text-anchor="middle" class="step">الإجمالي TTFAB: ~270 مللي ثانية (GPT-4o-class)</text>
  <text x="690" y="482" text-anchor="middle" class="caption">Moshi 160 مللي ثانية، MIO 400-500 مللي ثانية في الآثار المنشورة</text>
</svg>