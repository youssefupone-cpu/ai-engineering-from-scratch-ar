<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .frozen { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .train { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .gate { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">فلامنغو - تقاطع الانتباه داخل 70B شينشيلا المجمدة LLM</text>

  <rect x="40" y="50" width="220" height="480" class="box"/>
  <text x="150" y="72" text-anchor="middle" class="head">صورة / فيديو pipeline</text>

  <rect x="60" y="92" width="180" height="50" class="frozen"/>
  <text x="150" y="114" text-anchor="middle" class="step">المجمدة فيت</text>
  <text x="150" y="130" text-anchor="middle" class="small">196-900 رقعة / صورة</text>

  <path d="M 150 148 L 150 172" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="180" width="180" height="100" class="train"/>
  <text x="150" y="202" text-anchor="middle" class="step">جهاز إعادة تشكيل الإدراك</text>
  <text x="150" y="220" text-anchor="middle" class="small">K = 64 الكامنة القابلة للتعلم</text>
  <text x="150" y="238" text-anchor="middle" class="small">عبر الاهتمام على بقع</text>
  <text x="150" y="256" text-anchor="middle" class="small">6 كتل، 64 مليون معلمة</text>
  <text x="150" y="272" text-anchor="middle" class="small">تم إصلاح 64 رمزًا</text>

  <path d="M 150 288 L 150 318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="328" width="180" height="60" class="cool"/>
  <text x="150" y="350" text-anchor="middle" class="step">64 رمزًا مرئيًا</text>
  <text x="150" y="368" text-anchor="middle" class="small">لكل صورة (أو لكل فيديو)</text>

  <rect x="60" y="408" width="180" height="110" class="box"/>
  <text x="150" y="428" text-anchor="middle" class="head">المدخلات المتغيرة</text>
  <text x="150" y="448" text-anchor="middle" class="small">الصورة: 196 رقعة -&gt; 64</text>
  <text x="150" y="464" text-anchor="middle" class="small">دقة عالية: 900 رقعة -&gt; 64</text>
  <text x="150" y="482" text-anchor="middle" class="small">فيديو: ت * 64</text>
  <text x="150" y="500" text-anchor="middle" class="small">شكل الإخراج: دائمًا K = 64</text>

  <path d="M 265 350 L 340 350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="345" y="50" width="570" height="480" class="box"/>
  <text x="630" y="72" text-anchor="middle" class="head">مجمد LLM مع وجود بوابات متقاطعة</text>

  <rect x="365" y="92" width="530" height="52" class="frozen"/>
  <text x="630" y="114" text-anchor="middle" class="step">LLM العناية الذاتية + FFN (المجموعة 1-4)</text>
  <text x="630" y="132" text-anchor="middle" class="small">طبقات شينشيلا 70B المجمدة</text>

  <rect x="365" y="154" width="530" height="80" class="gate"/>
  <text x="630" y="176" text-anchor="middle" class="step">GATED CROSS-تنبيه (مدرب)</text>
  <text x="390" y="200" class="small">y = tanh(alpha) * cross_attn(text, visual_tokens) + x</text>
  <text x="390" y="218" class="small">alpha init 0 -&gt; tanh(0) = 0 -&gt; الإخراج == الإدخال</text>
  <text x="390" y="234" class="small">-&gt; LLM القدرة النصية المحفوظة في الخطوة 0</text>

  <rect x="365" y="244" width="530" height="52" class="frozen"/>
  <text x="630" y="266" text-anchor="middle" class="step">LLM العناية الذاتية + FFN (المجموعة 5-8)</text>
  <text x="630" y="284" text-anchor="middle" class="small">تستمر الرموز النصية في الاهتمام الذاتي السببي</text>

  <rect x="365" y="306" width="530" height="80" class="gate"/>
  <text x="630" y="328" text-anchor="middle" class="step">GATED CROSS-تنبيه (مدرب)</text>
  <text x="390" y="352" class="small">مع زيادة ألفا، تمتزج المساهمة البصرية</text>
  <text x="390" y="370" class="small">ينتهي التدريب مع ألفا O(1-2)، تانه ~0.8</text>
  <text x="390" y="386" class="caption">تم إدراج كل طبقات M=4 LLM</text>

  <rect x="365" y="396" width="530" height="52" class="frozen"/>
  <text x="630" y="418" text-anchor="middle" class="step">LLM العناية الذاتية + FFN (المجموعة 9-12،...، ن)</text>

  <rect x="365" y="458" width="530" height="60" class="cool"/>
  <text x="630" y="478" text-anchor="middle" class="step">إجمالي الطبقات المتقاطعة: N/4</text>
  <text x="630" y="496" text-anchor="middle" class="small">لـ 70B LLM مع 80 طبقة -&gt; 20 جسرًا مسورًا</text>
  <text x="630" y="510" text-anchor="middle" class="small">المعلمات المدربات: ~10B / 80B إجمالاً</text>
</svg>