  <text x="480" y="250" text-anchor="middle" class="small">في كل خطوة توقع جميع الأقنعة بالتوازي، والتزم بثقة أعلى K</text>

  <rect x="30" y="290" width="900" height="230" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">Show-o مقابل البدائل</text>

  <rect x="50" y="330" width="210" height="180" class="hot"/>
  <text x="155" y="352" text-anchor="middle" class="step">الحرباء / Emu3</text>
  <text x="155" y="372" text-anchor="middle" class="small">منفصل + NTP</text>
  <text x="155" y="390" text-anchor="middle" class="small">1024 تمريرة أمامية</text>
  <text x="155" y="406" text-anchor="middle" class="small">~2 دقيقة / 512×512</text>
  <text x="155" y="430" text-anchor="middle" class="small">أبسط التدريب</text>
  <text x="155" y="448" text-anchor="middle" class="small">جودة مميزة</text>

  <rect x="280" y="330" width="210" height="180" class="cool"/>
  <text x="385" y="352" text-anchor="middle" class="step">شو-أو/ماسكجيت</text>
  <text x="385" y="372" text-anchor="middle" class="small">فرق منفصلة + ملثمين</text>
  <text x="385" y="390" text-anchor="middle" class="small">~16 تمريرة أمامية</text>
  <text x="385" y="406" text-anchor="middle" class="small">~4-8 ثانية / 512x512</text>
  <text x="385" y="430" text-anchor="middle" class="small">خسارة واحدة، نظيفة</text>
  <text x="385" y="448" text-anchor="middle" class="small">inpainting مجانا</text>

  <rect x="510" y="330" width="210" height="180" class="cold"/>
  <text x="615" y="352" text-anchor="middle" class="step">نقل الدم / MMDiT</text>
  <text x="615" y="372" text-anchor="middle" class="small">المستمر + الانتشار</text>
  <text x="615" y="390" text-anchor="middle" class="small">~20 تمريرة أمامية</text>
  <text x="615" y="406" text-anchor="middle" class="small">~5-10ث/512×512</text>
  <text x="615" y="430" text-anchor="middle" class="small">أعلى جودة</text>
  <text x="615" y="448" text-anchor="middle" class="small">خسارة مزدوجة لضبط</text>

  <rect x="740" y="330" width="180" height="180" class="reg"/>
  <text x="830" y="352" text-anchor="middle" class="step">انتشار مستقر</text>
  <text x="830" y="372" text-anchor="middle" class="small">كامنة مستمرة</text>
  <text x="830" y="390" text-anchor="middle" class="small">~20 تمريرة</text>
  <text x="830" y="406" text-anchor="middle" class="small">~2-5 ثانية / 512x512</text>
  <text x="830" y="430" text-anchor="middle" class="small">نموذج متخصص</text>
  <text x="830" y="448" text-anchor="middle" class="small">لا VQA/الاستدلال</text>
