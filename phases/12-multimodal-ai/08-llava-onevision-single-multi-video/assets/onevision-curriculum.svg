<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">LLaVA-OneVision — ميزانية رمزية موحدة ومنهج دراسي من ثلاث مراحل</text>

  <rect x="30" y="50" width="900" height="200" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">ميزانية الرمز المرئي المشترك ~ 4000 عبر ثلاثة سيناريوهات</text>

  <rect x="60" y="90" width="260" height="140" class="hot"/>
  <text x="190" y="110" text-anchor="middle" class="step">single-image</text>
  <text x="190" y="130" text-anchor="middle" class="small">AnyRes 9 مربعات + صورة مصغرة</text>
  <text x="190" y="146" text-anchor="middle" class="small">كل بلاطة 384، 2x حمام سباحة</text>
  <text x="190" y="162" text-anchor="middle" class="small">182 رمزًا لكل بلاطة</text>
  <text x="190" y="182" text-anchor="middle" class="step">المجموع 1820 رمزا</text>
  <text x="190" y="202" text-anchor="middle" class="small">إدراك + OCR + تفصيل</text>

  <rect x="340" y="90" width="260" height="140" class="cool"/>
  <text x="470" y="110" text-anchor="middle" class="step">multi-image</text>
  <text x="470" y="130" text-anchor="middle" class="small">6 صور في 384</text>
  <text x="470" y="146" text-anchor="middle" class="small">لا يوجد تجميع، 729 لكل صورة</text>
  <text x="470" y="162" text-anchor="middle" class="small">المنطق عبر الصورة</text>
  <text x="470" y="182" text-anchor="middle" class="step">المجموع 4374 رمزا</text>
  <text x="470" y="202" text-anchor="middle" class="small">قارن، عد، فرق</text>

  <rect x="620" y="90" width="280" height="140" class="cold"/>
  <text x="760" y="110" text-anchor="middle" class="step">video</text>
  <text x="760" y="130" text-anchor="middle" class="small">32 إطارًا بـ 384</text>
  <text x="760" y="146" text-anchor="middle" class="small">تجمع 3x -&gt; 81 لكل إطار</text>
  <text x="760" y="162" text-anchor="middle" class="small">التأريض الزمني</text>
  <text x="760" y="182" text-anchor="middle" class="step">المجموع 2592 رمزا</text>
  <text x="760" y="202" text-anchor="middle" class="small">الأحداث، تسجيل العمل</text>

  <rect x="30" y="270" width="900" height="250" class="box"/>
  <text x="480" y="292" text-anchor="middle" class="head">منهج ثلاثي المراحل + المهارات الناشئة</text>

  <rect x="60" y="310" width="200" height="190" class="reg"/>
  <text x="160" y="332" text-anchor="middle" class="step">المرحلة SI</text>
  <text x="160" y="354" text-anchor="middle" class="small">صورة واحدة فقط</text>
  <text x="160" y="370" text-anchor="middle" class="small">AnyRes عالية الدقة</text>
  <text x="160" y="390" text-anchor="middle" class="small">قاعدة الإدراك</text>
  <text x="160" y="410" text-anchor="middle" class="small">MMMU + OCR + تفصيل</text>
  <text x="160" y="444" text-anchor="middle" class="caption">ترتيب عكسي (الفيديو أولاً)</text>
  <text x="160" y="460" text-anchor="middle" class="caption">يخسر 2-4 MMMU</text>
  <text x="160" y="476" text-anchor="middle" class="caption">لكل عملية استئصال OneVision</text>

  <path d="M 265 410 L 325 410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="310" width="200" height="190" class="cool"/>
  <text x="430" y="332" text-anchor="middle" class="step">المرحلة OV</text>
  <text x="430" y="354" text-anchor="middle" class="small">50% مفردة</text>
  <text x="430" y="370" text-anchor="middle" class="small">30% صور متعددة</text>
  <text x="430" y="390" text-anchor="middle" class="small">فيديو 20%</text>
  <text x="430" y="410" text-anchor="middle" class="small">ميزانية موحدة</text>
  <text x="430" y="444" text-anchor="middle" class="caption">محاذاة عبر السيناريوهات</text>
  <text x="430" y="460" text-anchor="middle" class="caption">المنطق الهيكلي</text>

  <path d="M 535 410 L 595 410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="310" width="200" height="190" class="hot"/>
  <text x="700" y="332" text-anchor="middle" class="step">المرحلة TT</text>
  <text x="700" y="354" text-anchor="middle" class="small">مزيج خاص بالمهمة</text>
  <text x="700" y="370" text-anchor="middle" class="small">على سبيل المثال، الوكيل / المستند</text>
  <text x="700" y="390" text-anchor="middle" class="small">/ robotics / video</text>
  <text x="700" y="410" text-anchor="middle" class="small">لحن النشر</text>
  <text x="700" y="444" text-anchor="middle" class="caption">اختياري، يحافظ على القاعدة</text>

  <rect x="820" y="310" width="100" height="190" class="reg"/>
  <text x="870" y="332" text-anchor="middle" class="step">emergent</text>
  <text x="870" y="354" text-anchor="middle" class="small">multi-camera</text>
  <text x="870" y="370" text-anchor="middle" class="small">reasoning</text>
  <text x="870" y="390" text-anchor="middle" class="small">set-of-mark</text>
  <text x="870" y="406" text-anchor="middle" class="small">prompt</text>
  <text x="870" y="426" text-anchor="middle" class="small">شاشة ايفون</text>
  <text x="870" y="442" text-anchor="middle" class="small">agent</text>
  <text x="870" y="476" text-anchor="middle" class="caption">لا شيء مدرب</text>
</svg>