<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .soc { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hipaa { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .gdpr { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .eu { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .emerging { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM الامتثال — سبعة أطر عمل، ومصفوفة واحدة</text>

  <rect x="40" y="50" width="220" height="100" class="soc"/>
  <text x="150" y="72" text-anchor="middle" class="head">SOC 2 النوع II</text>
  <text x="150" y="92" text-anchor="middle" class="step">B2B خط الأساس SaaS</text>
  <text x="150" y="110" text-anchor="middle" class="small">ضوابط تشغيل لمدة 6-12 شهرًا</text>
  <text x="150" y="128" text-anchor="middle" class="small">النوع الأول هو بداية، وليس بوابة</text>

  <rect x="280" y="50" width="220" height="100" class="hipaa"/>
  <text x="390" y="72" text-anchor="middle" class="head">HIPAA</text>
  <text x="390" y="92" text-anchor="middle" class="step">BAA مطلوب لـ PHI</text>
  <text x="390" y="110" text-anchor="middle" class="small">بيدروك، أزور، فيرتكس، OpenAI، أنثروبي</text>
  <text x="390" y="128" text-anchor="middle" class="small">جميعها تقدم BAA</text>

  <rect x="520" y="50" width="220" height="100" class="gdpr"/>
  <text x="630" y="72" text-anchor="middle" class="head">GDPR</text>
  <text x="630" y="92" text-anchor="middle" class="step">تنقيح PII في الوقت الفعلي</text>
  <text x="630" y="110" text-anchor="middle" class="small">مرحلة ما بعد المعالجة لا يمكن الدفاع عنها</text>
  <text x="630" y="128" text-anchor="middle" class="small">كلير فيو AI 30.5 مليون يورو (2024)؛ OpenAI 15 مليون يورو (2024، ألغيت)</text>

  <rect x="760" y="50" width="160" height="100" class="box"/>
  <text x="840" y="72" text-anchor="middle" class="head">PCI-DSS</text>
  <text x="840" y="92" text-anchor="middle" class="step">نطاق بيانات الدفع</text>
  <text x="840" y="110" text-anchor="middle" class="small">التكوين + العقود</text>
  <text x="840" y="128" text-anchor="middle" class="small">لطبقة التفاعل AI</text>

  <rect x="40" y="170" width="340" height="120" class="eu"/>
  <text x="210" y="192" text-anchor="middle" class="head">EU AI القانون</text>
  <text x="60" y="216" class="step">· دخل حيز التنفيذ في 1 أغسطس 2024</text>
  <text x="60" y="234" class="step">· الإنفاذ عالي المخاطر في 2 أغسطس 2026</text>
  <text x="60" y="252" class="step">· غرامات تصل إلى 35 مليون يورو أو 7% من إجمالي المبيعات العالمية</text>
  <text x="60" y="270" class="step">· مستويات المخاطر: غير مقبول / مرتفع / محدود / الحد الأدنى</text>
  <text x="210" y="285" text-anchor="middle" class="caption">معظم B2B LLM SaaS محدودة المخاطر</text>

  <rect x="400" y="170" width="300" height="120" class="box"/>
  <text x="550" y="192" text-anchor="middle" class="head">قانون كولورادو AI</text>
  <text x="420" y="216" class="step">· اعتبارًا من 30 يونيو 2026 (متأخر)</text>
  <text x="420" y="234" class="step">· تقييمات الأثر</text>
  <text x="420" y="252" class="step">· الحق في استئناف قرارات AI</text>
  <text x="420" y="270" class="step">· فرجينيا مماثلة للائتمان / التوظيف</text>

  <rect x="720" y="170" width="200" height="120" class="emerging"/>
  <text x="820" y="192" text-anchor="middle" class="head">ISO 42001</text>
  <text x="820" y="212" text-anchor="middle" class="step">AI الحكم</text>
  <text x="820" y="230" text-anchor="middle" class="small">إدارة المخاطر</text>
  <text x="820" y="248" text-anchor="middle" class="small">transparency</text>
  <text x="820" y="266" text-anchor="middle" class="small">الرقابة البشرية</text>
  <text x="820" y="284" text-anchor="middle" class="caption">أزواج مع ISO 27001</text>

  <rect x="40" y="310" width="880" height="90" class="box"/>
  <text x="480" y="332" text-anchor="middle" class="head">رسم الخرائط عبر الإطارات - عنصر تحكم واحد يرضي الكثيرين</text>
  <text x="60" y="358" class="small">تسجيل الوصول: ISO 27001 A.5.15-18 · GDPR الفن. 32 · HIPAA §164.312(أ) · SOC 2 CC6</text>
  <text x="60" y="376" class="small">التشفير أثناء النقل: ISO A.8.24 · GDPR الفن. 32 · HIPAA §164.312(هـ) · PCI الطلب. 4</text>
  <text x="60" y="394" class="small">الاحتفاظ بسجل التدقيق: SOC 2 CC7 · HIPAA §164.312(b) · ISO أ.8.15</text>

  <rect x="40" y="410" width="880" height="80" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">الملف المرجعي — OpenAI 2026</text>
  <text x="480" y="454" text-anchor="middle" class="step">SOC 2 النوع 2 · ISO/IEC 27001:2022 · ISO/IEC 27701:2019 · GDPR · CCPA</text>
  <text x="480" y="474" text-anchor="middle" class="step">HIPAA (BAA) · FERPA · PCI-DSS (دفعات ChatGPT)</text>
</svg>