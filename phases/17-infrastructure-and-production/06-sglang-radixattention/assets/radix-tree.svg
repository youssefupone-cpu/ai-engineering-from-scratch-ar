<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">RadixAttention — KV ذاكرة التخزين المؤقت كشجرة، والمجدول كأداة تثبيت للفرع الساخن</text>

  <rect x="40" y="50" width="460" height="490" class="box"/>
  <text x="270" y="72" text-anchor="middle" class="head">شجرة الجذر</text>
  <rect x="210" y="90" width="120" height="30" class="cool"/>
  <text x="270" y="110" text-anchor="middle" class="step">SYSTEM (2000 توك)</text>
  <rect x="210" y="140" width="120" height="30" class="cool"/>
  <text x="270" y="160" text-anchor="middle" class="step">TOOLS (300 توك)</text>
  <line x1="270" y1="120" x2="270" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="80" y="200" width="110" height="30" class="cold"/>
  <text x="135" y="220" text-anchor="middle" class="step">وثيقة_أ (500)</text>
  <rect x="220" y="200" width="110" height="30" class="cold"/>
  <text x="275" y="220" text-anchor="middle" class="step">مستند_ب (500)</text>
  <rect x="360" y="200" width="110" height="30" class="cold"/>
  <text x="415" y="220" text-anchor="middle" class="step">مستند_C (500)</text>
  <line x1="270" y1="170" x2="135" y2="200" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="270" y1="170" x2="275" y2="200" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="270" y1="170" x2="415" y2="200" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="60" y="260" width="60" height="22" class="hot"/>
  <text x="90" y="276" text-anchor="middle" class="small">Q_1</text>
  <rect x="130" y="260" width="60" height="22" class="hot"/>
  <text x="160" y="276" text-anchor="middle" class="small">Q_2</text>
  <rect x="200" y="260" width="60" height="22" class="hot"/>
  <text x="230" y="276" text-anchor="middle" class="small">Q_3</text>
  <rect x="270" y="260" width="60" height="22" class="hot"/>
  <text x="300" y="276" text-anchor="middle" class="small">Q_4</text>
  <rect x="340" y="260" width="60" height="22" class="hot"/>
  <text x="370" y="276" text-anchor="middle" class="small">Q_5</text>
  <rect x="410" y="260" width="60" height="22" class="hot"/>
  <text x="440" y="276" text-anchor="middle" class="small">Q_6</text>

  <rect x="60" y="310" width="420" height="70" class="box"/>
  <text x="270" y="330" text-anchor="middle" class="step">طلب جديد: SYSTEM + TOOLS + DOC_B + Q_7</text>
  <text x="270" y="350" text-anchor="middle" class="small">السير على الشجرة: SYSTEM إعادة الاستخدام، TOOLS إعادة الاستخدام، إعادة استخدام DOC_B</text>
  <text x="270" y="366" text-anchor="middle" class="small">تخصيص كتل فقط لـ Q_7 (60 رمزًا، 4 كتل)</text>

  <rect x="60" y="390" width="420" height="60" class="cool"/>
  <text x="270" y="414" text-anchor="middle" class="step">تكلفة التعبئة المسبقة: 60 رمزًا بدلاً من 2860</text>
  <text x="270" y="432" text-anchor="middle" class="small">على البادئة الثقيلة RAG: ما يصل إلى 6.4x SGLang على vLLM</text>

  <rect x="60" y="460" width="420" height="70" class="hot"/>
  <text x="270" y="482" text-anchor="middle" class="step">سياسة الإخلاء</text>
  <text x="270" y="500" text-anchor="middle" class="small">مستوى الفرع LRU: طرد الأوراق بأكملها</text>
  <text x="270" y="518" text-anchor="middle" class="small">يحافظ على شكل ذاكرة التخزين المؤقت مطابقًا لشكل الشجرة</text>

  <rect x="520" y="50" width="400" height="490" class="box"/>
  <text x="720" y="72" text-anchor="middle" class="head">جدولة ذاكرة التخزين المؤقت</text>
  <rect x="540" y="90" width="360" height="70" class="cold"/>
  <text x="720" y="112" text-anchor="middle" class="step">FCFS خطأ بالنسبة لحركة المرور الكثيفة بالبادئة</text>
  <text x="720" y="130" text-anchor="middle" class="small">يخدم الطلبات في ترتيب الوصول</text>
  <text x="720" y="146" text-anchor="middle" class="small">يطرد الفروع الساخنة قبل إعادة استخدامها</text>
  <rect x="540" y="170" width="360" height="80" class="cool"/>
  <text x="720" y="192" text-anchor="middle" class="step">عمق الإرسال الأول</text>
  <text x="720" y="210" text-anchor="middle" class="small">تفضل الطلبات المتجذرة في الفرع قيد التشغيل</text>
  <text x="720" y="226" text-anchor="middle" class="small">إبقاء الفرع الساخن مقيمًا؛ تيار الأخوة</text>
  <text x="720" y="242" text-anchor="middle" class="small">يقارب اجتياز عمق الجذر أولاً</text>

  <rect x="540" y="260" width="360" height="120" class="dsk"/>
  <text x="720" y="282" text-anchor="middle" class="step">أرقام (2026)</text>
  <text x="720" y="302" text-anchor="middle" class="small">اللاما 3.1 8B H100 ShareGPT 1K:</text>
  <text x="720" y="318" text-anchor="middle" class="small">SGLang ~16,200 توك/ثانية مقابل vLLM ~12,500 (+29%)</text>
  <text x="720" y="336" text-anchor="middle" class="small">بادئة ثقيلة RAG: حتى 6.4x</text>
  <text x="720" y="352" text-anchor="middle" class="small">استنساخ الصوت: 86.4% معدل ضرب البادئة في ذاكرة التخزين المؤقت</text>
  <text x="720" y="368" text-anchor="middle" class="small">الإنتاج: 50-99% حسب نوع القالب</text>

  <rect x="540" y="390" width="360" height="140" class="hot"/>
  <text x="720" y="412" text-anchor="middle" class="step">مسكتك - الطلب الفوري</text>
  <text x="720" y="432" text-anchor="middle" class="small">[النظام، الأدوات، السياق] ≠ [النظام، السياق، الأدوات]</text>
  <text x="720" y="450" text-anchor="middle" class="small">ترى الشجرة طريقين متميزين</text>
  <text x="720" y="466" text-anchor="middle" class="small">يختفي 6.4x، ويعود إلى الإنتاجية vLLM</text>
  <text x="720" y="488" text-anchor="middle" class="step">رافعة المهندس: إصلاح القالب</text>
  <text x="720" y="506" text-anchor="middle" class="small">غير قابل للتغيير أولاً (النظام، الأدوات، المخططات)</text>
  <text x="720" y="520" text-anchor="middle" class="small">إدخال المستخدم الأخير؛ الحالة الحقيقية 7% إلى 74% في تغيير واحد</text>
</svg>