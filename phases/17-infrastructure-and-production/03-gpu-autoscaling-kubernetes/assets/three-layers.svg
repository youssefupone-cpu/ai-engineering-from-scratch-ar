<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .node { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .sched { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .app { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">GPU القياس التلقائي — ثلاث طبقات، وليس طبقة واحدة</text>

  <rect x="40" y="50" width="280" height="480" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">الطبقة 1 — node التزويد</text>
  <rect x="60" y="90" width="240" height="70" class="node"/>
  <text x="180" y="112" text-anchor="middle" class="step">Karpenter</text>
  <text x="180" y="130" text-anchor="middle" class="small">الأحكام nodes على القرون المعلقة</text>
  <text x="180" y="146" text-anchor="middle" class="small">45-60 ثانية (مقابل CA 90-120 ثانية)</text>
  <rect x="60" y="170" width="240" height="90" class="bad"/>
  <text x="180" y="192" text-anchor="middle" class="step">فخ التوحيد</text>
  <text x="180" y="210" text-anchor="middle" class="small">WhenEmptyOrUnderutilized</text>
  <text x="180" y="226" text-anchor="middle" class="small">طرد تشغيل GPU وظائف</text>
  <text x="180" y="244" text-anchor="middle" class="small">يفقد دقائق من القدرة</text>
  <rect x="60" y="270" width="240" height="100" class="node"/>
  <text x="180" y="292" text-anchor="middle" class="step">الإعداد الآمن</text>
  <text x="180" y="310" text-anchor="middle" class="small">consolidationPolicy:</text>
  <text x="180" y="326" text-anchor="middle" class="small">WhenEmpty</text>
  <text x="180" y="342" text-anchor="middle" class="small">الدمج بعد: 1 ساعة</text>
  <text x="180" y="358" text-anchor="middle" class="small">العيب GPU nodes</text>
  <text x="180" y="400" text-anchor="middle" class="caption">يختار نوع المثيل ديناميكيًا</text>

  <rect x="340" y="50" width="280" height="480" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">الطبقة الثانية - جدولة المجموعة</text>
  <rect x="360" y="90" width="240" height="70" class="sched"/>
  <text x="480" y="112" text-anchor="middle" class="step">KAI المجدول</text>
  <text x="480" y="130" text-anchor="middle" class="small">secondary إلى جدولة kube</text>
  <text x="480" y="146" text-anchor="middle" class="small">قم بتعليق أعباء العمل للاشتراك فيها</text>
  <rect x="360" y="170" width="240" height="100" class="sched"/>
  <text x="480" y="192" text-anchor="middle" class="step">جدولة العصابة</text>
  <text x="480" y="210" text-anchor="middle" class="small">موضع كل شيء أو لا شيء</text>
  <text x="480" y="226" text-anchor="middle" class="small">يمنع 7 من 8 فخ الخمول</text>
  <text x="480" y="244" text-anchor="middle" class="small">تأجيل الكل إذا لم يكن مناسبًا للجميع</text>
  <rect x="360" y="280" width="240" height="80" class="sched"/>
  <text x="480" y="302" text-anchor="middle" class="step">الوعي بالطوبولوجيا</text>
  <text x="480" y="320" text-anchor="middle" class="small">NVLink / IB / موضع الرف</text>
  <text x="480" y="336" text-anchor="middle" class="small">TP-8 يبقى على مجال NVLink واحد</text>
  <rect x="360" y="370" width="240" height="90" class="sched"/>
  <text x="480" y="392" text-anchor="middle" class="step">الطوابير الهرمية</text>
  <text x="480" y="410" text-anchor="middle" class="small">أولوية الفريق المتعدد + الحصة</text>
  <text x="480" y="426" text-anchor="middle" class="small">قواعد الشفعة لكل قائمة انتظار</text>
  <text x="480" y="442" text-anchor="middle" class="small">تكامل حزمة الإنتاج Ray + vLLM</text>

  <rect x="640" y="50" width="280" height="480" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">الطبقة 3 - إشارات التطبيق</text>
  <rect x="660" y="90" width="240" height="80" class="bad"/>
  <text x="780" y="112" text-anchor="middle" class="step">HPA فخ</text>
  <text x="780" y="130" text-anchor="middle" class="small">DCGM_FI_DEV_GPU_UTIL</text>
  <text x="780" y="146" text-anchor="middle" class="small">دورة العمل، NOT الحمل</text>
  <text x="780" y="162" text-anchor="middle" class="small">100% = 10 أو 100 طلب</text>
  <rect x="660" y="180" width="240" height="100" class="app"/>
  <text x="780" y="202" text-anchor="middle" class="step">الإشارات الصحيحة</text>
  <text x="780" y="220" text-anchor="middle" class="small">عمق قائمة الانتظار</text>
  <text x="780" y="236" text-anchor="middle" class="small">KV استخدام ذاكرة التخزين المؤقت</text>
  <text x="780" y="252" text-anchor="middle" class="small">لكل نسخة متماثلة P99 TTFT</text>
  <text x="780" y="268" text-anchor="middle" class="small">مساهمة جيدة (SLO-الاجتماع RPS)</text>
  <rect x="660" y="290" width="240" height="90" class="app"/>
  <text x="780" y="312" text-anchor="middle" class="step">مخطط الدينامو</text>
  <text x="780" y="330" text-anchor="middle" class="small">المقاييس على إشارات الاستدلال</text>
  <text x="780" y="346" text-anchor="middle" class="small">معدل التطابقات المسبقة: نسبة فك التشفير</text>
  <text x="780" y="362" text-anchor="middle" class="small">يفي بـ SLOs، وليس دورة العمل</text>
  <rect x="660" y="390" width="240" height="90" class="app"/>
  <text x="780" y="412" text-anchor="middle" class="step">إلم-د WVA</text>
  <text x="780" y="430" text-anchor="middle" class="small">المقياس التلقائي المتغير لحجم العمل</text>
  <text x="780" y="446" text-anchor="middle" class="small">التعبئة المسبقة المفصلة + فك التشفير</text>
  <text x="780" y="462" text-anchor="middle" class="small">لكل دور HPA</text>

  <rect x="40" y="540" width="880" height="30" class="box"/>
  <text x="480" y="558" text-anchor="middle" class="step">قم بتأليف الثلاثة - كل واحد منهم غير كافٍ لمجموعة GPU حقيقية</text>
</svg>