<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cheap { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .front { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .signal { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">توجيه النموذج - أربع إشارات وثلاثة أنماط</text>

  <rect x="40" y="50" width="280" height="220" class="signal"/>
  <text x="180" y="72" text-anchor="middle" class="head">signals</text>
  <rect x="60" y="90" width="240" height="35" class="box"/>
  <text x="180" y="112" text-anchor="middle" class="step">1. تصنيف المهام</text>
  <rect x="60" y="130" width="240" height="35" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="step">2. طول المطالبة</text>
  <rect x="60" y="170" width="240" height="35" class="box"/>
  <text x="180" y="192" text-anchor="middle" class="step">3. التضمين إلى المعروف الثابت</text>
  <rect x="60" y="210" width="240" height="35" class="box"/>
  <text x="180" y="232" text-anchor="middle" class="step">4. الثقة بالنفس (logprobs)</text>
  <text x="180" y="258" text-anchor="middle" class="caption">الجمع بين الأربعة. كل وحده تفتقد</text>

  <rect x="340" y="50" width="280" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">النمط: CASCADE (الرخيص أولاً)</text>
  <rect x="360" y="90" width="240" height="45" class="cheap"/>
  <text x="480" y="115" text-anchor="middle" class="step">نموذج رخيص (فئة هايكو)</text>
  <text x="480" y="130" text-anchor="middle" class="small">إدخال 0.25 دولار/م، إخراج 1 دولار/م</text>
  <rect x="360" y="150" width="240" height="35" class="signal"/>
  <text x="480" y="172" text-anchor="middle" class="step">فحص الثقة</text>
  <rect x="360" y="200" width="240" height="60" class="front"/>
  <text x="480" y="222" text-anchor="middle" class="step">الحدود فقط إذا كانت الثقة منخفضة</text>
  <text x="480" y="240" text-anchor="middle" class="small">~10% تصاعدت في حركة المرور المختلطة</text>
  <text x="480" y="254" text-anchor="middle" class="small">~2x زمن الاستجابة عند التصعيد</text>

  <rect x="640" y="50" width="280" height="220" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">النمط: PRE_ROUTE</text>
  <text x="780" y="94" text-anchor="middle" class="small">المصنف في المقدمة (5-10 مللي ثانية)</text>
  <rect x="660" y="110" width="240" height="45" class="cheap"/>
  <text x="780" y="135" text-anchor="middle" class="step">رخيصة للبساطة</text>
  <rect x="660" y="170" width="240" height="45" class="front"/>
  <text x="780" y="195" text-anchor="middle" class="step">الحدود الصعبة</text>
  <text x="780" y="230" text-anchor="middle" class="caption">الأسرع بشكل عام، تعتمد جودة الأرضية على دقة المصنف</text>

  <rect x="40" y="290" width="880" height="100" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">منحنى الأسعار 2026</text>
  <text x="480" y="334" text-anchor="middle" class="step">GPT-جودة ذات 4 مستويات: 20 دولارًا أمريكيًا/شهريًا (أواخر عام 2022) → 0.40 دولارًا أمريكيًا/شهريًا (2026) ≈ أرخص بـ 50 مرة</text>
  <text x="480" y="352" text-anchor="middle" class="step">إجمالي LLM انخفاض السعر: ~10x سنويًا، يخدم معظمها الكفاءة (المرحلة 17 · 04-09)</text>
  <text x="480" y="372" text-anchor="middle" class="caption">يلتقط التوجيه تلك المكاسب في طبقة التطبيق</text>

  <rect x="40" y="410" width="880" height="80" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">الانجراف هو الخطر الحقيقي</text>
  <text x="480" y="454" text-anchor="middle" class="step">المراقبة: ممتاز/لأسفل لكل مسار · LLM-عينة الحكم لكل مسار · معدل التصعيد · معدل الرفض</text>
  <text x="480" y="474" text-anchor="middle" class="caption">يظل زحف النموذج الرخيص صامتًا حتى يظهر عليه معيار منافس</text>
</svg>