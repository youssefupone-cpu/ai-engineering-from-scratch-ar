<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .control { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .target { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .safety { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .obs { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">هندسة الفوضى لـ LLMs - أربع مستويات + حلقة ردود الفعل</text>

  <rect x="40" y="50" width="220" height="180" class="control"/>
  <text x="150" y="72" text-anchor="middle" class="head">طائرة التحكم</text>
  <text x="150" y="92" text-anchor="middle" class="step">جدولة التجربة</text>
  <text x="60" y="116" class="small">· سير العمل LitmusChaos</text>
  <text x="60" y="134" class="small">· الفوضى شبكة CRDs</text>
  <text x="60" y="152" class="small">· تسخير UI</text>
  <text x="60" y="170" class="small">· AWS FIS / أزور كايوس ستوديو</text>
  <text x="150" y="200" text-anchor="middle" class="caption">الجداول الزمنية والمعلمات والإيقاع</text>

  <rect x="280" y="50" width="220" height="180" class="target"/>
  <text x="390" y="72" text-anchor="middle" class="head">الطائرة المستهدفة</text>
  <text x="390" y="92" text-anchor="middle" class="step">الخدمات + البنية التحتية + البيانات</text>
  <text x="300" y="116" class="small">· القرون، nodes، LB</text>
  <text x="300" y="134" class="small">· مخازن البيانات، المتجه DB</text>
  <text x="300" y="152" class="small">· LLM البوابات</text>
  <text x="300" y="170" class="small">· مقدمي المنبع</text>

  <rect x="520" y="50" width="220" height="180" class="safety"/>
  <text x="630" y="72" text-anchor="middle" class="head">طائرة السلامة</text>
  <text x="630" y="92" text-anchor="middle" class="step">حراس + إحباط</text>
  <text x="540" y="116" class="small">· بوابة معدل الحرق (&gt; ميزانية 2x)</text>
  <text x="540" y="134" class="small">· غطاء نصف قطر الانفجار</text>
  <text x="540" y="152" class="small">· نوافذ القمع</text>
  <text x="540" y="170" class="small">· تتبع-ID وضع العلامات</text>
  <text x="540" y="188" class="small">· قتل التبديل</text>

  <rect x="760" y="50" width="160" height="180" class="obs"/>
  <text x="840" y="72" text-anchor="middle" class="head">observability</text>
  <text x="840" y="92" text-anchor="middle" class="step">آثار + المقاييس</text>
  <text x="780" y="116" class="small">· يميز</text>
  <text x="780" y="134" class="small">  الفوضى الناجمة عن</text>
  <text x="780" y="152" class="small">  الإخفاقات الطبيعية</text>
  <text x="780" y="170" class="small">· تتبع ID الارتباط</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">خمس تجارب خاصة بـ LLM</text>
  <text x="60" y="308" class="step">1. الحمل الزائد للذاكرة (KV العاصفة الاستباقية)</text>
  <text x="60" y="326" class="step">2. فشل الشبكة (قطع البوابة ↔ المزود)</text>
  <text x="60" y="344" class="step">3. انقطاع الخدمة (100% 429)</text>
  <text x="500" y="308" class="step">4. رسالة مشوهة (قنبلة رمزية)</text>
  <text x="500" y="326" class="step">5. KV عاصفة الإخلاء (إعادة التعبئة المسبقة المتتالية للقوة)</text>

  <rect x="40" y="380" width="880" height="80" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">cadence</text>
  <text x="480" y="424" text-anchor="middle" class="step">كناري أسبوعي + مراجعة SLO · يوم اللعبة الشهري + تشريح الجثة · تدقيق ربع سنوي + خريطة Dep</text>
  <text x="480" y="444" text-anchor="middle" class="caption">بدون SLI/SLO + إمكانية الملاحظة + العودة إلى الحالة السابقة + دفاتر التشغيل + عند الطلب، لا تعمل في الإنتاج</text>
</svg>