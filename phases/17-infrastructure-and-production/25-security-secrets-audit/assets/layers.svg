<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .vault { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .pii { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .net { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .audit { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM الأمان — أربع طبقات، انعدام الثقة افتراضيًا</text>

  <rect x="40" y="50" width="220" height="180" class="vault"/>
  <text x="150" y="72" text-anchor="middle" class="head">أسرار (الخزنة)</text>
  <text x="60" y="96" class="step">· قبو HashiCorp</text>
  <text x="60" y="114" class="step">· AWS مدير الأسرار</text>
  <text x="60" y="132" class="step">· أزور مفتاح المدفن</text>
  <text x="60" y="150" class="step">· GCP المدير السري</text>
  <text x="60" y="178" class="small">IAM دور + قصير العمر</text>
  <text x="60" y="196" class="small">OIDC لـ CI/CD</text>
  <text x="60" y="214" class="small">التناوب ≥ 90 يومًا</text>

  <rect x="280" y="50" width="220" height="180" class="pii"/>
  <text x="390" y="72" text-anchor="middle" class="head">PII الغسل</text>
  <text x="300" y="96" class="step">· بريسيديو / سباسي NER</text>
  <text x="300" y="114" class="step">· التعبير العادي (SSN، البريد الإلكتروني، الهاتف)</text>
  <text x="300" y="132" class="step">· الترميز متسقة</text>
  <text x="300" y="150" class="step">· نهج مش</text>
  <text x="300" y="178" class="small">نفس القيمة → نفس العنصر النائب</text>
  <text x="300" y="196" class="small">يحافظ على دلالات LLM</text>
  <text x="300" y="214" class="small">عكس رسم الخرائط اختياري</text>

  <rect x="520" y="50" width="220" height="180" class="net"/>
  <text x="630" y="72" text-anchor="middle" class="head">خروج الشبكة</text>
  <text x="540" y="96" class="step">القائمة البيضاء فقط:</text>
  <text x="540" y="114" class="step">  api.openai.com</text>
  <text x="540" y="132" class="step">  api.anthropic.com</text>
  <text x="540" y="150" class="step">  نقاط نهاية القبو</text>
  <text x="540" y="168" class="step">  المتجه DB</text>
  <text x="540" y="196" class="small">DNS القائمة المسموح بها فقط</text>
  <text x="540" y="214" class="small">يمنع خروج الأنفاق</text>

  <rect x="760" y="50" width="160" height="180" class="audit"/>
  <text x="840" y="72" text-anchor="middle" class="head">سجل التدقيق</text>
  <text x="780" y="96" class="step">append-only</text>
  <text x="780" y="114" class="step">لكل مكالمة:</text>
  <text x="780" y="132" class="small">· المستخدم / المستأجر</text>
  <text x="780" y="148" class="small">· موجه/التجزئة التجزئة</text>
  <text x="780" y="164" class="small">· الرموز + التكلفة</text>
  <text x="780" y="180" class="small">· رحلات الدرابزين</text>
  <text x="780" y="204" class="small">SOC2: سنة واحدة</text>
  <text x="780" y="220" class="small">HIPAA: 6 سنوات</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">نمط البوابة (المرحلة 17 · 19)</text>
  <text x="480" y="304" text-anchor="middle" class="step">التطبيق → البوابة → مزود النموذج</text>
  <text x="480" y="322" text-anchor="middle" class="step">تقوم البوابة بسحب بيانات الاعتماد من المخزن في وقت التشغيل</text>
  <text x="480" y="340" text-anchor="middle" class="caption">قم بالتدوير في المخزن ← يتم التقاط التطبيقات في دقائق؛ لا إعادة الانتشار</text>

  <rect x="40" y="380" width="880" height="110" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">سائق الحادث 2026</text>
  <text x="480" y="424" text-anchor="middle" class="step">هجوم سلسلة التوريد لشركة Vercel: تم اختراق بيانات اعتماد CI/CD</text>
  <text x="480" y="444" text-anchor="middle" class="step">env vars المفلترة عبر الآلاف من عمليات نشر العملاء</text>
  <text x="480" y="464" text-anchor="middle" class="caption">CI/CD الاعتمادات مكافئة للمنتج؛ تخزينها في قبو، نطاق ضيق، تدوير بقوة</text>
</svg>