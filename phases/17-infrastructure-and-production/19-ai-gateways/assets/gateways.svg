<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .gw { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .feat { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .scale { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">AI بوابات - سبع ميزات، وأربعة قادة لعام 2026</text>

  <rect x="40" y="50" width="280" height="220" class="feat"/>
  <text x="180" y="72" text-anchor="middle" class="head">الميزات الأساسية</text>
  <text x="60" y="96" class="step">· توجيه المزود</text>
  <text x="60" y="116" class="step">· السلاسل الاحتياطية</text>
  <text x="60" y="136" class="step">· إعادة المحاولة (التراجع)</text>
  <text x="60" y="156" class="step">· حدود الأسعار (لكل مستأجر)</text>
  <text x="60" y="176" class="step">· المراجع السرية</text>
  <text x="60" y="196" class="step">· إمكانية الملاحظة (OTel)</text>
  <text x="60" y="216" class="step">· حواجز الحماية (PII، الهروب من السجن)</text>
  <text x="180" y="250" text-anchor="middle" class="caption">جميعها السبعة إلزامية على نطاق المؤسسة</text>

  <rect x="340" y="50" width="280" height="220" class="gw"/>
  <text x="480" y="72" text-anchor="middle" class="head">2026 بوابات</text>
  <rect x="360" y="90" width="240" height="35" class="box"/>
  <text x="480" y="112" text-anchor="middle" class="step">LiteLLM — MIT، بايثون</text>
  <rect x="360" y="132" width="240" height="35" class="box"/>
  <text x="480" y="154" text-anchor="middle" class="step">بورتكي – أباتشي 2.0، حواجز حماية</text>
  <rect x="360" y="174" width="240" height="35" class="box"/>
  <text x="480" y="196" text-anchor="middle" class="step">بوابة كونغ AI — المؤسسة</text>
  <rect x="360" y="216" width="240" height="35" class="box"/>
  <text x="480" y="238" text-anchor="middle" class="step">Cloudflare / Vercel - تتم إدارة الحافة</text>

  <rect x="640" y="50" width="280" height="220" class="scale"/>
  <text x="780" y="72" text-anchor="middle" class="head">النطاق + النفقات العامة (معيار كونغ)</text>
  <text x="660" y="96" class="step">كونغ: ~5 مللي ثانية (خط الأساس)</text>
  <text x="660" y="116" class="step">LiteLLM: ~10 مللي ثانية حمل (فواصل &gt; 2K RPS)</text>
  <text x="660" y="136" class="step">Portkey: حوالي 30 مللي ثانية</text>
  <text x="660" y="156" class="step">Cloudflare: ~2 مللي ثانية (الحافة)</text>
  <text x="660" y="190" class="small">كونغ أسرع بنسبة 228% من Portkey</text>
  <text x="660" y="208" class="small">كونغ أسرع بنسبة 859% من LiteLLM</text>
  <text x="660" y="226" class="small">في نفس 12 CPUs</text>
  <text x="780" y="258" text-anchor="middle" class="caption">LiteLLM للتطوير، كونغ لمقياس الإنتاج</text>

  <rect x="40" y="290" width="440" height="130" class="box"/>
  <text x="260" y="312" text-anchor="middle" class="head">إقامة البيانات تدفع المضيف الذاتي</text>
  <text x="60" y="338" class="step">الرعاية الصحية / التمويل → استضافة ذاتية</text>
  <text x="60" y="356" class="step">  LiteLLM OSS، بورتكي OSS، كونغ OSS</text>
  <text x="60" y="374" class="step">المستهلك → الحافة المدارة</text>
  <text x="60" y="392" class="step">  بوابة Cloudflare AI، Vercel AI</text>
  <text x="60" y="410" class="caption">انتقل Portkey Apache 2.0 مارس 2026 إلى الطبقة الوسطى</text>

  <rect x="500" y="290" width="420" height="130" class="box"/>
  <text x="710" y="312" text-anchor="middle" class="head">التأليف باستخدام المرحلة 17 · 13 + 16</text>
  <text x="520" y="338" class="step">البوابة (19) + إمكانية الملاحظة (13) + التوجيه (16)</text>
  <text x="520" y="356" class="step">في كثير من الأحيان نفس الأداة:</text>
  <text x="520" y="374" class="step">  Portkey = البوابة + إمكانية المراقبة + حواجز الحماية</text>
  <text x="520" y="392" class="step">  Helicone = البوابة + إمكانية المراقبة</text>
  <text x="520" y="410" class="caption">اختر واحدة، أو قم بتوصيل ثلاثة باستخدام OpenTelemetry</text>

  <rect x="40" y="440" width="880" height="50" class="box"/>
  <text x="480" y="462" text-anchor="middle" class="step">الحساب الاحتياطي — OpenAI 3% × إنساني 2% = 0.06% كلاهما فاشلان</text>
  <text x="480" y="480" text-anchor="middle" class="caption">سلسلة موفرين ثلاثية توفر 99.997% بشكل فعال</text>
</svg>