<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .pre { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .dec { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .router { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">التعبئة المسبقة المفصلة + فك التشفير — NVIDIA دينامو / llm-d</text>

  <rect x="40" y="60" width="140" height="70" class="router"/>
  <text x="110" y="82" text-anchor="middle" class="head">router</text>
  <text x="110" y="100" text-anchor="middle" class="small">cache-aware</text>
  <text x="110" y="116" text-anchor="middle" class="small">+ SLA مخطط</text>

  <rect x="240" y="60" width="260" height="120" class="pre"/>
  <text x="370" y="82" text-anchor="middle" class="head">تجمع التعبئة المسبقة - مرتبط بالحساب</text>
  <text x="370" y="102" text-anchor="middle" class="step">H100 / B200</text>
  <text x="250" y="122" class="small">· ماتمول الثقيل إلى الأمام</text>
  <text x="250" y="138" class="small">· FLOPs محدودة</text>
  <text x="250" y="154" class="small">· مقياس على عمق قائمة الانتظار</text>
  <text x="370" y="174" text-anchor="middle" class="caption">~2000 TFLOPS FP8 مفيد</text>

  <rect x="640" y="60" width="260" height="120" class="dec"/>
  <text x="770" y="82" text-anchor="middle" class="head">تجمع فك التشفير - مرتبط بالذاكرة</text>
  <text x="770" y="102" text-anchor="middle" class="step">H200 أو الكمية العدوانية</text>
  <text x="650" y="122" class="small">· رمز واحد لكل إيتر، جميع الأوزان</text>
  <text x="650" y="138" class="small">· HBM-نطاق ترددي محدود</text>
  <text x="650" y="154" class="small">· مقياس الاستخدام KV</text>
  <text x="770" y="174" text-anchor="middle" class="caption">~3 TB/s HBM3 السقف</text>

  <path class="arrow" d="M180 95 L 235 95"/>
  <text x="210" y="88" text-anchor="middle" class="small">prompt</text>
  <path class="arrow" d="M500 95 L 635 95"/>
  <text x="568" y="78" text-anchor="middle" class="step">NIXL</text>
  <text x="568" y="108" text-anchor="middle" class="small">KV نقل</text>
  <text x="568" y="125" text-anchor="middle" class="small">RDMA أو TCP</text>

  <rect x="40" y="210" width="440" height="110" class="box"/>
  <text x="260" y="232" text-anchor="middle" class="head">NVIDIA دينامو</text>
  <text x="60" y="256" class="small">· يقع فوق vLLM / SGLang / TRT-LLM</text>
  <text x="60" y="274" class="small">· مخطط التعريف + SLA التكوينات التلقائية للمخطط</text>
  <text x="60" y="292" class="small">· Rust النواة، قابلية التوسعة في بايثون</text>
  <text x="60" y="310" class="small">· 30x على DeepSeek-R1; 50x MoE في GB300 NVL72</text>

  <rect x="500" y="210" width="420" height="110" class="box"/>
  <text x="710" y="232" text-anchor="middle" class="head">إل إم-د (ريد هات + AWS)</text>
  <text x="520" y="256" class="small">· خدمات Kubernetes الأصلية لكل دور</text>
  <text x="520" y="274" class="small">· packDomain: رف لمنطقة KV</text>
  <text x="520" y="292" class="small">· لكل دور HPA (قائمة الانتظار / KV فائدة)</text>
  <text x="520" y="310" class="small">· 0.5: التسلسل الهرمي KV، LoRA التوجيه، UCCL</text>

  <rect x="40" y="340" width="880" height="110" class="box"/>
  <text x="480" y="362" text-anchor="middle" class="head">عندما يؤتي ثماره</text>
  <text x="480" y="386" text-anchor="middle" class="step">المطالبات &gt; 512 رمزًا مميزًا AND مخرجات &gt; 200 رمزًا مميزًا</text>
  <text x="480" y="404" text-anchor="middle" class="step">خدمة MoE (DeepSeek-V3، المتغيرات المستقبلية GPT-5) - فوز مزدوج في توجيه الخبراء</text>
  <text x="480" y="424" text-anchor="middle" class="step">الحالة الحقيقية: 2 مليون دولار → 1.2 مليون دولار في السنة على نفس عبء العمل، نفس SLA، لا توجد أجهزة جديدة</text>
  <text x="480" y="444" text-anchor="middle" class="caption">مطالبات قصيرة: ضريبة النقل تهيمن، لا تفصل</text>
</svg>