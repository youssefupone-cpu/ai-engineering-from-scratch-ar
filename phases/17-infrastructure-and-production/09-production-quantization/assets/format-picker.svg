<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">تنسيقات التكميم - اختر حسب الأجهزة والمحرك وعبء العمل</text>

  <rect x="40" y="50" width="440" height="240" class="box"/>
  <text x="260" y="72" text-anchor="middle" class="head">شجرة القطف</text>
  <rect x="60" y="90" width="400" height="35" class="cool"/>
  <text x="260" y="112" text-anchor="middle" class="step">CPU / الحافة؟ → GGUF Q4_K_M (llama.cpp)</text>
  <rect x="60" y="130" width="400" height="35" class="cold"/>
  <text x="260" y="152" text-anchor="middle" class="step">عبء العمل المنطقي؟ → FP8 (vLLM أو TRT-LLM)</text>
  <rect x="60" y="170" width="400" height="35" class="dsk"/>
  <text x="260" y="192" text-anchor="middle" class="step">متعدد-LoRA في vLLM؟ → GPTQ-Int4 + مارلين</text>
  <rect x="60" y="210" width="400" height="35" class="hot"/>
  <text x="260" y="232" text-anchor="middle" class="step">محادثة روتينية، GPU؟ → AWQ-Int4 + مارلين</text>
  <rect x="60" y="250" width="400" height="35" class="box"/>
  <text x="260" y="272" text-anchor="middle" class="step">بلاكويل، التحقق من الجودة؟ → NVFP4 + FP8 KV</text>

  <rect x="500" y="50" width="420" height="240" class="box"/>
  <text x="710" y="72" text-anchor="middle" class="head">المصيدة رقم 1 - ذاكرة التخزين المؤقت KV</text>
  <rect x="520" y="90" width="380" height="70" class="hot"/>
  <text x="710" y="112" text-anchor="middle" class="step">AWQ يقلص الأوزان، وليس KV</text>
  <text x="710" y="130" text-anchor="middle" class="small">70B AWQ الأوزان: ~35 GB</text>
  <text x="710" y="144" text-anchor="middle" class="small">KV عند 128 conc / 2k ctx: ~20-30 GB</text>
  <rect x="520" y="170" width="380" height="60" class="cool"/>
  <text x="710" y="192" text-anchor="middle" class="step">الميزانية HBM بشكل كلي</text>
  <text x="710" y="210" text-anchor="middle" class="small">الأوزان + KV + التنشيطات</text>
  <text x="710" y="226" text-anchor="middle" class="small">FP8 KV يشتري مدخرات مكافئة لأوزان AWQ</text>
  <rect x="520" y="240" width="380" height="50" class="cold"/>
  <text x="710" y="262" text-anchor="middle" class="step">KV التكميم هو خيار منفصل</text>
  <text x="710" y="280" text-anchor="middle" class="small">يؤثر على دقة الانتباه بشكل مباشر</text>

  <rect x="40" y="310" width="440" height="220" class="box"/>
  <text x="260" y="332" text-anchor="middle" class="head">المصيدة رقم 2 — مجموعة بيانات المعايرة</text>
  <rect x="60" y="350" width="400" height="60" class="hot"/>
  <text x="260" y="372" text-anchor="middle" class="step">AWQ وGPTQ تتم المعايرة على C4/Wiki بشكل افتراضي</text>
  <text x="260" y="390" text-anchor="middle" class="small">لنماذج المجال: يتم حماية الأوزان الخاطئة</text>
  <text x="260" y="404" text-anchor="middle" class="small">Pass@1 على HumanEval يمكن أن يخسر 3-5 نقاط</text>
  <rect x="60" y="420" width="400" height="60" class="cool"/>
  <text x="260" y="442" text-anchor="middle" class="step">الإصلاح: معايرة البيانات الموجودة في المجال</text>
  <text x="260" y="460" text-anchor="middle" class="small">بضع مئات من العينات عادة ما تكون كافية</text>
  <text x="260" y="474" text-anchor="middle" class="small">اختبر دائمًا مجموعة Eval قبل الشحن</text>
  <rect x="60" y="490" width="400" height="35" class="dsk"/>
  <text x="260" y="512" text-anchor="middle" class="step">AWQ INT4 خطير للاستدلال: استخدم FP8</text>

  <rect x="500" y="310" width="420" height="220" class="box"/>
  <text x="710" y="332" text-anchor="middle" class="head">أرقام (2026)</text>
  <rect x="520" y="350" width="380" height="30" class="cool"/>
  <text x="710" y="370" text-anchor="middle" class="small">GGUF Q4_K_M في vLLM: ~93 tok/s (محرك خاطئ)</text>
  <rect x="520" y="385" width="380" height="30" class="cold"/>
  <text x="710" y="405" text-anchor="middle" class="small">GPTQ-Int4 + Marlin في vLLM: ~712 توك/ثانية</text>
  <rect x="520" y="420" width="380" height="30" class="dsk"/>
  <text x="710" y="440" text-anchor="middle" class="small">AWQ-Int4 + مارلين: ~741 توك/ثانية؛ أفضل تمريرة@1 INT4</text>
  <rect x="520" y="455" width="380" height="30" class="hot"/>
  <text x="710" y="475" text-anchor="middle" class="small">FP8 في H100: ~2x BF16 الإنتاجية</text>
  <rect x="520" y="490" width="380" height="30" class="box"/>
  <text x="710" y="510" text-anchor="middle" class="small">NVFP4 على بلاكويل: ~4x BF16؛ خطر المنطق</text>
</svg>