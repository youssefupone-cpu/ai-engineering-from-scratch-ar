<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">vLLM جدولة - ثلاثة إعدادات افتراضية مركبة</text>

  <rect x="40" y="50" width="280" height="490" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">مُخصص PagedAttention</text>
  <rect x="60" y="90" width="240" height="60" class="cool"/>
  <text x="180" y="112" text-anchor="middle" class="step">KV ذاكرة التخزين المؤقت = كتل مكونة من 16 رمزًا</text>
  <text x="180" y="130" text-anchor="middle" class="small">جدول الكتلة لكل تسلسل؛</text>
  <text x="180" y="144" text-anchor="middle" class="small">التخصيص عند الطلب، والإصدار في EOS</text>
  <rect x="60" y="160" width="240" height="60" class="cool"/>
  <text x="180" y="182" text-anchor="middle" class="step">التجزئة &lt; 4%</text>
  <text x="180" y="200" text-anchor="middle" class="small">مقابل 60-80% متجاورة</text>
  <text x="180" y="214" text-anchor="middle" class="small">ادفع فقط مقابل الرموز المستخدمة</text>
  <rect x="60" y="230" width="240" height="70" class="cold"/>
  <text x="180" y="252" text-anchor="middle" class="step">--استخدام ذاكرة GPU = 0.9</text>
  <text x="180" y="270" text-anchor="middle" class="small">المقبض (وليس العلم)</text>
  <text x="180" y="286" text-anchor="middle" class="small">PagedAttention هو الوحيد</text>
  <text x="180" y="300" text-anchor="middle" class="small">المخصص vLLM السفن</text>
  <rect x="60" y="310" width="240" height="100" class="box"/>
  <text x="180" y="332" text-anchor="middle" class="step">منطقي للخريطة المادية</text>
  <text x="70" y="352" class="small">seq_A: [tok0..15] للكتلة 37</text>
  <text x="70" y="368" class="small">seq_A: [tok16..31] للحظر 12</text>
  <text x="70" y="384" class="small">seq_B: [tok0..15] للحظر 42</text>
  <text x="70" y="400" class="small">... block table grows with seq</text>
  <text x="180" y="430" text-anchor="middle" class="caption">KV هي الذاكرة الافتراضية للتسلسلات</text>

  <rect x="340" y="50" width="280" height="490" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">الخلط المستمر</text>
  <rect x="360" y="90" width="240" height="50" class="hot"/>
  <text x="480" y="110" text-anchor="middle" class="step">جدولة مستوى التكرار</text>
  <text x="480" y="126" text-anchor="middle" class="small">الاعتراف/الإفراج عن كل خطوة فك التشفير</text>
  <rect x="360" y="150" width="240" height="80" class="box"/>
  <text x="480" y="170" text-anchor="middle" class="step">الحلقة</text>
  <text x="370" y="190" class="small">1. قم بإسقاط التسلسلات النهائية من RUNNING</text>
  <text x="370" y="206" class="small">2. اعترف بـ WAITING إذا كان KV يحظر مجانًا</text>
  <text x="370" y="222" class="small">3. واحد للأمام عبر الدفعة</text>
  <rect x="360" y="240" width="240" height="70" class="cool"/>
  <text x="480" y="262" text-anchor="middle" class="step">الدفعة مليئة دائمًا بالعمل الحقيقي</text>
  <text x="480" y="280" text-anchor="middle" class="small">لا الحشو لأطول تسلسل</text>
  <text x="480" y="296" text-anchor="middle" class="small">مغادرة التسلسلات السريعة، وانضمام التسلسلات الجديدة</text>
  <rect x="360" y="320" width="240" height="90" class="cold"/>
  <text x="480" y="342" text-anchor="middle" class="step">V1 المجدول (2026)</text>
  <text x="480" y="360" text-anchor="middle" class="small">يعمل المجدول في التكرار</text>
  <text x="480" y="376" text-anchor="middle" class="small">ليس لكل طلب</text>
  <text x="480" y="394" text-anchor="middle" class="small">فك تشفير المواصفات N-gram هو</text>
  <text x="480" y="408" text-anchor="middle" class="small">مسار متوافق مع التعبئة المسبقة</text>
  <text x="480" y="430" text-anchor="middle" class="caption">3-4x على السذاجة عند 128 متزامنًا</text>

  <rect x="640" y="50" width="280" height="490" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">التعبئة المسبقة مقسمة</text>
  <rect x="660" y="90" width="240" height="60" class="hot"/>
  <text x="780" y="112" text-anchor="middle" class="step">شريحة التعبئة المسبقة إلى قطع 512 توك</text>
  <text x="780" y="130" text-anchor="middle" class="small">تداخل مع فك التشفير</text>
  <text x="780" y="144" text-anchor="middle" class="small">حماية TTFT الذيل، لا يعني</text>
  <rect x="660" y="160" width="240" height="70" class="cool"/>
  <text x="780" y="182" text-anchor="middle" class="step">P99 ITL تحت الحمل المختلط</text>
  <text x="780" y="200" text-anchor="middle" class="small">بدون تقطيع: ~50 مللي ثانية</text>
  <text x="780" y="216" text-anchor="middle" class="small">مع التقطيع: ~ 15 مللي ثانية</text>
  <rect x="660" y="240" width="240" height="70" class="dsk"/>
  <text x="780" y="262" text-anchor="middle" class="step">مسكتك — vLLM v0.18.0</text>
  <text x="780" y="280" text-anchor="middle" class="small">--enable-chunked-prefill</text>
  <text x="780" y="296" text-anchor="middle" class="small">غير متوافق مع مواصفات نموذج المسودة</text>
  <rect x="660" y="320" width="240" height="90" class="old"/>
  <text x="780" y="342" text-anchor="middle" class="step">exception</text>
  <text x="780" y="360" text-anchor="middle" class="small">N-gram GPU فك التشفير التخميني</text>
  <text x="780" y="376" text-anchor="middle" class="small">في V1 يعمل المجدول مع</text>
  <text x="780" y="394" text-anchor="middle" class="small">التعبئة المسبقة مقسمة</text>
  <text x="780" y="430" text-anchor="middle" class="caption">اقرأ ملاحظات الإصدار قبل قلب الأعلام</text>

  <rect x="40" y="470" width="880" height="70" class="box"/>
  <text x="480" y="492" text-anchor="middle" class="step">الثلاثة معًا - Llama 3.3 70B FP8، H100 SXM5، 128 متزامنة</text>
  <text x="480" y="512" text-anchor="middle" class="small">الإنتاجية 2,200-2,400 طن/ثانية · 25% زيادة عن الافتراضي vLLM · 3-4x ساذج PyTorch · &lt; 4% تجزئة</text>
  <text x="480" y="530" text-anchor="middle" class="caption">كل افتراضي يفترض الاثنين الآخرين</text>
</svg>