<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .layer { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .heavy { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .light { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">تخفيف البداية الباردة – خمس طبقات في نموذج 70B</text>

  <rect x="40" y="50" width="880" height="80" class="heavy"/>
  <text x="480" y="72" text-anchor="middle" class="head">بداية باردة خام - إجمالي 328 ثانية تقريبًا (5.5 دقيقة)</text>
  <text x="120" y="95" text-anchor="middle" class="step">node الحكم</text>
  <text x="120" y="112" text-anchor="middle" class="small">50 ثانية</text>
  <text x="320" y="95" text-anchor="middle" class="step">سحب الصورة</text>
  <text x="320" y="112" text-anchor="middle" class="small">180 ثانية</text>
  <text x="520" y="95" text-anchor="middle" class="step">الأوزان إلى HBM</text>
  <text x="520" y="112" text-anchor="middle" class="small">75 ثانية</text>
  <text x="720" y="95" text-anchor="middle" class="step">الحرف الأول للمحرك</text>
  <text x="720" y="112" text-anchor="middle" class="small">20 ثانية</text>
  <text x="870" y="95" text-anchor="middle" class="step">الدفع الأول</text>
  <text x="870" y="112" text-anchor="middle" class="small">3 s</text>

  <rect x="40" y="150" width="280" height="110" class="layer"/>
  <text x="180" y="172" text-anchor="middle" class="head">L1 — صورة تم تصنيفها مسبقًا</text>
  <text x="180" y="192" text-anchor="middle" class="step">بوتل روكيت حجم مزدوج</text>
  <text x="180" y="210" text-anchor="middle" class="small">حجم بيانات اللقطة مع الصورة</text>
  <text x="180" y="226" text-anchor="middle" class="small">EC2NodeClass تشير إلى لقطة</text>
  <text x="180" y="244" text-anchor="middle" class="small">يزيل سحب الصورة 180 ثانية</text>
  <rect x="340" y="150" width="280" height="110" class="layer"/>
  <text x="480" y="172" text-anchor="middle" class="head">L2 — جهاز البث النموذجي</text>
  <text x="480" y="192" text-anchor="middle" class="step">تشغيل:ai / أصلي vLLM 2026</text>
  <text x="480" y="210" text-anchor="middle" class="small">تيار الأوزان طبقة بعد طبقة</text>
  <text x="480" y="226" text-anchor="middle" class="small">تداخل الإدخال/الإخراج مع إعداد الحساب</text>
  <text x="480" y="244" text-anchor="middle" class="small">~2x تسريع تحميل الأوزان</text>
  <rect x="640" y="150" width="280" height="110" class="layer"/>
  <text x="780" y="172" text-anchor="middle" class="head">L3 — GPU لقطة سريعة</text>
  <text x="780" y="192" text-anchor="middle" class="step">نقاط التفتيش مشروط</text>
  <text x="780" y="210" text-anchor="middle" class="small">إجراء تسلسل لحالة ما بعد التحميل HBM</text>
  <text x="780" y="226" text-anchor="middle" class="small">إعادة تشغيل أسرع بما يصل إلى 10x</text>
  <text x="780" y="244" text-anchor="middle" class="small">per-GPU-topology</text>

  <rect x="40" y="280" width="280" height="110" class="layer"/>
  <text x="180" y="302" text-anchor="middle" class="head">L4 — حمام سباحة دافئ</text>
  <text x="180" y="322" text-anchor="middle" class="step">الحد الأدنى من العمال ≥ 1</text>
  <text x="180" y="340" text-anchor="middle" class="small">يزيل المسار البارد تماما</text>
  <text x="180" y="356" text-anchor="middle" class="small">التكلفة: إيجار 24 × 7 GPU</text>
  <text x="180" y="374" text-anchor="middle" class="small">إلزامي عند P99 TTFT &lt; 60 ثانية</text>
  <rect x="340" y="280" width="280" height="110" class="layer"/>
  <text x="480" y="302" text-anchor="middle" class="head">L5 — التحميل المتدرج</text>
  <text x="480" y="322" text-anchor="middle" class="step">نمط بدون خادمLLM</text>
  <text x="480" y="340" text-anchor="middle" class="small">NVMe → DRAM → HBM pipeline</text>
  <text x="480" y="356" text-anchor="middle" class="small">تقليل زمن الوصول بمقدار 10-200 مرة</text>
  <text x="480" y="374" text-anchor="middle" class="small">اعتماد الإنتاج المبكر</text>
  <rect x="640" y="280" width="280" height="110" class="layer"/>
  <text x="780" y="302" text-anchor="middle" class="head">المكافأة - الهجرة الحية</text>
  <text x="780" y="322" text-anchor="middle" class="step">نقل الرموز، وليس ذاكرة التخزين المؤقت</text>
  <text x="780" y="340" text-anchor="middle" class="small">أرسل الإدخال (KB) إلى الوجهة الدافئة</text>
  <text x="780" y="356" text-anchor="middle" class="small">أعد حساب KV في الوجهة</text>
  <text x="780" y="374" text-anchor="middle" class="small">مفيدة لتفصيلها</text>

  <rect x="40" y="410" width="880" height="100" class="light"/>
  <text x="480" y="432" text-anchor="middle" class="head">نتيجة المكدس - ~ 15 ثانية مع L1+L2+L3 أو دافئ بالكامل عبر L4</text>
  <text x="480" y="454" text-anchor="middle" class="step">النشر المشروط: 2-4 ثواني · Baseten الافتراضي: 5-10 ثواني، ثواني فرعية مع التسخين المسبق</text>
  <text x="480" y="476" text-anchor="middle" class="small">تعتمد الإجابة الصحيحة على شكل SLA وميزانية حمام السباحة الدافئ</text>
  <text x="480" y="494" text-anchor="middle" class="caption">قم بالقياس قبل التحسين - لا تقم مطلقًا بإضافة طبقات بدون بيانات</text>
</svg>