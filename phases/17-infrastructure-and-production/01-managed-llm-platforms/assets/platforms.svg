<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .aws { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .az { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gcp { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">منصات LLM المُدارة — ثلاث إستراتيجيات</text>

  <rect x="40" y="50" width="280" height="440" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">AWS حجر الأساس – السوق</text>
  <rect x="60" y="90" width="240" height="60" class="aws"/>
  <text x="180" y="110" text-anchor="middle" class="step">كلود · لاما · تيتان · كوهير</text>
  <text x="180" y="128" text-anchor="middle" class="small">ميسترال · الاستقرار · AI21</text>
  <text x="180" y="144" text-anchor="middle" class="small">واحد IAM، سطح CloudWatch واحد</text>
  <rect x="60" y="160" width="240" height="80" class="aws"/>
  <text x="180" y="182" text-anchor="middle" class="step">ملفات تعريف استدلال التطبيق</text>
  <text x="180" y="200" text-anchor="middle" class="small">أنظف إسناد FinOps</text>
  <text x="180" y="216" text-anchor="middle" class="small">علامة الفريق / المنتج / الميزة</text>
  <text x="180" y="232" text-anchor="middle" class="small">تكلفة الملف الشخصي بدون إجراءات لاحقة</text>
  <rect x="60" y="250" width="240" height="70" class="box"/>
  <text x="180" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 75 مللي ثانية</text>
  <text x="180" y="290" text-anchor="middle" class="small">القدرة المشتركة عند الطلب</text>
  <text x="180" y="306" text-anchor="middle" class="small">PT متاح بسعر 21 دولارًا - 50 دولارًا في الساعة</text>
  <rect x="60" y="330" width="240" height="90" class="dsk"/>
  <text x="180" y="352" text-anchor="middle" class="step">الرهان: الاختيارية على أي نموذج واحد</text>
  <text x="180" y="370" text-anchor="middle" class="small">الحدود تدور - أبقِ الباب مفتوحًا</text>
  <text x="180" y="390" text-anchor="middle" class="small">BAA في معظم المناطق، VPC نقاط النهاية</text>
  <text x="180" y="410" text-anchor="middle" class="small">الدرابزين مدمج</text>

  <rect x="340" y="50" width="280" height="440" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">Azure OpenAI — حصري + PTU</text>
  <rect x="360" y="90" width="240" height="60" class="az"/>
  <text x="480" y="110" text-anchor="middle" class="step">GPT-4 / 4o / 5 / سلسلة o</text>
  <text x="480" y="128" text-anchor="middle" class="small">DALL-E، همس، ​​ضبط دقيق</text>
  <text x="480" y="144" text-anchor="middle" class="small">لا توجد نماذج غير OpenAI</text>
  <rect x="360" y="160" width="240" height="80" class="az"/>
  <text x="480" y="182" text-anchor="middle" class="step">وحدات الإنتاجية المتوفرة</text>
  <text x="480" y="200" text-anchor="middle" class="small">سعة مخصصة، تتم المحاسبة بالساعة</text>
  <text x="480" y="216" text-anchor="middle" class="small">توفير يصل إلى 70% عند الاستخدام المرتفع</text>
  <text x="480" y="232" text-anchor="middle" class="small">التعادل ≈ 40-60٪ الاستفادة</text>
  <rect x="360" y="250" width="240" height="70" class="box"/>
  <text x="480" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 50 مللي ثانية (PTU)</text>
  <text x="480" y="290" text-anchor="middle" class="small">25 مللي ثانية أفضل من بيدروك</text>
  <text x="480" y="306" text-anchor="middle" class="small">الفجوة تتقلص عند الطلب</text>
  <rect x="360" y="330" width="240" height="90" class="dsk"/>
  <text x="480" y="352" text-anchor="middle" class="step">الرهان: OpenAI يبقى في الحدود</text>
  <text x="480" y="370" text-anchor="middle" class="small">الصناعة الافتراضية المنظمة</text>
  <text x="480" y="390" text-anchor="middle" class="small">HIPAA، SOC 2، ISO 27001</text>
  <text x="480" y="410" text-anchor="middle" class="small">EU مكان البيانات متاح</text>

  <rect x="640" y="50" width="280" height="440" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">قمة الرأس AI — برج الجوزاء أولاً</text>
  <rect x="660" y="90" width="240" height="60" class="gcp"/>
  <text x="780" y="110" text-anchor="middle" class="step">الجوزاء 2.5 برو / فلاش / نانو</text>
  <text x="780" y="128" text-anchor="middle" class="small">نافذة سياق 1M-رمزية</text>
  <text x="780" y="144" text-anchor="middle" class="small">حديقة نموذجية للطرف الثالث</text>
  <rect x="660" y="160" width="240" height="80" class="gcp"/>
  <text x="780" y="182" text-anchor="middle" class="step">تصدير فواتير BigQuery</text>
  <text x="780" y="200" text-anchor="middle" class="small">مشروع لكل فريق + التسميات</text>
  <text x="780" y="216" text-anchor="middle" class="small">تعسفي SQL على بيانات التكلفة</text>
  <text x="780" y="232" text-anchor="middle" class="small">المزيد من العمل، المزيد من المرونة</text>
  <rect x="660" y="250" width="240" height="70" class="box"/>
  <text x="780" y="272" text-anchor="middle" class="step">TTFT P50 ≈ 60 مللي ثانية</text>
  <text x="780" y="290" text-anchor="middle" class="small">حسب الطلب، مشترك</text>
  <text x="780" y="306" text-anchor="middle" class="small">يتم توفيرها وفقًا لـ SKU، وهي أقل عمومية</text>
  <rect x="660" y="330" width="240" height="90" class="dsk"/>
  <text x="780" y="352" text-anchor="middle" class="step">الرهان: سياق طويل متعدد الوسائط</text>
  <text x="780" y="370" text-anchor="middle" class="small">سياق 1M هو الفارق</text>
  <text x="780" y="390" text-anchor="middle" class="small">تحوطات الحديقة النموذجية لطرف ثالث</text>
  <text x="780" y="410" text-anchor="middle" class="small">GCP يرث الامتثال</text>

  <rect x="40" y="500" width="880" height="50" class="box"/>
  <text x="480" y="520" text-anchor="middle" class="step">الحد الأدنى لموفرين — كلود من أحدهما، GPT من آخر، تجاوز فشل البوابة بينهما</text>
  <text x="480" y="540" text-anchor="middle" class="small">إن حبس بائع واحد هو الخطأ الباهظ الثمن في عام 2026 – حيث تدور الحدود شهريًا</text>
</svg>