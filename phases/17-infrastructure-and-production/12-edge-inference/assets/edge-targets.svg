<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .apple { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .qcom { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .web { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .jet { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">استنتاج الحافة - أربعة أهداف، وعرض النطاق الترددي يحدد السقف</text>

  <rect x="40" y="50" width="220" height="190" class="apple"/>
  <text x="150" y="72" text-anchor="middle" class="head">محرك أبل العصبي</text>
  <text x="150" y="95" text-anchor="middle" class="step">M4 / A18 — ما يصل إلى 38 TOPS</text>
  <text x="150" y="113" text-anchor="middle" class="small">ذاكرة موحدة، لا نسخة</text>
  <text x="150" y="131" text-anchor="middle" class="small">الأساسي ML للغة الأصلية ANE</text>
  <text x="150" y="149" text-anchor="middle" class="small">MPS عبر llama.cpp</text>
  <text x="150" y="175" text-anchor="middle" class="step">آيفون 16 ≈ 8 توك/ثانية</text>
  <text x="150" y="193" text-anchor="middle" class="small">60 GB/ث DRAM</text>
  <text x="150" y="211" text-anchor="middle" class="small">7B Q4، فك التشفير مرتبط بالذاكرة</text>

  <rect x="280" y="50" width="220" height="190" class="qcom"/>
  <text x="390" y="72" text-anchor="middle" class="head">كوالكوم مسدس</text>
  <text x="390" y="95" text-anchor="middle" class="step">SD X النخبة — ما يصل إلى 45 TOPS</text>
  <text x="390" y="113" text-anchor="middle" class="small">SD الإصدار 8 من الجيل الرابع من Android الرائد</text>
  <text x="390" y="131" text-anchor="middle" class="small">QNN SDK، AI تحويلات المحور</text>
  <text x="390" y="149" text-anchor="middle" class="small">ويندوز ARM مساعدي الطيارين</text>
  <text x="390" y="175" text-anchor="middle" class="step">SD 8 الجيل 3 ≈ 7 توك/ثانية</text>
  <text x="390" y="193" text-anchor="middle" class="small">77 GB/ث DRAM</text>
  <text x="390" y="211" text-anchor="middle" class="small">7B Q4، متوسط/مرتفع نموذجي</text>

  <rect x="520" y="50" width="220" height="190" class="web"/>
  <text x="630" y="72" text-anchor="middle" class="head">WebGPU + WebLLM</text>
  <text x="630" y="95" text-anchor="middle" class="step">المتصفح، لا يوجد تثبيت</text>
  <text x="630" y="113" text-anchor="middle" class="small">كروم أندرويد 121+ / سفاري iOS 26</text>
  <text x="630" y="131" text-anchor="middle" class="small">فايرفوكس أندرويد اللحاق بالركب</text>
  <text x="630" y="149" text-anchor="middle" class="small">~70-75% تغطية متنقلة</text>
  <text x="630" y="175" text-anchor="middle" class="step">M3 الحد الأقصى ≈ 41 توك/ثانية</text>
  <text x="630" y="193" text-anchor="middle" class="small">~ 70-80٪ من السكان الأصليين</text>
  <text x="630" y="211" text-anchor="middle" class="small">OpenAI-متوافق JS API</text>

  <rect x="760" y="50" width="160" height="190" class="jet"/>
  <text x="840" y="72" text-anchor="middle" class="head">NVIDIA جيتسون</text>
  <text x="840" y="95" text-anchor="middle" class="step">أورين / AGX / ثور</text>
  <text x="840" y="113" text-anchor="middle" class="small">TensorRT Edge-LLM</text>
  <text x="840" y="131" text-anchor="middle" class="small">EAGLE-3 + NVFP4</text>
  <text x="840" y="149" text-anchor="middle" class="small">التعبئة المسبقة مقسمة</text>
  <text x="840" y="175" text-anchor="middle" class="step">AGX ≈ 40 توك/ثانية</text>
  <text x="840" y="193" text-anchor="middle" class="small">gpt-oss-20b vLLM</text>
  <text x="840" y="211" text-anchor="middle" class="small">205 GB/ث</text>

  <rect x="40" y="260" width="880" height="110" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">عرض النطاق الترددي يحدد السقف - يقرأ فك التشفير الأوزان الكاملة لكل رمز مميز</text>
  <text x="480" y="308" text-anchor="middle" class="step">H100 HBM3: 3350 GB/s → Llama 8B Q4 السقف ≈ 710 توك/ثانية (لوحظ 170)</text>
  <text x="480" y="326" text-anchor="middle" class="step">M3 الحد الأقصى 400 GB/s → السقف ≈ 85 توك/ثانية (لوحظ 55)</text>
  <text x="480" y="344" text-anchor="middle" class="step">iPhone 16 60 GB/s → السقف ≈ 12 توك/ثانية (لوحظ 8)</text>
  <text x="480" y="362" text-anchor="middle" class="caption">الحوسبة مهمة فقط عندما تنخفض كفاءة وقت التشغيل إلى ما دون هذا السقف</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="412" text-anchor="middle" class="head">يختار الكمي لكل هدف</text>
  <text x="480" y="432" text-anchor="middle" class="step">ANE: INT4 الأوزان + FP16 عمليات التنشيط (المسار ML الأساسي)</text>
  <text x="480" y="450" text-anchor="middle" class="step">السداسي: QNN INT8/INT4 (AI محولات المحور)</text>
  <text x="480" y="468" text-anchor="middle" class="step">WebGPU: Q4 GGUF (سقف ذاكرة المتصفح ~3-4 GB)</text>
  <text x="480" y="486" text-anchor="middle" class="step">جيتسون ثور: NVFP4 + FP8 KV (الحافة-LLM المسار)</text>
</svg>