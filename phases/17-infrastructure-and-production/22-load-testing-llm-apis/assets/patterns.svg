<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .tool { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .pattern { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">اختبار الحمل LLM APIs — مصائدان وأربعة أنماط وخمس أدوات</text>

  <rect x="40" y="50" width="440" height="110" class="bad"/>
  <text x="260" y="72" text-anchor="middle" class="head">GIL مصيدة (مخزون الجراد)</text>
  <text x="60" y="96" class="small">· رموز العميل ضمن Python GIL</text>
  <text x="60" y="114" class="small">· يتنافس مع توليد الطلب</text>
  <text x="60" y="132" class="small">· تم الإبلاغ عن تضخم تراكم الرموز المميزة ITL</text>
  <text x="260" y="152" text-anchor="middle" class="caption">عميلك هو عنق الزجاجة، وليس الخادم</text>

  <rect x="500" y="50" width="420" height="110" class="bad"/>
  <text x="710" y="72" text-anchor="middle" class="head">فخ التوحيد الفوري</text>
  <text x="520" y="96" class="small">· حلقة بموجه واحد = 100% ذاكرة تخزين مؤقت للبادئة</text>
  <text x="520" y="114" class="small">· يخدم طلب الدمج "N المتزامن" كـ 1</text>
  <text x="520" y="132" class="small">· تبدو الإنتاجية رائعة، ويتراجع الإنتاج</text>
  <text x="710" y="152" text-anchor="middle" class="caption">الإصلاح: LLMPerf --mean + --stddev رموز الإدخال المميزة</text>

  <rect x="40" y="180" width="440" height="160" class="tool"/>
  <text x="260" y="202" text-anchor="middle" class="head">أدوات 2026</text>
  <text x="60" y="226" class="step">LLMPerf — Anyscale، Rust الرموز المميزة، البث</text>
  <text x="60" y="244" class="step">NVIDIA GenAI-Perf — مرجع مدعوم من Triton</text>
  <text x="60" y="262" class="step">LLM-الجراد — الجراد + GIL الإصلاح</text>
  <text x="60" y="280" class="step">Guidellm — اصطناعي على نطاق واسع</text>
  <text x="60" y="298" class="step">k6 v2026.1.0 + المشغل 1.0 GA</text>
  <text x="60" y="316" class="small">  مدرك للتدفق، CRD-أصلي، أفضل بوابة CI</text>

  <rect x="500" y="180" width="420" height="160" class="pattern"/>
  <text x="710" y="202" text-anchor="middle" class="head">أربعة أنماط تحميل</text>
  <text x="520" y="226" class="step">ثابت — ثابت لمدة 30-60 دقيقة RPS</text>
  <text x="520" y="244" class="small">  يمسك الانحدارات الأساسية</text>
  <text x="520" y="264" class="step">المنحدر - 0 لاستهداف أكثر من 15 دقيقة</text>
  <text x="520" y="280" class="small">  يمسك نقطة توقف القدرة + الاحماء</text>
  <text x="520" y="300" class="step">ارتفاع - انفجار مفاجئ 3-10 مرات</text>
  <text x="520" y="316" class="small">  يمسك بالقياس التلقائي + تأثير البداية الباردة</text>
  <text x="520" y="328" class="step">نقع - 4-8 ساعات ثابتة</text>

  <rect x="40" y="360" width="880" height="130" class="box"/>
  <text x="480" y="382" text-anchor="middle" class="head">CI وصفة البوابة</text>
  <text x="480" y="406" text-anchor="middle" class="step">k6 في PR مع 30-50 تكرارًا في الأساس RPS</text>
  <text x="480" y="426" text-anchor="middle" class="step">البوابة: P50 / P95 TTFT، 5xx &lt; 5%، TPOT العتبة</text>
  <text x="480" y="446" text-anchor="middle" class="caption">قم بكسر البناء عند الاختراق - تعامل مع الأداء باعتباره خطأ في الترجمة</text>
  <text x="480" y="468" text-anchor="middle" class="small">GenAI-Perf ITL يستبعد TTFT · LLMPerf يتضمنه - نفس الخادم، مختلف TPOT</text>
</svg>