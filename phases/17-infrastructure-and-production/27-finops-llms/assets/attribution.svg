<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .dim { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .layer { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .enforce { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .kill { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">FinOps for LLMs — ثلاثة أبعاد، وأربع طبقات، وتنفيذ ثلاثي المستويات</text>

  <rect x="40" y="50" width="280" height="180" class="dim"/>
  <text x="180" y="72" text-anchor="middle" class="head">ثلاثة أبعاد الإسناد</text>
  <rect x="60" y="90" width="240" height="35" class="box"/>
  <text x="180" y="112" text-anchor="middle" class="step">لكل مستخدم (user_id)</text>
  <rect x="60" y="130" width="240" height="35" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="step">لكل مهمة (task_id + المسار)</text>
  <rect x="60" y="170" width="240" height="35" class="box"/>
  <text x="180" y="192" text-anchor="middle" class="step">لكل مستأجر (tenant_id)</text>
  <text x="180" y="222" text-anchor="middle" class="caption">الأداة الثلاثة في اليوم الأول</text>

  <rect x="340" y="50" width="280" height="180" class="layer"/>
  <text x="480" y="72" text-anchor="middle" class="head">أربع طبقات رمزية</text>
  <text x="360" y="96" class="step">· موجه (40-60%)</text>
  <text x="360" y="116" class="step">· الأداة (20-40%، وكيل ثقيل)</text>
  <text x="360" y="136" class="step">· الذاكرة (10-30%، RAG)</text>
  <text x="360" y="156" class="step">· الاستجابة (10-30%)</text>
  <text x="480" y="200" text-anchor="middle" class="caption">يؤدي تجميع الأربعة جميعًا إلى إخفاء ذراع التحسين</text>

  <rect x="640" y="50" width="280" height="180" class="enforce"/>
  <text x="780" y="72" text-anchor="middle" class="head">إنفاذ ثلاثة مستويات</text>
  <text x="660" y="96" class="step">1. الحد الأقصى للسعر لكل مستأجر</text>
  <text x="660" y="114" class="small">   2-3x الذروة، 429 + إعادة المحاولة بعد</text>
  <text x="660" y="138" class="step">2. سقف الإنفاق اليومي لكل مستأجر</text>
  <text x="660" y="156" class="small">   عقد 1.5-3x؛ تشديد المعدل + تنبيه CS</text>
  <text x="660" y="180" class="step">3. مفتاح الإيقاف على Z-score &gt; 4</text>
  <text x="660" y="198" class="small">   الإيقاف المؤقت التلقائي + الصفحة عند الطلب</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">وحدة القياس - التكلفة لكل نتيجة منتج، وليس الرموز المميزة بقيمة $/M</text>
  <text x="60" y="308" class="step">التكلفة لكل تذكرة دعم تم حلها</text>
  <text x="60" y="326" class="step">التكلفة لكل مقالة تم إنشاؤها</text>
  <text x="60" y="344" class="step">التكلفة لكل مهمة وكيل ناجحة</text>
  <text x="500" y="308" class="step">التكلفة لكل دقيقة مستخدم في الجلسة</text>
  <text x="500" y="326" class="step">تكلفة تحديث الفهرس</text>
  <text x="500" y="344" class="caption">ربط التكلفة بنتيجة المنتج، وإلا فلن يكون التحسين ثابتًا</text>

  <rect x="40" y="380" width="880" height="110" class="kill"/>
  <text x="480" y="402" text-anchor="middle" class="head">سقف التحسين المكدس — ~5-10% من خط الأساس الساذج</text>
  <text x="480" y="424" text-anchor="middle" class="step">ذاكرة التخزين المؤقت (14) + الدفعة (15) + المسار (16) + البوابة (19)</text>
  <text x="480" y="444" text-anchor="middle" class="step">كل نصفين أو 10xs؛ يتضاعف المركب</text>
  <text x="480" y="464" text-anchor="middle" class="caption">تدير معظم الفرق 2-3 روافع؛ عدد قليل كومة كل أربعة</text>
  <text x="480" y="484" text-anchor="middle" class="small">الإنفاق المتسرب = الفجوة بين مكدس أفضل الحالات والتيار</text>
</svg>