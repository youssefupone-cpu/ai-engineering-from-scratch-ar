<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">العوامل المولدة - ثلاثة مكونات من بارك وآخرون. 2023</text>

  <rect x="40" y="60" width="280" height="220" class="cool"/>
  <text x="180" y="84" text-anchor="middle" class="head">تيار الذاكرة</text>
  <text x="180" y="108" text-anchor="middle" class="step">سجل الإلحاق فقط</text>
  <text x="60" y="136" class="small">[t=0] الملاحظة:: رأى إيزابيلا</text>
  <text x="60" y="154" class="small">[t=1] ملاحظة:: مدعو للحفلة</text>
  <text x="60" y="172" class="small">[t=2] انعكاس:: أنا أستمتع بالحفلات</text>
  <text x="60" y="190" class="small">[t=3] الخطة:: الحضور الساعة 5 مساءً</text>
  <text x="60" y="208" class="small">[t=4] الإجراء:: توجه إلى المقهى</text>
  <text x="180" y="240" text-anchor="middle" class="caption">الاسترجاع: الحداثة + الأهمية + الملاءمة</text>
  <text x="180" y="258" text-anchor="middle" class="caption">مطالبات موجزات Top-K</text>

  <rect x="340" y="60" width="280" height="220" class="cold"/>
  <text x="480" y="84" text-anchor="middle" class="head">reflection</text>
  <text x="480" y="108" text-anchor="middle" class="step">المعتقدات العليا</text>
  <text x="480" y="136" text-anchor="middle" class="small">الزناد الدوري:</text>
  <text x="480" y="154" text-anchor="middle" class="small">الأهمية غير المجهزة&gt; العتبة</text>
  <text x="480" y="180" text-anchor="middle" class="small">موجه: "نظرًا للذكريات الحديثة،</text>
  <text x="480" y="196" text-anchor="middle" class="small">ما هي البصيرة ذات المستوى الأعلى؟"</text>
  <text x="480" y="222" text-anchor="middle" class="small">الإخراج: إدخالات انعكاس جديدة</text>
  <text x="480" y="240" text-anchor="middle" class="small">إعادة استيعابها في الدفق</text>
  <text x="480" y="258" text-anchor="middle" class="caption">بدون تفكير: لا تكوين للمعتقدات</text>

  <rect x="640" y="60" width="280" height="220" class="box"/>
  <text x="780" y="84" text-anchor="middle" class="head">plan</text>
  <text x="780" y="108" text-anchor="middle" class="step">يوم / ساعة / عمل</text>
  <text x="780" y="136" text-anchor="middle" class="small">اليوم الثاني: اذهب إلى العمل، تناول العشاء</text>
  <text x="780" y="156" text-anchor="middle" class="small">الساعة: 9 صباحًا مقهى، 12 ظهرًا الغداء...</text>
  <text x="780" y="176" text-anchor="middle" class="small">العمل: المشي إلى المقهى، طلب القهوة</text>
  <text x="780" y="206" text-anchor="middle" class="small">مشغل المراجعة:</text>
  <text x="780" y="222" text-anchor="middle" class="small">الملاحظة تتعارض مع الخطة</text>
  <text x="780" y="240" text-anchor="middle" class="small">إعادة خطط الجزء المتأثر فقط</text>
  <text x="780" y="258" text-anchor="middle" class="caption">بدون خطة: ضجيج تفاعلي</text>

  <rect x="40" y="310" width="880" height="200" class="hot"/>
  <text x="480" y="334" text-anchor="middle" class="head">السلوك الناشئ – حفلة عيد الحب</text>

  <text x="70" y="362" class="step">علامة 0</text>
  <text x="140" y="362" class="small">Agent-0 (إيزابيلا) مُصنف بـ: "حفلة مضيفة في المقهى، الساعة 5 مساءً"</text>

  <text x="70" y="382" class="step">ضع علامة 0-2</text>
  <text x="140" y="382" class="small">إيزابيلا تدعو الجيران. تصبح كل دعوة ملاحظة في ساحة المشاركات الخاصة بهم</text>

  <text x="70" y="402" class="step">ضع علامة 1-3</text>
  <text x="140" y="402" class="small">يعكس الجيران المدعوون -&gt; الاعتقاد "أنا مدعو إلى حفلة" -&gt; أخطط للحضور</text>

  <text x="70" y="422" class="step">علامة 2-4</text>
  <text x="140" y="422" class="small">المدعوون يخبرون الجيران الآخرين؛ انتشار من الدرجة الثانية</text>

  <text x="70" y="442" class="step">علامة 5</text>
  <text x="140" y="442" class="small">تتلاقى ثلاثة مكونات: يصل 3-5 وكلاء إلى المقهى في الوقت المحدد</text>

  <text x="70" y="470" class="caption">بذرة واحدة + ثلاثة مكونات = وصول منسق بدون منسق</text>
  <text x="70" y="490" class="caption">حالات الفشل الموثقة: المعايير المكانية (المتاجر المغلقة، الحمامات المخصصة لشخص واحد)</text>
</svg>