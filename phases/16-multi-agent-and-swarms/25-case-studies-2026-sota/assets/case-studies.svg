  <text x="60" y="472" class="step">جوجل ADK · إنساني SDK</text>
  <text x="260" y="472" class="small">الإنتاج · A2A- أصلي وبحثي على التوالي</text>

  <text x="60" y="496" class="caption">جميع السفن MCP; معظم السفن A2A — لم يعد توافق البروتوكول عامل تمييز</text>
