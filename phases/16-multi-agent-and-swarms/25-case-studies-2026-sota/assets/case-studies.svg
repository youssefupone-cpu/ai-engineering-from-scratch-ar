  <text x="60" y="394" class="step">CrewAI</text>
  <text x="260" y="394" class="small">قائد الإنتاج · أطقم تعتمد على الأدوار (متسلسلة / هرمية)</text>

  <text x="60" y="420" class="step">OpenAI الوكلاء SDK</text>
