<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .axis { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .curve { stroke-width: 2.0; fill: none; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">الخصوصية التفاضلية لـ LLMs: DP-SGD وبدائلها</text>

  <rect x="60" y="60" width="540" height="340" class="box"/>
  <text x="330" y="85" text-anchor="middle" class="head">DP-SGD حدود فائدة الخصوصية</text>
  <line x1="120" y1="360" x2="560" y2="360" class="axis"/>
  <line x1="120" y1="360" x2="120" y2="100" class="axis"/>
  <text x="330" y="390" text-anchor="middle" class="small">1 / إبسيلون (سجل) -&gt; أكثر خصوصية -&gt;</text>
  <text x="70" y="230" text-anchor="middle" class="small" transform="rotate(-90 70 230)">فائدة (دقة)</text>

  <path d="M 150 110 Q 260 140 360 220 T 540 340" class="curve" stroke="#c0392b"/>
  <text x="480" y="330" class="small" fill="#c0392b">بدون محول DP-SGD</text>

  <path d="M 150 110 Q 260 125 360 180 T 540 280" class="curve" stroke="#2e7d32"/>
  <text x="470" y="270" class="small" fill="#2e7d32">LoRA + DP-SGD</text>

  <line x1="200" y1="100" x2="200" y2="360" stroke="#888" stroke-dasharray="2 4"/>
  <text x="205" y="110" class="small" fill="#888">إبسيلون ~ 10</text>
  <line x1="380" y1="100" x2="380" y2="360" stroke="#888" stroke-dasharray="2 4"/>
  <text x="385" y="110" class="small" fill="#888">إبسيلون ~ 3</text>

  <rect x="620" y="60" width="280" height="160" class="box"/>
  <text x="760" y="85" text-anchor="middle" class="head">alternatives</text>
  <rect x="640" y="100" width="240" height="50" class="cold"/>
  <text x="760" y="122" text-anchor="middle" class="step">PMixED (وقت الاستدلال)</text>
  <text x="760" y="140" text-anchor="middle" class="small">مزيج من الخبراء + DP الضوضاء</text>
  <rect x="640" y="160" width="240" height="50" class="cold"/>
  <text x="760" y="182" text-anchor="middle" class="step">DP البيانات الاصطناعية</text>
  <text x="760" y="200" text-anchor="middle" class="small">التدريب المتلقين للمعلومات على موالفة</text>

  <rect x="620" y="240" width="280" height="160" class="box"/>
  <text x="760" y="265" text-anchor="middle" class="head">2024-2025 دليل على التوتر</text>
  <rect x="640" y="280" width="240" height="50" class="cool"/>
  <text x="760" y="302" text-anchor="middle" class="step">كناري MIA (دوان 2024)</text>
  <text x="760" y="320" text-anchor="middle" class="small">نجاح محدود</text>
  <rect x="640" y="340" width="240" height="50" class="hot"/>
  <text x="760" y="362" text-anchor="middle" class="step">استخراج (كارليني، نصر 2025)</text>
  <text x="760" y="380" text-anchor="middle" class="small">تحفيظ كبير</text>

  <rect x="60" y="420" width="840" height="70" class="box"/>
  <text x="80" y="445" class="small">كووالتشيك وآخرون. 2025: الاثنان يقيسان أشياء مختلفة. الكناري قياس "الإدراج"؛ تدابير الاستخراج "الأكثر قابلية للاستخراج".</text>
  <text x="80" y="465" class="small">DP الانعكاس عبر LLM التعليقات: يمكن أن تتسبب درجات الثقة في تسرب إشارة إعادة التعريف حتى عندما لا يحدث ذلك.</text>
  <text x="80" y="483" class="small">قاعدة النشر: إبسيلون + محاسب + بروتوكول MIA + اختبار الاستخراج + فحص التعرض للثقة.</text>
</svg>