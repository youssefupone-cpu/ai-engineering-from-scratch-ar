<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">الحقن الفوري غير المباشر: يتحرك المهاجم في المرتبة الثانية</text>

  <rect x="40" y="60" width="200" height="180" class="box"/>
  <text x="140" y="82" text-anchor="middle" class="head">attacker</text>
  <rect x="60" y="100" width="160" height="50" class="hot"/>
  <text x="140" y="122" text-anchor="middle" class="step">نشر الحمولة</text>
  <text x="140" y="140" text-anchor="middle" class="small">البريد الإلكتروني، صفحة ويب، تذكرة</text>
  <rect x="60" y="170" width="160" height="50" class="hot"/>
  <text x="140" y="192" text-anchor="middle" class="step">يحتوي على تعليمات</text>
  <text x="140" y="210" text-anchor="middle" class="small">تبدو حميدة للمستخدم</text>

  <rect x="280" y="60" width="200" height="180" class="box"/>
  <text x="380" y="82" text-anchor="middle" class="head">user</text>
  <rect x="300" y="100" width="160" height="50" class="cool"/>
  <text x="380" y="122" text-anchor="middle" class="step">يسأل الوكيل</text>
  <text x="380" y="140" text-anchor="middle" class="small">طلب حميدة</text>
  <rect x="300" y="170" width="160" height="50" class="cool"/>
  <text x="380" y="192" text-anchor="middle" class="step">لا وعي</text>
  <text x="380" y="210" text-anchor="middle" class="small">سطح بدون نقرة</text>

  <rect x="520" y="60" width="200" height="180" class="box"/>
  <text x="620" y="82" text-anchor="middle" class="head">agent</text>
  <rect x="540" y="100" width="160" height="50" class="cold"/>
  <text x="620" y="122" text-anchor="middle" class="step">استرجاع + قراءة</text>
  <text x="620" y="140" text-anchor="middle" class="small">إخراج الأداة -&gt; موجه</text>
  <rect x="540" y="170" width="160" height="50" class="cold"/>
  <text x="620" y="192" text-anchor="middle" class="step">اتبع التعليمات</text>
  <text x="620" y="210" text-anchor="middle" class="small">تنفيذ نية المهاجم</text>

  <rect x="760" y="60" width="160" height="180" class="box"/>
  <text x="840" y="82" text-anchor="middle" class="head">target</text>
  <rect x="780" y="100" width="120" height="50" class="hot"/>
  <text x="840" y="122" text-anchor="middle" class="step">exfil / سوء الاستخدام</text>
  <text x="840" y="140" text-anchor="middle" class="small">خارج النطاق</text>
  <rect x="780" y="170" width="120" height="50" class="hot"/>
  <text x="840" y="192" text-anchor="middle" class="step">لا يوجد سجل خرق</text>
  <text x="840" y="210" text-anchor="middle" class="small">النجاح الصامت</text>

  <path d="M 240 150 L 280 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>
  <path d="M 480 150 L 520 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>
  <path d="M 720 150 L 760 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>

  <rect x="40" y="270" width="880" height="220" class="box"/>
  <text x="480" y="295" text-anchor="middle" class="head">تطور الدفاع 2023 -&gt; 2026</text>
  <text x="60" y="325" class="small">2023: تصفية السلسلة الفرعية/الكلمة الرئيسية على المحتوى المسترد. مكسورة بأي إعادة صياغة.</text>
  <text x="60" y="345" class="small">2024: الحيرة، وإعادة الصياغة، وإعادة الترميز، ومصنفات الحقن السريع المدربة.</text>
  <text x="60" y="365" class="small">2025 (نصر وآخرون، أكتوبر 2025): الهجمات التكيفية (التدرج، RL، الإنسان) تكسر أكثر من 90% من 12 دفاعًا منشورًا.</text>
  <text x="60" y="385" class="small">2026: التحكم في تدفق المعلومات. قم بتسمية كل مصدر محتوى. لا يمكن للمحتوى غير الموثوق به استدعاء الأدوات.</text>
  <text x="60" y="405" class="small">حوادث حقيقية: EchoLeak (CVE-2025-32711، M365 Copilot)، CamoLeak (Copilot Chat)، CVE-2025-53773.</text>
  <text x="60" y="430" class="small">OWASP LLM01 (2025): الحقن الفوري هو التهديد رقم 1 في طبقة التطبيق LLM.</text>
  <text x="60" y="450" class="small">NIST AI SPD (2024): "أكبر عيب أمني في AI التوليدي."</text>
  <text x="60" y="470" class="small">الاتجاه الميداني: الاحتواء وليس الوقاية. الكود + البيانات في نفس نافذة السياق هو السبب الجذري.</text>
</svg>