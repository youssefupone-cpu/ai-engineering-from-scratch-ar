<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">محاذاة النظام البيئي البحثي (2026)</text>

  <rect x="60" y="60" width="200" height="180" class="box"/>
  <text x="160" y="82" text-anchor="middle" class="head">MATS</text>
  <text x="160" y="100" text-anchor="middle" class="small">الموهبة pipeline</text>
  <rect x="80" y="110" width="160" height="50" class="cool"/>
  <text x="160" y="132" text-anchor="middle" class="step">527+ العلماء</text>
  <text x="160" y="150" text-anchor="middle" class="small">أكثر من 180 ورقة، مؤشر h 47</text>
  <rect x="80" y="170" width="160" height="50" class="cool"/>
  <text x="160" y="192" text-anchor="middle" class="step">90 عالما 2024</text>
  <text x="160" y="210" text-anchor="middle" class="small">~ 80٪ وظائف السلامة</text>

  <rect x="300" y="60" width="200" height="180" class="box"/>
  <text x="400" y="82" text-anchor="middle" class="head">ريدوود + أبولو</text>
  <text x="400" y="100" text-anchor="middle" class="small">التقييم الخارجي</text>
  <rect x="320" y="110" width="160" height="50" class="cold"/>
  <text x="400" y="132" text-anchor="middle" class="step">الخشب الأحمر: AI التحكم</text>
  <text x="400" y="150" text-anchor="middle" class="small">__المصطلح_0__ 2024</text>
  <rect x="320" y="170" width="160" height="50" class="cold"/>
  <text x="400" y="192" text-anchor="middle" class="step">أبولو: مكيدة</text>
  <text x="400" y="210" text-anchor="middle" class="small">arXiv:2412.04984</text>

  <rect x="540" y="60" width="200" height="180" class="box"/>
  <text x="640" y="82" text-anchor="middle" class="head">METR + إليوس</text>
  <text x="640" y="100" text-anchor="middle" class="small">المهمة + الرفاهية</text>
  <rect x="560" y="110" width="160" height="50" class="cold"/>
  <text x="640" y="132" text-anchor="middle" class="step">METR: آفاق المهمة</text>
  <text x="640" y="150" text-anchor="middle" class="small">مقارنات السياسة</text>
  <rect x="560" y="170" width="160" height="50" class="cold"/>
  <text x="640" y="192" text-anchor="middle" class="step">إليوس: الرفاهية</text>
  <text x="640" y="210" text-anchor="middle" class="small">تقييم التأليف 4</text>

  <rect x="780" y="60" width="160" height="180" class="box"/>
  <text x="860" y="82" text-anchor="middle" class="head">labs</text>
  <text x="860" y="100" text-anchor="middle" class="small">أنثروبي / OpenAI / DM</text>
  <rect x="800" y="110" width="120" height="50" class="hot"/>
  <text x="860" y="132" text-anchor="middle" class="step">فرق السلامة</text>
  <text x="860" y="150" text-anchor="middle" class="small">أكثر من 200 خريج MATS</text>
  <rect x="800" y="170" width="120" height="50" class="hot"/>
  <text x="860" y="192" text-anchor="middle" class="step">RSP / PF / FSF</text>
  <text x="860" y="210" text-anchor="middle" class="small">(الدرس 18)</text>

  <path d="M 260 150 L 300 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow28)" fill="none"/>
  <path d="M 500 150 L 540 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow28)" fill="none"/>
  <path d="M 740 150 L 780 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow28)" fill="none"/>

  <rect x="60" y="280" width="880" height="210" class="box"/>
  <text x="480" y="305" text-anchor="middle" class="head">منشورات متعددة المنظمات لمراقبة الجودة</text>
  <text x="80" y="335" class="small">الوكلاء النائمون (الدرس 7): الإنسان + الخشب الأحمر. يقوم المؤلف المشارك الخارجي بالتحقق من صحة نموذج التهديد.</text>
  <text x="80" y="355" class="small">تزوير المحاذاة (الدرس 9): إنساني + خشب أحمر. نفس النمط.</text>
  <text x="80" y="375" class="small">التدريب على مكافحة المكائد (الدرس 8): أبولو + OpenAI. مقيم خارجي داخل التعاونية التدريبية.</text>
  <text x="80" y="395" class="small">AI التحكم (الدرس 10): الخشب الأحمر، ثم تم نشره في ICML 2024؛ UK AISI شريك من عام 2025.</text>
  <text x="80" y="425" class="small">النظراء التنظيميون: UK AISI (إعادة التسمية في فبراير 2025)، US CAISI (يونيو 2025)، EU AI المكتب.</text>
  <text x="80" y="445" class="small">MATS -&gt; المعامل هي التدفق السائد. الاحتفاظ: 80% على السلامة/الأمن.</text>
  <text x="80" y="475" class="small">الفجوة: أصبحت النظم البيئية المتوافقة في الصين والهند وأفريقيا أقل توثيقًا علنًا اعتبارًا من عام 2026.</text>
</svg>