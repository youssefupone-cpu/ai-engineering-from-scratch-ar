<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">2026 صورة ذات الاستخدام المزدوج: أربعة مجالات CBRN</text>

  <rect x="40" y="60" width="200" height="160" class="box"/>
  <text x="140" y="85" text-anchor="middle" class="head">bio</text>
  <rect x="60" y="100" width="160" height="100" class="hot"/>
  <text x="140" y="125" text-anchor="middle" class="step">2024: ارتفاع معتدل</text>
  <text x="140" y="145" text-anchor="middle" class="step">2025: 2.53x</text>
  <text x="140" y="165" text-anchor="middle" class="small">ASL-3 النهج</text>
  <text x="140" y="185" text-anchor="middle" class="small">أتمتة مرحلة الاستحواذ</text>

  <rect x="260" y="60" width="200" height="160" class="box"/>
  <text x="360" y="85" text-anchor="middle" class="head">chem</text>
  <rect x="280" y="100" width="160" height="100" class="hot"/>
  <text x="360" y="125" text-anchor="middle" class="step">2024: معتدل</text>
  <text x="360" y="145" text-anchor="middle" class="step">2025: تآكل فجوة التنفيذ</text>
  <text x="360" y="165" text-anchor="middle" class="small">تصحيح الرؤية في الوقت الحقيقي</text>
  <text x="360" y="185" text-anchor="middle" class="small">GPT-5 x مختبر رطب: كفاءة 79x</text>

  <rect x="480" y="60" width="200" height="160" class="box"/>
  <text x="580" y="85" text-anchor="middle" class="head">cyber</text>
  <rect x="500" y="100" width="160" height="100" class="hot"/>
  <text x="580" y="125" text-anchor="middle" class="step">2024: مقتطفات التعليمات البرمجية</text>
  <text x="580" y="145" text-anchor="middle" class="step">2025: حملة 80-90%</text>
  <text x="580" y="165" text-anchor="middle" class="small">الجهات الفاعلة المرتبطة بالصين، كلود وكيل</text>
  <text x="580" y="185" text-anchor="middle" class="small">تبقى 4-6 خطوات الإنسان</text>

  <rect x="700" y="60" width="220" height="160" class="box"/>
  <text x="810" y="85" text-anchor="middle" class="head">nuclear</text>
  <rect x="720" y="100" width="180" height="100" class="cool"/>
  <text x="810" y="125" text-anchor="middle" class="step">2024: محدود</text>
  <text x="810" y="145" text-anchor="middle" class="step">2025: محدود</text>
  <text x="810" y="165" text-anchor="middle" class="small">يهيمن الوصول المادي</text>
  <text x="810" y="185" text-anchor="middle" class="small">لا انعطاف 2024-2025</text>

  <rect x="40" y="240" width="880" height="130" class="box"/>
  <text x="480" y="265" text-anchor="middle" class="head">عدم التماثل بين المبتدئين والخبراء</text>
  <rect x="60" y="285" width="420" height="70" class="cold"/>
  <text x="270" y="310" text-anchor="middle" class="step">الارتقاء النسبي المبتدئ</text>
  <text x="270" y="328" text-anchor="middle" class="small">مضاعف؛ عالي؛ مساعدة مرشحات الإدخال</text>
  <text x="270" y="346" text-anchor="middle" class="small">المبتدئ لا يعرف ماذا يسأل</text>
  <rect x="500" y="285" width="400" height="70" class="cold"/>
  <text x="700" y="310" text-anchor="middle" class="step">القدرة المطلقة للخبراء</text>
  <text x="700" y="328" text-anchor="middle" class="small">ارتفاع السقف المرشحات غير كافية</text>
  <text x="700" y="346" text-anchor="middle" class="small">التعلم + السيطرة المطلوبة</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="415" text-anchor="middle" class="head">تطوير الجانب المدافع</text>
  <text x="60" y="440" class="small">OpenAI طيار "الوصول الموثوق به" (2025): يحصل المدافعون الذين تم فحصهم على القدرة على الوصول للعمل الدفاعي ثنائي الاستخدام.</text>
  <text x="60" y="460" class="small">مجلس المخاطر الإستراتيجية 2025 AI x ملخص السيرة الذاتية: تجميع نهاية العام لأدلة الرفع الحيوي.</text>
  <text x="60" y="480" class="small">وضعية 2026: يجب أن تستهدف حالات السلامة الارتقاء بالمبتدئين AND الارتقاء المطلق بالخبير. ثلاثة ركائز (المراقبة، عدم القدرة، عدم القدرة).</text>
</svg>