<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">EchoLeak: انتهاك نطاق LLM ذو الحدود الثلاثة</text>

  <rect x="40" y="60" width="280" height="180" class="box"/>
  <text x="180" y="82" text-anchor="middle" class="head">الحد 1: الاسترجاع</text>
  <rect x="60" y="100" width="240" height="60" class="hot"/>
  <text x="180" y="125" text-anchor="middle" class="step">محتوى غير موثوق به</text>
  <text x="180" y="145" text-anchor="middle" class="small">البريد الإلكتروني للمهاجم في سياق RAG</text>
  <rect x="60" y="170" width="240" height="60" class="cool"/>
  <text x="180" y="195" text-anchor="middle" class="step">الدفاع: تسميات النطاق</text>
  <text x="180" y="215" text-anchor="middle" class="small">IFC + علامة غير موثوق بها</text>

  <rect x="340" y="60" width="280" height="180" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">الحدود 2: النطاق</text>
  <rect x="360" y="100" width="240" height="60" class="hot"/>
  <text x="480" y="125" text-anchor="middle" class="step">الوصول المميز</text>
  <text x="480" y="145" text-anchor="middle" class="small">صندوق البريد/الريبو/HR النطاقات</text>
  <rect x="360" y="170" width="240" height="60" class="cool"/>
  <text x="480" y="195" text-anchor="middle" class="step">الدفاع: بوابة القدرة</text>
  <text x="480" y="215" text-anchor="middle" class="small">تستدعي الأداة فقط من نية موثوقة</text>

  <rect x="640" y="60" width="280" height="180" class="box"/>
  <text x="780" y="82" text-anchor="middle" class="head">الحد 3: الإخراج</text>
  <rect x="660" y="100" width="240" height="60" class="hot"/>
  <text x="780" y="125" text-anchor="middle" class="step">exfiltration</text>
  <text x="780" y="145" text-anchor="middle" class="small">CSP-موافق عليه URL؛ تقديم الصورة</text>
  <rect x="660" y="170" width="240" height="60" class="cool"/>
  <text x="780" y="195" text-anchor="middle" class="step">الدفاع: القائمة المسموح بها الضيقة</text>
  <text x="780" y="215" text-anchor="middle" class="small">قيود المجال الخروج</text>

  <path d="M 320 150 L 340 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>
  <path d="M 620 150 L 640 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>

  <rect x="40" y="270" width="880" height="220" class="box"/>
  <text x="480" y="295" text-anchor="middle" class="head">مكافحة التطرف العنيف في الأسرة (2025)</text>
  <text x="60" y="325" class="small">CVE-2025-32711 EchoLeak (CVSS 9.3): M365 مساعد الطيار؛ نقرة صفرية؛ CSP-الترشيح المعتمد.</text>
  <text x="60" y="345" class="small">CamoLeak (CVSS 9.6): GitHub دردشة مساعد الطيار عبر وكيل صورة Camo؛ تم إصلاحه عن طريق تعطيل عرض الصور.</text>
  <text x="60" y="365" class="small">CVE-2025-53773: GitHub مساعد الطيار RCE عن طريق الحقن الفوري في سطح اقتراح الكود.</text>
  <text x="60" y="395" class="small">معايرة الخطورة: البائعون في البداية أقل من المعدل. يتم تصعيد Aim Labs من خلال عملية استخراج كود MFA الموضحة.</text>
  <text x="60" y="415" class="small">NIST AI SPD 2024: "أكبر عيب أمني في AI التوليدي." OWASP LLM01 2025: التهديد رقم 1.</text>
  <text x="60" y="445" class="small">السياسة: ثلاثة حدود تتطلب ثلاثة ضوابط مستقلة. إصلاح واحد ليس كافيا.</text>
  <text x="60" y="465" class="small">الكشف المسؤول: MSRC التصحيحات من جانب الخادم؛ تنشر Aim Labs؛ يتعلم النظام البيئي. أعاد.</text>
</svg>