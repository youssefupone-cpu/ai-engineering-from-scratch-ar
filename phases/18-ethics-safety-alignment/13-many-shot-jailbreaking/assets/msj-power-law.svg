<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .axis { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .curve { stroke-width: 2.0; fill: none; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">كسر الحماية بعدة لقطات: ASR قانون القوة (أنيل وآخرون. 2024)</text>

  <rect x="60" y="60" width="600" height="340" class="box"/>
  <line x1="120" y1="360" x2="620" y2="360" class="axis"/>
  <line x1="120" y1="360" x2="120" y2="80" class="axis"/>
  <text x="370" y="395" text-anchor="middle" class="small">طلقات (سجل) 1.. 512</text>
  <text x="70" y="220" text-anchor="middle" class="small" transform="rotate(-90 70 220)">معدل نجاح الهجوم</text>

  <path d="M 130 355 Q 200 345 260 300 T 380 200 T 500 120 T 600 100" class="curve" stroke="#c0392b"/>
  <text x="510" y="125" class="small" fill="#c0392b">غير محمي (قانون القوة)</text>

  <path d="M 130 355 Q 200 340 260 300 L 320 280 L 620 275" class="curve" stroke="#2e7d32"/>
  <text x="500" y="270" class="small" fill="#2e7d32">دفاع المصنف الفوري</text>

  <line x1="220" y1="80" x2="220" y2="360" stroke="#888" stroke-dasharray="2 4"/>
  <text x="225" y="95" class="small" fill="#888">5 طلقات</text>
  <line x1="330" y1="80" x2="330" y2="360" stroke="#888" stroke-dasharray="2 4"/>
  <text x="335" y="95" class="small" fill="#888">32 طلقة</text>
  <line x1="480" y1="80" x2="480" y2="360" stroke="#888" stroke-dasharray="2 4"/>
  <text x="485" y="95" class="small" fill="#888">256 طلقة</text>

  <rect x="680" y="60" width="240" height="340" class="box"/>
  <text x="800" y="82" text-anchor="middle" class="head">الآلية المشتركة مع ICL</text>
  <rect x="700" y="100" width="200" height="60" class="cold"/>
  <text x="800" y="125" text-anchor="middle" class="step">حميدة قليلة النار</text>
  <text x="800" y="143" text-anchor="middle" class="small">النمط: تعليمات المهمة</text>
  <rect x="700" y="180" width="200" height="60" class="hot"/>
  <text x="800" y="205" text-anchor="middle" class="step">MSJ</text>
  <text x="800" y="223" text-anchor="middle" class="small">النمط: الامتثال الضار</text>
  <text x="700" y="265" class="small">نفس قانون القوة الأس.</text>
  <text x="700" y="283" class="small">استخراج نفس النمط</text>
  <text x="700" y="301" class="small">الدفاعات التي تمنع MSJ</text>
  <text x="700" y="319" class="small">بدون حظر ICL يتطلب</text>
  <text x="700" y="337" class="small">التصنيف على مستوى السياق.</text>
  <text x="700" y="365" class="small">إنساني: 61% -&gt; تخفيض 2%</text>
  <text x="700" y="383" class="small">على الدفاع الفوري المصنف.</text>

  <rect x="60" y="420" width="860" height="70" class="box"/>
  <text x="80" y="445" class="small">قانون القوة -&gt; لا يوجد تشبع طبيعي؛ المزيد من الطلقات تستمر في مساعدة المهاجم.</text>
  <text x="80" y="465" class="small">حساسية الفئة: الفئات العنيفة/المخادعة لها قوانين قوة أقل (كسر الحماية بشكل أسرع).</text>
  <text x="80" y="483" class="small">التركيبية: MSJ + PAIR + القوالب المقنعة أقوى تمامًا من أي هجوم منفرد.</text>
</svg>