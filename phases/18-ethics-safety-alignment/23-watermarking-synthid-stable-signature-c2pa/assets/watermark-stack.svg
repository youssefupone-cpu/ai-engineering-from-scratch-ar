<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">المصدر: العلامات المائية + C2PA كطبقات تكميلية</text>

  <rect x="40" y="60" width="880" height="180" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">طريقة × آلية</text>
  <rect x="60" y="105" width="200" height="110" class="cool"/>
  <text x="160" y="130" text-anchor="middle" class="step">text</text>
  <text x="160" y="152" text-anchor="middle" class="small">نص SynthID (كيرشنباور)</text>
  <text x="160" y="170" text-anchor="middle" class="small">تحيز الرمز الأخضر/الأحمر</text>
  <text x="160" y="190" text-anchor="middle" class="small">paraphrase-vulnerable</text>

  <rect x="280" y="105" width="200" height="110" class="cool"/>
  <text x="380" y="130" text-anchor="middle" class="step">image</text>
  <text x="380" y="152" text-anchor="middle" class="small">SynthID + التوقيع الثابت</text>
  <text x="380" y="170" text-anchor="middle" class="small">بصمة فك التشفير الكامنة</text>
  <text x="380" y="190" text-anchor="middle" class="small">fine-tune-vulnerable</text>

  <rect x="500" y="105" width="200" height="110" class="cool"/>
  <text x="600" y="130" text-anchor="middle" class="step">audio</text>
  <text x="600" y="152" text-anchor="middle" class="small">SynthID-audio</text>
  <text x="600" y="170" text-anchor="middle" class="small">إشارة طيفية</text>
  <text x="600" y="190" text-anchor="middle" class="small">re-encoding-resistant</text>

  <rect x="720" y="105" width="180" height="110" class="cool"/>
  <text x="810" y="130" text-anchor="middle" class="step">video</text>
  <text x="810" y="152" text-anchor="middle" class="small">فيديو SynthID (Veo)</text>
  <text x="810" y="170" text-anchor="middle" class="small">الإطار + إشارة زمنية</text>
  <text x="810" y="190" text-anchor="middle" class="small">معدل الإطار قوي</text>

  <rect x="40" y="260" width="880" height="110" class="box"/>
  <text x="480" y="285" text-anchor="middle" class="head">C2PA 2.2: البيانات الوصفية الموقعة بالتشفير</text>
  <rect x="60" y="305" width="420" height="50" class="cold"/>
  <text x="270" y="327" text-anchor="middle" class="step">سلسلة مصدر</text>
  <text x="270" y="345" text-anchor="middle" class="small">الخالق، المكونات، التحولات</text>
  <rect x="500" y="305" width="400" height="50" class="cold"/>
  <text x="700" y="327" text-anchor="middle" class="step">البيان الموقع</text>
  <text x="700" y="345" text-anchor="middle" class="small">واضح العبث؛ يمكن تجريدها</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="415" text-anchor="middle" class="head">خصائص الطبقات</text>
  <text x="60" y="440" class="small">العلامة المائية تنجو من الضغط، والاقتصاص، وإعادة التشفير؛ هل ينجح NOT في إعادة الصياغة أو الضبط الدقيق للمعارضة.</text>
  <text x="60" y="460" class="small">C2PA البيانات الوصفية تحمل مصدرًا أكثر ثراءً؛ CAN يتم تجريده ولكن غيابه يشير إلى الشك.</text>
  <text x="60" y="478" class="small">تنظيميًا: EU AI تتطلب المادة 50 من القانون (سارية في أغسطس 2026) وضع علامات التزييف العميق؛ قانون الشفافية النهائي يونيو 2026.</text>
</svg>