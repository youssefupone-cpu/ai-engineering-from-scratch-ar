<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">قم بتوجيه محاذاة GPT ثلاثية المراحل pipeline</text>

  <rect x="40" y="60" width="260" height="260" class="box"/>
  <text x="170" y="82" text-anchor="middle" class="head">المرحلة 1 — SFT</text>

  <rect x="60" y="100" width="220" height="60" class="cool"/>
  <text x="170" y="125" text-anchor="middle" class="step">المطالبات + العروض التوضيحية (13 ألفًا)</text>
  <text x="170" y="145" text-anchor="middle" class="small">ردود مكتوبة التسمية</text>

  <rect x="60" y="180" width="220" height="60" class="cool"/>
  <text x="170" y="205" text-anchor="middle" class="step">ضبط الانتروبيا المتقاطعة</text>
  <text x="170" y="225" text-anchor="middle" class="small">بي_SFT(ص | س)</text>

  <text x="170" y="285" text-anchor="middle" class="caption">الآن يجيب النموذج،</text>
  <text x="170" y="301" text-anchor="middle" class="caption">ولكن لا يمكن ترتيب الإجابات.</text>

  <rect x="350" y="60" width="260" height="260" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">المرحلة 2 - نموذج المكافأة</text>

  <rect x="370" y="100" width="220" height="60" class="cold"/>
  <text x="480" y="125" text-anchor="middle" class="step">إكمال K لكل موجه</text>
  <text x="480" y="145" text-anchor="middle" class="small">labeler يرتب الأزواج</text>

  <rect x="370" y="180" width="220" height="60" class="cold"/>
  <text x="480" y="202" text-anchor="middle" class="step">تناسب برادلي تيري</text>
  <text x="480" y="222" text-anchor="middle" class="small">-سجل سيج (r_w - r_l)</text>

  <text x="480" y="285" text-anchor="middle" class="caption">الوكيل العددي ل</text>
  <text x="480" y="301" text-anchor="middle" class="caption">تفضيل التسمية.</text>

  <rect x="660" y="60" width="260" height="260" class="box"/>
  <text x="790" y="82" text-anchor="middle" class="head">المرحلة 3 — PPO</text>

  <rect x="680" y="100" width="220" height="60" class="hot"/>
  <text x="790" y="125" text-anchor="middle" class="step">تكبير ص (س، ص)</text>
  <text x="790" y="145" text-anchor="middle" class="small">- بيتا * KL(بي || بي__SFT)</text>

  <rect x="680" y="180" width="220" height="60" class="hot"/>
  <text x="790" y="202" text-anchor="middle" class="step">+ جاما * سجل بي (D_pretrain)</text>
  <text x="790" y="222" text-anchor="middle" class="small">PPO-ptx: إصلاح ضريبة المحاذاة</text>

  <text x="790" y="285" text-anchor="middle" class="caption">RM تسلق النتيجة،</text>
  <text x="790" y="301" text-anchor="middle" class="caption">KL المرساة تثبت على الأرض.</text>

  <path d="M 300 190 L 350 190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 610 190 L 660 190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="40" y="360" width="880" height="130" class="box"/>
  <text x="480" y="385" text-anchor="middle" class="head">لماذا يتفوق 1.3B InstructGPT على 175B GPT-3 في التفضيل البشري</text>
  <text x="60" y="412" class="small">1/ المحاذاة محور مختلف عن القدرة؛ يقوم النموذج 1.3B بالمهمة التي طلبها البشر.</text>
  <text x="60" y="432" class="small">2 / لا يزال يتم تحديد الحد الأدنى للقدرة بواسطة النموذج الأساسي — RLHF لا يمكنه تعليم حقائق جديدة.</text>
  <text x="60" y="452" class="small">3 / كل نقد لاحق في المرحلة 18 يهاجم المرحلة 2 (اختراق المكافأة)، المرحلة 3 (KL غير منتظم)، أو</text>
  <text x="60" y="470" class="small">    الملصق نفسه (التملق، تزوير المحاذاة). تعرف على هذا pipeline قبل قراءة الانتقادات.</text>
</svg>