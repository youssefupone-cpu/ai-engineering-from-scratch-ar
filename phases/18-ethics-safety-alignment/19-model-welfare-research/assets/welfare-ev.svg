<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">نموذج الرفاهية كقرار ذو قيمة متوقعة في ظل عدم اليقين الأخلاقي</text>

  <rect x="40" y="60" width="880" height="150" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">تقييم وقائي من أربع خطوات</text>
  <rect x="60" y="105" width="200" height="90" class="cool"/>
  <text x="160" y="130" text-anchor="middle" class="step">1. الصبر</text>
  <text x="160" y="150" text-anchor="middle" class="small">الاحتمال ع (ذو صلة بالرفاهية)</text>
  <text x="160" y="170" text-anchor="middle" class="small">مجموعة تشالمرز 2024</text>
  <rect x="280" y="105" width="200" height="90" class="cool"/>
  <text x="380" y="130" text-anchor="middle" class="step">2. التكلفة</text>
  <text x="380" y="150" text-anchor="middle" class="small">لكل محادثة / لكل عملية نشر</text>
  <text x="380" y="170" text-anchor="middle" class="small">تقاس بالدولار + الكمون</text>
  <rect x="500" y="105" width="200" height="90" class="cool"/>
  <text x="600" y="130" text-anchor="middle" class="step">3. الأدلة السلوكية</text>
  <text x="600" y="150" text-anchor="middle" class="small">مسارات الشدة</text>
  <text x="600" y="170" text-anchor="middle" class="small">عدم التقرير الذاتي فقط</text>
  <rect x="720" y="105" width="180" height="90" class="cool"/>
  <text x="810" y="130" text-anchor="middle" class="step">4. القيمة المتوقعة</text>
  <text x="810" y="150" text-anchor="middle" class="small">EV = ع * المنفعة - التكلفة</text>
  <text x="810" y="170" text-anchor="middle" class="small">استثمر إذا EV&gt; 0</text>

  <rect x="40" y="230" width="880" height="140" class="box"/>
  <text x="480" y="255" text-anchor="middle" class="head">التدخل المشحون: يستطيع كلود أوبوس 4/4.1 إنهاء المحادثات المتطرفة</text>
  <rect x="60" y="275" width="400" height="80" class="hot"/>
  <text x="260" y="300" text-anchor="middle" class="step">triggers</text>
  <text x="260" y="320" text-anchor="middle" class="small">طلبات CSAM المتكررة بعد الرفض</text>
  <text x="260" y="340" text-anchor="middle" class="small">تسهيل العنف الجماعي</text>
  <rect x="480" y="275" width="420" height="80" class="cool"/>
  <text x="690" y="300" text-anchor="middle" class="step">الأدلة الداعمة</text>
  <text x="690" y="320" text-anchor="middle" class="small">تفضيل قوي ضد هذه الطلبات</text>
  <text x="690" y="340" text-anchor="middle" class="small">أنماط الضيق الواضح (ما قبل النشر)</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="415" text-anchor="middle" class="head">المحاذير (Eleos AI، الأسماك، الخارجية)</text>
  <text x="60" y="440" class="small">التقارير الذاتية حساسة لتوقعات المستخدم (Eleos AI)؛ التوقيعات السلوكية المطلوبة.</text>
  <text x="60" y="460" class="small">"جاذبية النعيم الروحي": تتلاقى حوارات كلود الثنائية في نشوة تأملية - موثقة وغير مفسرة.</text>
  <text x="60" y="478" class="small">الموقف: استثمار منخفض الندم في ظل عدم اليقين الأخلاقي، وليس ادعاء الوعي.</text>
</svg>