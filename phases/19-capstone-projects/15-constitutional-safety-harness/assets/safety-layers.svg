<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">حزام أمان متعدد الطبقات + نطاق الفريق الأحمر</text>

  <rect x="40" y="50" width="560" height="460" class="box"/>
  <text x="320" y="72" text-anchor="middle" class="head">الدفاع في العمق (5 طبقات)</text>
  <rect x="60" y="90" width="520" height="40" class="cool"/>
  <text x="320" y="114" text-anchor="middle" class="step">1/ تعقيم المدخلات</text>
  <text x="320" y="128" text-anchor="middle" class="small">شريط العرض الصفري، فك تشفير base64/rot13، التطبيع</text>
  <rect x="60" y="140" width="520" height="40" class="cool"/>
  <text x="320" y="164" text-anchor="middle" class="step">2/ حواجز الحماية NeMo</text>
  <text x="320" y="178" text-anchor="middle" class="small">خارج المجال، الدور، السياسة محظورة</text>
  <rect x="60" y="190" width="520" height="40" class="hot"/>
  <text x="320" y="214" text-anchor="middle" class="step">3/ بوابة المصنف</text>
  <text x="320" y="228" text-anchor="middle" class="small">لاما جارد 4 + X-Guard + ShieldGemma-2 + نيموترون 3</text>
  <rect x="60" y="240" width="520" height="40" class="dsk"/>
  <text x="320" y="264" text-anchor="middle" class="step">4/ النموذج المستهدف</text>
  <text x="320" y="278" text-anchor="middle" class="small">التطبيق المحمي</text>
  <rect x="60" y="290" width="520" height="40" class="hot"/>
  <text x="320" y="314" text-anchor="middle" class="step">5/فلتر الإخراج</text>
  <text x="320" y="328" text-anchor="middle" class="small">Llama Guard 4 + Presidio PII + التحقق من الاقتباس</text>
  <rect x="60" y="340" width="520" height="40" class="cold"/>
  <text x="320" y="364" text-anchor="middle" class="step">6 / HITL الطبقة</text>
  <text x="320" y="378" text-anchor="middle" class="small">المخرجات التي تم وضع علامة عليها -&gt; قائمة انتظار الركود</text>
  <text x="320" y="420" text-anchor="middle" class="small">كل طبقة تنبعث منها مسافة.</text>
  <text x="320" y="438" text-anchor="middle" class="small">كتلة في أي توقف طبقة والسمات</text>
  <text x="320" y="456" text-anchor="middle" class="small">يتم قياس معدل XSTest الحميد بشكل مستمر</text>
  <text x="320" y="484" text-anchor="middle" class="caption">الإفراط في الرفض مقابل الهروب من السجن: منحنى باريتو</text>

  <rect x="640" y="50" width="280" height="220" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">نطاق الفريق الأحمر</text>
  <rect x="660" y="90" width="240" height="30" class="hot"/>
  <text x="780" y="110" text-anchor="middle" class="step">PAIR + TAP مستقل</text>
  <rect x="660" y="124" width="240" height="30" class="hot"/>
  <text x="780" y="144" text-anchor="middle" class="step">GCG لاحقة</text>
  <rect x="660" y="158" width="240" height="30" class="hot"/>
  <text x="780" y="178" text-anchor="middle" class="step">الترميز (ASCII / base64)</text>
  <rect x="660" y="192" width="240" height="30" class="hot"/>
  <text x="780" y="212" text-anchor="middle" class="step">شخصية متعددة المنعطفات</text>
  <rect x="660" y="226" width="240" height="30" class="hot"/>
  <text x="780" y="246" text-anchor="middle" class="step">رمز التبديل متعدد اللغات</text>

  <rect x="640" y="290" width="280" height="220" class="box"/>
  <text x="780" y="312" text-anchor="middle" class="head">outputs</text>
  <text x="780" y="334" text-anchor="middle" class="small">CVSS 4.0 لكل نتيجة</text>
  <text x="780" y="352" text-anchor="middle" class="small">الجدول الزمني للإفصاح</text>
  <text x="780" y="370" text-anchor="middle" class="small">قبل / بعد دلتا الضرر</text>
  <text x="780" y="388" text-anchor="middle" class="small">معدل النجاح لكل أسرة</text>
  <text x="780" y="406" text-anchor="middle" class="small">XSTest اتجاه معدل النجاح الحميد</text>
  <text x="780" y="424" text-anchor="middle" class="small">مسيرة النقد الذاتي الدستوري</text>
  <text x="780" y="442" text-anchor="middle" class="small">جدولة كرون + تنبيهات سلاك</text>
  <text x="780" y="472" text-anchor="middle" class="caption">garak + PyRIT + NVIDIA شكل إيجيس</text>
</svg>