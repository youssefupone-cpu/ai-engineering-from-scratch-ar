<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">صوت pipeline - إخراج الصوت الأول للهدف p50 &lt; 800 مللي ثانية</text>

  <rect x="40" y="50" width="880" height="90" class="box"/>
  <text x="480" y="70" text-anchor="middle" class="head">مراحل البث (جميعها pipمحددة)</text>
  <rect x="60" y="84" width="150" height="48" class="cool"/>
  <text x="135" y="104" text-anchor="middle" class="step">الصوت في (WebRTC)</text>
  <text x="135" y="122" text-anchor="middle" class="small">20 مللي ثانية PCM إطارات</text>
  <rect x="220" y="84" width="150" height="48" class="cool"/>
  <text x="295" y="104" text-anchor="middle" class="step">ASR البث المباشر</text>
  <text x="295" y="122" text-anchor="middle" class="small">ديبجرام نوفا-3</text>
  <rect x="380" y="84" width="150" height="48" class="hot"/>
  <text x="455" y="104" text-anchor="middle" class="step">VAD + كشف الدور</text>
  <text x="455" y="122" text-anchor="middle" class="small">كاشف Silero v5 + LK</text>
  <rect x="540" y="84" width="150" height="48" class="cold"/>
  <text x="615" y="104" text-anchor="middle" class="step">LLM البث المباشر</text>
  <text x="615" y="122" text-anchor="middle" class="small">GPT-4o-realtime</text>
  <rect x="700" y="84" width="150" height="48" class="dsk"/>
  <text x="775" y="104" text-anchor="middle" class="step">TTS البث المباشر</text>
  <text x="775" y="122" text-anchor="middle" class="small">كارتيسيا سونيك-2</text>

  <rect x="40" y="160" width="880" height="180" class="box"/>
  <text x="480" y="180" text-anchor="middle" class="head">ميزانية الكمون (إجمالي 800 مللي ثانية)</text>
  <rect x="60" y="200" width="830" height="40" class="cool"/>
  <text x="80" y="220" class="step">ASR جزئي + VAD اكتشاف الصمت: ~320 مللي ثانية</text>
  <text x="80" y="236" class="small">يعمل Silero لكل إطار 20 مللي ثانية؛ يقرأ كاشف الدوران جزئيًا عندما يكون الصمت &gt; = 500 مللي ثانية</text>
  <rect x="60" y="246" width="830" height="40" class="hot"/>
  <text x="80" y="266" class="step">قرار إكمال الدور: 40 مللي ثانية</text>
  <text x="80" y="282" class="small">درجة الإنجاز من النص الجزئي، العتبة 0.6؛ وإلا استمر في الاستماع</text>
  <rect x="60" y="292" width="830" height="40" class="cold"/>
  <text x="80" y="312" class="step">LLM الوقت حتى أول رمز: 140 مللي ثانية</text>
  <text x="80" y="328" class="small">استكمال التدفق؛ دعم سياق 1M؛ موجه النظام القصير المخزن مؤقتا</text>
  <rect x="60" y="338" width="830" height="40" class="dsk"/>

  <rect x="40" y="360" width="440" height="180" class="box"/>
  <text x="260" y="382" text-anchor="middle" class="head">التحكيم بالبارجة</text>
  <rect x="60" y="394" width="400" height="36" class="hot"/>
  <text x="260" y="416" text-anchor="middle" class="step">VAD إلقاء الخطاب خلال TTS -&gt; إلغاء</text>
  <text x="260" y="440" text-anchor="middle" class="small">قم بإسقاط الإخراج LLM المتبقي، وقم بمسح المخزن المؤقت TTS</text>
  <text x="260" y="456" text-anchor="middle" class="small">أعد تسليح ASR لدورة جديدة</text>
  <text x="260" y="480" text-anchor="middle" class="small">نشر نطاق tts_canceled (OpenTelemetry)</text>
  <text x="260" y="504" text-anchor="middle" class="small">هدف معدل القطع الخاطئ &lt; 3%</text>
  <text x="260" y="524" text-anchor="middle" class="caption">يقيس مقياس هامينغ VAD هذا</text>

  <rect x="500" y="360" width="420" height="180" class="box"/>
  <text x="710" y="382" text-anchor="middle" class="head">قناة جانبية للأداة</text>
  <rect x="520" y="394" width="380" height="36" class="cold"/>
  <text x="710" y="416" text-anchor="middle" class="step">مكالمة في منتصف المحادثة (الطقس والتقويم)</text>
  <text x="710" y="440" text-anchor="middle" class="small">يتم تشغيله بالتزامن مع دفق LLM</text>
  <text x="710" y="456" text-anchor="middle" class="small">إذا كان &gt; 300 مللي ثانية: قم بإصدار حشو "ثانية واحدة، دعني أتحقق"</text>
  <text x="710" y="480" text-anchor="middle" class="small">استئناف LLM عند إرجاع الأداة، ولصق النتيجة في المطالبة</text>
  <text x="710" y="504" text-anchor="middle" class="small">نقل سريعMCP، مهلة لكل أداة</text>
  <text x="710" y="524" text-anchor="middle" class="caption">لا تقم أبدًا بإيقاف البث الصوتي</text>
</svg>