<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">وكيل الترميز السحابي غير المتزامن - قم بالتسمية لسير العمل PR</text>

  <rect x="40" y="60" width="190" height="80" class="cool"/>
  <text x="135" y="82" text-anchor="middle" class="step">GitHub تصنيف المشكلة</text>
  <text x="135" y="100" text-anchor="middle" class="small">@agent أصلح هذا</text>
  <text x="135" y="118" text-anchor="middle" class="small">PR مشغل التعليق</text>

  <rect x="260" y="60" width="190" height="80" class="cold"/>
  <text x="355" y="82" text-anchor="middle" class="step">جهاز استقبال الويب هوك</text>
  <text x="355" y="100" text-anchor="middle" class="small">لامدا / Fly.io</text>
  <text x="355" y="118" text-anchor="middle" class="small">انضم إلى SQS</text>

  <rect x="480" y="60" width="190" height="80" class="dsk"/>
  <text x="575" y="82" text-anchor="middle" class="step">dispatcher</text>
  <text x="575" y="100" text-anchor="middle" class="small">دفتر الميزانية</text>
  <text x="575" y="118" text-anchor="middle" class="small">قبعات لكل الريبو</text>

  <rect x="700" y="60" width="220" height="80" class="hot"/>
  <text x="810" y="82" text-anchor="middle" class="step">ECS مهمة فارغات</text>
  <text x="810" y="100" text-anchor="middle" class="small">رمل دايتونا</text>
  <text x="810" y="118" text-anchor="middle" class="small">العزلة لكل مهمة</text>

  <path d="M230,100 L260,100" class="edge"/>
  <path d="M450,100 L480,100" class="edge"/>
  <path d="M670,100 L700,100" class="edge"/>

  <rect x="40" y="170" width="880" height="200" class="box"/>
  <text x="480" y="192" text-anchor="middle" class="head">آلة حالة رمل</text>

  <rect x="60" y="208" width="140" height="46" class="cool"/>
  <text x="130" y="228" text-anchor="middle" class="step">CLONE</text>
  <text x="130" y="244" text-anchor="middle" class="small">رمز الحبيبات الدقيقة</text>
  <rect x="220" y="208" width="140" height="46" class="cool"/>
  <text x="290" y="228" text-anchor="middle" class="step">INFER</text>
  <text x="290" y="244" text-anchor="middle" class="small">موالفة ملف دوكر</text>
  <rect x="380" y="208" width="180" height="46" class="dsk"/>
  <text x="470" y="228" text-anchor="middle" class="step">AGENT حلقة</text>
  <text x="470" y="244" text-anchor="middle" class="small">ميني سوي وكيل + أوبوس 4.7</text>
  <rect x="580" y="208" width="140" height="46" class="hot"/>
  <text x="650" y="228" text-anchor="middle" class="step">VERIFY</text>
  <text x="650" y="244" text-anchor="middle" class="small">CI + دلتا التغطية</text>
  <rect x="740" y="208" width="160" height="46" class="cool"/>
  <text x="820" y="228" text-anchor="middle" class="step">PR مفتوح</text>
  <text x="820" y="244" text-anchor="middle" class="small">التسميات: مراجعة الاحتياجات</text>

  <path d="M200,230 L220,230" class="edge"/>
  <path d="M360,230 L380,230" class="edge"/>
  <path d="M560,230 L580,230" class="edge"/>
  <path d="M720,230 L740,230" class="edge"/>

  <text x="80" y="296" class="small">حدود الميزانية المفروضة لكل مهمة:</text>
  <text x="80" y="314" class="small">  20 دولارًا / غطاء دوران 30 / 30 دقيقة ساعة حائط</text>
  <text x="80" y="332" class="small">دلتا التغطية &lt; -2% -&gt; التسمية `needs-review` ولكنها لا تزال مفتوحة PR</text>
  <text x="80" y="350" class="small">CI علامة حمراء أو علامة رأسية -&gt; لا PR، سجل الفشل مع الأساس المنطقي</text>

  <rect x="40" y="390" width="440" height="120" class="box"/>
  <text x="260" y="412" text-anchor="middle" class="head">safety</text>
  <text x="260" y="432" text-anchor="middle" class="small">GitHub التطبيق: رمز مميز، تنتهي صلاحيته لمدة ساعة واحدة</text>
  <text x="260" y="450" text-anchor="middle" class="small">لا يوجد دفع بالقوة، ولا كتابة على المفتاح الرئيسي</text>
  <text x="260" y="468" text-anchor="middle" class="small">حماية فرع على الرئيسية المفروضة</text>
  <text x="260" y="486" text-anchor="middle" class="small">سجل فرك للأسرار قبل الأرشفة</text>
  <text x="260" y="504" text-anchor="middle" class="caption">لكل إعادة شراء يوميًا $ + PR أسقف العد</text>

  <rect x="500" y="390" width="420" height="120" class="box"/>
  <text x="710" y="412" text-anchor="middle" class="head">compare-vs-hosted</text>
  <text x="710" y="432" text-anchor="middle" class="small">30 قضية داخلية مصنفة</text>
  <text x="710" y="450" text-anchor="middle" class="small">pass@1 / $ / زمن الوصول مقابل:</text>
  <text x="710" y="468" text-anchor="middle" class="small">وكلاء خلفية المؤشر</text>
  <text x="710" y="486" text-anchor="middle" class="small">AWS الوكلاء البعيدون SWE</text>
  <text x="710" y="504" text-anchor="middle" class="caption">نشر المصفوفة جنبًا إلى جنب</text>
</svg>