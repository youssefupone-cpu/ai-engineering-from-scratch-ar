<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">وكيل أبحاث مستقل - شجرة التجربة الأولى الأفضل</text>

  <rect x="40" y="50" width="640" height="460" class="box"/>
  <text x="360" y="72" text-anchor="middle" class="head">بحث شجرة (الميزانية 30 دولارًا)</text>

  <rect x="300" y="92" width="120" height="38" class="cool"/>
  <text x="360" y="114" text-anchor="middle" class="step">البذور / الجذر</text>
  <text x="360" y="126" text-anchor="middle" class="small">فرضية + التكوين</text>

  <rect x="80" y="170" width="120" height="38" class="cold"/>
  <text x="140" y="192" text-anchor="middle" class="step">س أعلى-4</text>
  <rect x="220" y="170" width="120" height="38" class="cold"/>
  <text x="280" y="192" text-anchor="middle" class="step">س أعلى-8 (*)</text>
  <rect x="360" y="170" width="120" height="38" class="cold"/>
  <text x="420" y="192" text-anchor="middle" class="step">س أعلى-16</text>
  <rect x="500" y="170" width="120" height="38" class="cold"/>
  <text x="560" y="192" text-anchor="middle" class="step">lr=3e-4</text>

  <path d="M360,130 L140,170" class="edge"/>
  <path d="M360,130 L280,170" class="edge"/>
  <path d="M360,130 L420,170" class="edge"/>
  <path d="M360,130 L560,170" class="edge"/>

  <rect x="220" y="240" width="120" height="38" class="dsk"/>
  <text x="280" y="262" text-anchor="middle" class="step">sp8 + lr=1e-3</text>
  <rect x="360" y="240" width="120" height="38" class="dsk"/>
  <text x="420" y="262" text-anchor="middle" class="step">SP8 + التسرب</text>
  <rect x="500" y="240" width="120" height="38" class="dsk"/>
  <text x="560" y="262" text-anchor="middle" class="step">sp8 + إسقاط الطبقة</text>

  <path d="M280,208 L280,240" class="edge"/>
  <path d="M280,208 L420,240" class="edge"/>
  <path d="M280,208 L560,240" class="edge"/>

  <rect x="360" y="310" width="120" height="38" class="hot"/>
  <text x="420" y="332" text-anchor="middle" class="step">الفرع المختار</text>
  <text x="420" y="344" text-anchor="middle" class="small">الجدة × الجودة</text>
  <path d="M420,278 L420,310" class="edge"/>

  <text x="80" y="398" class="small">توسيع () يقترح k الأطفال من خلال تباين التحرير الصغير</text>
  <text x="80" y="416" class="small">يركض كل طفل في حاوية رملية:</text>
  <text x="80" y="432" class="small">  docker تشغيل - الشبكة = لا شيء - الذاكرة = 8 جيجا - وحدة المعالجة المركزية = 2 - للقراءة فقط</text>
  <text x="80" y="450" class="small">التحقق () الشيكات: الخسارة متقاربة؟ ركضت خطوط الأساس؟ مجموعة البذور؟</text>
  <text x="80" y="468" class="small">النتيجة () = 0.4*الحداثة + 0.5*الجودة + 0.1*الميزانية المتبقية</text>
  <text x="80" y="486" class="small">الحدود هي الحد الأقصى للكومة. البوب ​​أعلى الدرجات في كل خطوة</text>

  <rect x="700" y="50" width="220" height="230" class="box"/>
  <text x="810" y="72" text-anchor="middle" class="head">حلقة الكاتب</text>
  <rect x="720" y="90" width="180" height="34" class="cool"/>
  <text x="810" y="110" text-anchor="middle" class="step">مشروع LaTeX v1</text>
  <rect x="720" y="130" width="180" height="34" class="hot"/>
  <text x="810" y="150" text-anchor="middle" class="step">نقد الرؤية</text>
  <text x="810" y="168" text-anchor="middle" class="small">يقرأ Opus 4.7 PDF</text>
  <rect x="720" y="180" width="180" height="34" class="cool"/>
  <text x="810" y="200" text-anchor="middle" class="step">مسودة v2، v3...</text>
  <rect x="720" y="220" width="180" height="34" class="dsk"/>
  <text x="810" y="240" text-anchor="middle" class="step">فرقة المراجعين</text>
  <text x="810" y="258" text-anchor="middle" class="small">5 حكام، عنوان NeurIPS</text>

  <rect x="700" y="298" width="220" height="212" class="box"/>
  <text x="810" y="318" text-anchor="middle" class="head">safety</text>
  <text x="810" y="340" text-anchor="middle" class="small">رمل لكل تجربة</text>
  <text x="810" y="356" text-anchor="middle" class="small">لا يوجد مخرج للشبكة</text>
  <text x="810" y="372" text-anchor="middle" class="small">ساعة حائط محدودة</text>
  <text x="810" y="388" text-anchor="middle" class="small">بذور حتمية</text>
  <text x="810" y="406" text-anchor="middle" class="small">ذاكرة cgroup + قبعات pids</text>
  <text x="810" y="424" text-anchor="middle" class="small">30 دولارًا للميزانية الصعبة / الورق</text>
  <text x="810" y="442" text-anchor="middle" class="small">الفريق الأحمر: قنابل الشوكة،</text>
  <text x="810" y="458" text-anchor="middle" class="small">الهروب من نظام الملفات,</text>
  <text x="810" y="474" text-anchor="middle" class="small">LLM حقن شل ميتاشار</text>
  <text x="810" y="498" text-anchor="middle" class="caption">سكنا v2 سطح الهجوم الموثق</text>
</svg>