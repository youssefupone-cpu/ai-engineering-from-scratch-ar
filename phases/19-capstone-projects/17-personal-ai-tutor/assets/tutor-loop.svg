<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">مدرس شخصي AI - مدخلات متعددة الوسائط + نموذج المتعلم + السلامة</text>

  <rect x="40" y="50" width="220" height="160" class="cool"/>
  <text x="150" y="72" text-anchor="middle" class="head">الإدخال المتعدد الوسائط</text>
  <rect x="60" y="90" width="180" height="30" class="cool"/>
  <text x="150" y="110" text-anchor="middle" class="step">رسالة نصية (دردشة ويب)</text>
  <rect x="60" y="126" width="180" height="30" class="cool"/>
  <text x="150" y="146" text-anchor="middle" class="step">الصوت (LiveKit + Whisper)</text>
  <rect x="60" y="162" width="180" height="30" class="cool"/>
  <text x="150" y="182" text-anchor="middle" class="step">الرياضيات الصورية (dots.ocr)</text>

  <rect x="300" y="50" width="320" height="160" class="dsk"/>
  <text x="460" y="72" text-anchor="middle" class="head">سياسة المعلم (LangGraph)</text>
  <rect x="320" y="90" width="280" height="28" class="cool"/>
  <text x="460" y="110" text-anchor="middle" class="step">إشارة القراءة (صحيحة / جزئية / عالقة)</text>
  <rect x="320" y="124" width="280" height="28" class="cool"/>
  <text x="460" y="144" text-anchor="middle" class="step">حدد المفهوم التالي (المشي الرسم البياني)</text>
  <rect x="320" y="158" width="280" height="28" class="cool"/>
  <text x="460" y="178" text-anchor="middle" class="step">سقالة / تلميح / احتفال</text>

  <rect x="660" y="50" width="260" height="160" class="cold"/>
  <text x="790" y="72" text-anchor="middle" class="head">نموذج المتعلم</text>
  <text x="790" y="94" text-anchor="middle" class="small">تتبع المعرفة بايزي</text>
  <text x="790" y="112" text-anchor="middle" class="small">إتقان لكل مفهوم</text>
  <text x="790" y="130" text-anchor="middle" class="small">التكرار المتباعد (FSRS)</text>
  <text x="790" y="148" text-anchor="middle" class="small">التحديث بعد كل تفاعل</text>
  <text x="790" y="166" text-anchor="middle" class="small">تقرير التقدم الأسبوعي</text>
  <text x="790" y="186" text-anchor="middle" class="small">لوحة القيادة الأبوية</text>

  <rect x="40" y="240" width="420" height="270" class="box"/>
  <text x="250" y="262" text-anchor="middle" class="head">الرسم البياني للمناهج</text>
  <text x="250" y="282" text-anchor="middle" class="small">Neo4j من 50-150 مفاهيم</text>
  <text x="250" y="300" text-anchor="middle" class="small">حواف شرط مسبق</text>
  <text x="250" y="318" text-anchor="middle" class="small">OER المحتوى مرفق</text>
  <rect x="60" y="336" width="380" height="40" class="cool"/>
  <text x="250" y="356" text-anchor="middle" class="step">الجبر K-12 OR مقدمة بايثون</text>
  <text x="250" y="370" text-anchor="middle" class="small">اختر واحدًا للعمق</text>
  <text x="250" y="396" text-anchor="middle" class="small">خوارزمية المشي:</text>
  <text x="250" y="414" text-anchor="middle" class="small">  اختر مفهوم الإتقان الأدنى</text>
  <text x="250" y="432" text-anchor="middle" class="small">  الذي يتم إتقان متطلباته</text>
  <text x="250" y="454" text-anchor="middle" class="small">OER المصادر:</text>
  <text x="250" y="472" text-anchor="middle" class="small">أوبنستاكس، فتح الكتاب المدرسي،</text>
  <text x="250" y="490" text-anchor="middle" class="small">أكاديمية خان لايت</text>

  <rect x="500" y="240" width="420" height="270" class="box"/>
  <text x="710" y="262" text-anchor="middle" class="head">السلامة + الذاكرة</text>
  <rect x="520" y="280" width="380" height="30" class="hot"/>
  <text x="710" y="300" text-anchor="middle" class="step">حارس اللاما 4 + مرشح العمر</text>
  <rect x="520" y="316" width="380" height="30" class="hot"/>
  <text x="710" y="336" text-anchor="middle" class="step">COPPA-الاحتفاظ الواعي (سنة واحدة)</text>
  <rect x="520" y="352" width="380" height="30" class="dsk"/>
  <text x="710" y="372" text-anchor="middle" class="step">الذاكرة: عرضية + دلالية</text>
  <text x="710" y="396" text-anchor="middle" class="small">حذف يمكن الوصول إليه من قبل الوالدين</text>
  <text x="710" y="414" text-anchor="middle" class="small">العزلة على نطاق المتعلم</text>

  <text x="710" y="442" text-anchor="middle" class="small">دراسة الفعالية (أسبوعين، 10 متعلمين):</text>
  <text x="710" y="460" text-anchor="middle" class="small">الاختبار القبلي + 6 جلسات + الاختبار البعدي</text>
  <text x="710" y="478" text-anchor="middle" class="small">الفوج التكيفي مقابل خط الأساس الخطي</text>
  <text x="710" y="498" text-anchor="middle" class="caption">شكل خانميجو / دوولينجو ماكس / ليرن إل إم</text>
</svg>