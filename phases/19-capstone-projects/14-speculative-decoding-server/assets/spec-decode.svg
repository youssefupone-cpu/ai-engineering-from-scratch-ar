<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">فك التشفير التخميني - تقترح المسودة، ويتحقق الهدف</text>

  <rect x="40" y="60" width="300" height="260" class="box"/>
  <text x="190" y="82" text-anchor="middle" class="head">نموذج مسودة (رخيص)</text>
  <rect x="60" y="100" width="260" height="36" class="cool"/>
  <text x="190" y="122" text-anchor="middle" class="step">EAGLE-3 رأس</text>
  <rect x="60" y="142" width="260" height="36" class="cool"/>
  <text x="190" y="164" text-anchor="middle" class="step">P-EAGLE شجرة متوازية</text>
  <rect x="60" y="184" width="260" height="36" class="cool"/>
  <text x="190" y="206" text-anchor="middle" class="step">ngram الاحتياطية</text>
  <text x="190" y="244" text-anchor="middle" class="small">يقترح رموز k لكل خطوة</text>
  <text x="190" y="262" text-anchor="middle" class="small">تم تدريبهم على الحالات المخفية المستهدفة</text>
  <text x="190" y="280" text-anchor="middle" class="small">عبر SpecForge / المضاربين</text>
  <text x="190" y="300" text-anchor="middle" class="caption">المحاذاة = مقبض القبول</text>

  <rect x="380" y="60" width="540" height="260" class="box"/>
  <text x="650" y="82" text-anchor="middle" class="head">النموذج المستهدف (باهظ الثمن)</text>
  <rect x="400" y="100" width="260" height="44" class="dsk"/>
  <text x="530" y="120" text-anchor="middle" class="step">دفعة التحقق من المرور</text>
  <text x="530" y="138" text-anchor="middle" class="small">واحد للأمام من خلال مواقع k</text>
  <rect x="680" y="100" width="220" height="44" class="dsk"/>
  <text x="790" y="120" text-anchor="middle" class="step">قبول البادئة</text>
  <text x="790" y="138" text-anchor="middle" class="small">حتى الرفض الأول</text>
  <rect x="400" y="152" width="500" height="44" class="hot"/>
  <text x="650" y="172" text-anchor="middle" class="step">إعادة تشكيل الموقف المرفوض من الهدف</text>
  <text x="650" y="190" text-anchor="middle" class="small">تم قبول الالتزام + 1 جديد -&gt; الدفق</text>

  <rect x="400" y="208" width="500" height="100" class="cool"/>
  <text x="650" y="228" text-anchor="middle" class="step">الكمي الهدف</text>
  <text x="650" y="248" text-anchor="middle" class="small">FP8 مارلين أو INT4 AWQ</text>
  <text x="650" y="266" text-anchor="middle" class="small">اللاما 3.3 70B، Qwen3-Coder-30B MoE، GPT-OSS-120B</text>
  <text x="650" y="284" text-anchor="middle" class="small">نسخة متماثلة واحدة لكل H100/H200 قطعة</text>
  <text x="650" y="300" text-anchor="middle" class="caption">vLLM 0.7 / SGLang 0.4</text>

  <rect x="40" y="340" width="440" height="170" class="box"/>
  <text x="260" y="362" text-anchor="middle" class="head">المقاييس التي يجب الإبلاغ عنها</text>
  <text x="60" y="384" class="small">الإنتاجية bs=1 / bs=8 / bs=32 مع + بدون مواصفات</text>
  <text x="60" y="402" class="small">زمن الوصول p50، p99 عند كل حجم دفعة</text>
  <text x="60" y="420" class="small">معدل القبول لكل توزيع:</text>
  <text x="60" y="438" class="small">  ShareGPT، HumanEval، بيانات المجال</text>
  <text x="60" y="456" class="small">تنبيه الانجراف لمحاذاة المسودة/الهدف</text>
  <text x="60" y="476" class="small">$ لكل مليون رمز إخراج مستدام</text>
  <text x="60" y="498" class="small">المقارنة مقابل الأنثروبي / OpenAI API على نفس التقييم</text>

  <rect x="500" y="340" width="420" height="170" class="box"/>
  <text x="710" y="362" text-anchor="middle" class="head">operations</text>
  <text x="520" y="384" class="small">نشر Kubernetes</text>
  <text x="520" y="402" class="small">NVIDIA البرنامج الإضافي للجهاز</text>
  <text x="520" y="420" class="small">مقياس HPA: queue_wait_ms (وليس CPU)</text>
  <text x="520" y="438" class="small">الترقية المتداولة: قائمة انتظار التصريف أولاً</text>
  <text x="520" y="456" class="small">ngram الاحتياطي إذا انخفض قبول EAGLE</text>
  <text x="520" y="476" class="small">مصدر بروميثيوس + تتبع لانجفيوز</text>
  <text x="520" y="498" class="small">الهدف: إنتاجية 2.5x+ بجودة مطابقة</text>
</svg>