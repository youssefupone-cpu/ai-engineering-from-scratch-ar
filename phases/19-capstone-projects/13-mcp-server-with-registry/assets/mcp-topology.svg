<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">MCP 2026 — StreamableHTTP + النطاقات + OPA + التسجيل</text>

  <rect x="40" y="50" width="260" height="80" class="cool"/>
  <text x="170" y="72" text-anchor="middle" class="head">MCP العملاء</text>
  <text x="170" y="94" text-anchor="middle" class="small">كلود كود، المؤشر 3، أمبير،</text>
  <text x="170" y="112" text-anchor="middle" class="small">الكود المفتوح، الجوزاء CLI</text>

  <rect x="340" y="50" width="260" height="80" class="dsk"/>
  <text x="470" y="72" text-anchor="middle" class="head">StreamableHTTP</text>
  <text x="470" y="94" text-anchor="middle" class="small">JSON-RPC + البث المباشر</text>
  <text x="470" y="112" text-anchor="middle" class="small">عديمي الجنسية، قابلة للتطوير أفقيا</text>

  <rect x="640" y="50" width="280" height="80" class="cold"/>
  <text x="780" y="72" text-anchor="middle" class="head">نطاقات OAuth 2.1</text>
  <text x="780" y="94" text-anchor="middle" class="small">SPIFFE هوية عبء العمل</text>
  <text x="780" y="112" text-anchor="middle" class="small">تطبيق نطاق كل أداة</text>

  <rect x="40" y="160" width="560" height="200" class="box"/>
  <text x="320" y="182" text-anchor="middle" class="head">خادم MCP للقراءة فقط (FastMCP)</text>
  <rect x="60" y="200" width="170" height="40" class="cool"/>
  <text x="145" y="220" text-anchor="middle" class="step">postgres.readonly</text>
  <text x="145" y="234" text-anchor="middle" class="small">النطاق: postgres: الاستعلام: للقراءة فقط</text>
  <rect x="240" y="200" width="170" height="40" class="cool"/>
  <text x="325" y="220" text-anchor="middle" class="step">s3.list</text>
  <text x="325" y="234" text-anchor="middle" class="small">النطاق: s3: القائمة</text>
  <rect x="420" y="200" width="170" height="40" class="cool"/>
  <text x="505" y="220" text-anchor="middle" class="step">jira.search</text>
  <text x="505" y="234" text-anchor="middle" class="small">النطاق: جيرا: قراءة</text>

  <rect x="60" y="252" width="530" height="40" class="cool"/>
  <text x="325" y="272" text-anchor="middle" class="step">خطي / datadog / pagerduty / github / notion / slack / salesforce</text>
  <text x="325" y="286" text-anchor="middle" class="small">إجمالي 10 أدوات داخلية</text>

  <rect x="60" y="304" width="530" height="44" class="dsk"/>
  <text x="325" y="326" text-anchor="middle" class="step">OPA قرار السياسة (لكل مكالمة)</text>
  <text x="325" y="342" text-anchor="middle" class="small">Rego: النطاقات المسموح بها + PII تنقيح + الحدود القصوى للحمولة</text>

  <rect x="640" y="160" width="280" height="200" class="box"/>
  <text x="780" y="182" text-anchor="middle" class="head">خادم MCP المدمر</text>
  <rect x="660" y="200" width="240" height="44" class="hot"/>
  <text x="780" y="220" text-anchor="middle" class="step">jira.create / الخطي.إنشاء</text>
  <text x="780" y="234" text-anchor="middle" class="small">النطاق: +موافق عليه:من قبل:الإنسان</text>
  <rect x="660" y="254" width="240" height="44" class="hot"/>
  <text x="780" y="274" text-anchor="middle" class="step">postgres.write</text>
  <text x="780" y="288" text-anchor="middle" class="small">مطلوب موافقة سلاك جديدة</text>

  <rect x="660" y="310" width="240" height="40" class="dsk"/>
  <text x="780" y="330" text-anchor="middle" class="step">بطاقة الموافقة الركود</text>
  <text x="780" y="344" text-anchor="middle" class="small">يرفع النطاق لمدة 15 دقيقة</text>

  <rect x="40" y="380" width="420" height="130" class="box"/>
  <text x="250" y="402" text-anchor="middle" class="head">خدمة التسجيل</text>
  <text x="250" y="422" text-anchor="middle" class="small">استطلاعات الرأي.well-known/mcp-القدرات</text>
  <text x="250" y="440" text-anchor="middle" class="small">التحقق من صحة مخطط JSON</text>
  <text x="250" y="458" text-anchor="middle" class="small">UI: القائمة / البحث / التحقق من الصحة / التمكين</text>
  <text x="250" y="476" text-anchor="middle" class="small">ملكية الفريق + SLO لكل خادم</text>
  <text x="250" y="498" text-anchor="middle" class="caption">AAIF مواصفات التسجيل</text>

  <rect x="500" y="380" width="420" height="130" class="box"/>
  <text x="710" y="402" text-anchor="middle" class="head">التدقيق + التحميل</text>
  <text x="710" y="422" text-anchor="middle" class="small">سجل التدقيق لكل مستأجر JSONL</text>
  <text x="710" y="440" text-anchor="middle" class="small">Presidio PII تنقيح قبل الكتابة</text>
  <text x="710" y="458" text-anchor="middle" class="small">اختبار التحميل: 100 عميل متزامن</text>
  <text x="710" y="476" text-anchor="middle" class="small">مقياس أفقي عبر LB</text>
  <text x="710" y="498" text-anchor="middle" class="caption">MCP اختبارات المطابقة باللون الأخضر</text>
</svg>