<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">مستوى إمكانية المراقبة LLM المستضاف ذاتيًا — OTel GenAI semconv</text>

  <rect x="40" y="50" width="260" height="160" class="cool"/>
  <text x="170" y="72" text-anchor="middle" class="head">التطبيقات المجهزة</text>
  <text x="170" y="94" text-anchor="middle" class="small">OpenAI SDK إنساني SDK</text>
  <text x="170" y="112" text-anchor="middle" class="small">جوجل جيناي لانج تشين</text>
  <text x="170" y="130" text-anchor="middle" class="small">مؤشر اللاما vLLM</text>
  <text x="170" y="152" text-anchor="middle" class="small">افتحLLMوجرب الأداة التلقائية</text>
  <text x="170" y="170" text-anchor="middle" class="small">OTLP HTTP -&gt; جامع</text>
  <text x="170" y="192" text-anchor="middle" class="caption">تمت تغطية ست عائلات SDK</text>

  <rect x="340" y="50" width="260" height="160" class="dsk"/>
  <text x="470" y="72" text-anchor="middle" class="head">collector</text>
  <text x="470" y="94" text-anchor="middle" class="small">OTLP HTTP المتلقي</text>
  <text x="470" y="112" text-anchor="middle" class="small">معالج أخذ العينات الذيل</text>
  <text x="470" y="130" text-anchor="middle" class="small">الاحتفاظ بجميع الأخطاء</text>
  <text x="470" y="148" text-anchor="middle" class="small">احتفظ بالسمية / PII المسامير</text>
  <text x="470" y="166" text-anchor="middle" class="small">10% عينة نجاح طبقية</text>
  <text x="470" y="184" text-anchor="middle" class="small">المصدر: ClickHouse + S3</text>

  <rect x="640" y="50" width="280" height="160" class="cold"/>
  <text x="780" y="72" text-anchor="middle" class="head">storage</text>
  <text x="780" y="94" text-anchor="middle" class="small">ClickHouse: يمتد (عمودي)</text>
  <text x="780" y="112" text-anchor="middle" class="small">Postgres: البيانات الوصفية</text>
  <text x="780" y="130" text-anchor="middle" class="small">S3: أرشيف الأحداث الأولية</text>
  <text x="780" y="148" text-anchor="middle" class="small">يعكس المخطط GenAI semconv</text>
  <text x="780" y="166" text-anchor="middle" class="small">gen_ai.system، request.model</text>
  <text x="780" y="184" text-anchor="middle" class="small">use.input_tokens،output_tokens</text>

  <rect x="40" y="240" width="400" height="270" class="box"/>
  <text x="240" y="262" text-anchor="middle" class="head">التقييمات + الانجراف (يمتد الطفل)</text>
  <rect x="60" y="280" width="360" height="40" class="cool"/>
  <text x="240" y="304" text-anchor="middle" class="step">DeepEval / RAGAS المهام المجدولة</text>
  <rect x="60" y="326" width="360" height="40" class="cool"/>
  <text x="240" y="350" text-anchor="middle" class="step">مخصص LLM-القضاة (PII، خارج السياسة)</text>
  <rect x="60" y="372" width="360" height="40" class="hot"/>
  <text x="240" y="396" text-anchor="middle" class="step">كاشف الانجراف (أسبوعي PSI / KL)</text>
  <text x="240" y="436" text-anchor="middle" class="small">تصبح مخرجات التقييم امتدادات فرعية مرتبطة</text>
  <text x="240" y="454" text-anchor="middle" class="small">المخزنة في نفس ClickHouse، والانضمام من قبل الوالدين</text>
  <text x="240" y="472" text-anchor="middle" class="small">يحتفظ جهاز أخذ العينات الخلفي بجميع الآثار ذات درجات التقييم العالية</text>
  <text x="240" y="494" text-anchor="middle" class="caption">MTTR على هدف الانحدار المحقون: &lt;5 دقائق</text>

  <rect x="480" y="240" width="440" height="270" class="box"/>
  <text x="700" y="262" text-anchor="middle" class="head">التنبيه + UI</text>
  <rect x="500" y="280" width="400" height="40" class="hot"/>
  <text x="700" y="304" text-anchor="middle" class="step">بروميثيوس مدير التنبيه</text>
  <rect x="500" y="326" width="400" height="40" class="dsk"/>
  <text x="700" y="350" text-anchor="middle" class="step">Slack (تحذير) + PagerDuty (حرج)</text>
  <rect x="500" y="372" width="400" height="40" class="cool"/>
  <text x="700" y="396" text-anchor="middle" class="step">Next.js 15 + لوحة معلومات إعادة التخطيط</text>

  <text x="700" y="436" text-anchor="middle" class="small">الصفحات: نظرة عامة / آثار / تقييمات / انجراف</text>
  <text x="700" y="454" text-anchor="middle" class="small">التكلفة لكل مستخدم، الشلال الممتد، اتجاهات التقييم</text>
  <text x="700" y="472" text-anchor="middle" class="small">لانغفيوز / فينيكس / شكل OpenLLMetry</text>
  <text x="700" y="494" text-anchor="middle" class="caption">مرجع مفتوح النواة مستضاف ذاتيًا</text>
</svg>