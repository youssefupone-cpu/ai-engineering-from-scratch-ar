<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cold { fill: #eaf4ff; stroke: #2c5f8c; stroke-width: 1.5; }
      .mask { fill: #2c3e50; stroke: #1a1a1a; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">inpainting vs outpainting vs SDEdit</text>

  <!-- inpainting panel -->
  <text x="165" y="70" text-anchor="middle" class="label">inpainting</text>
  <rect x="40" y="80" width="250" height="130" class="box"/>
  <rect x="55" y="95" width="220" height="100" class="cold"/>
  <rect x="120" y="120" width="80" height="50" class="mask"/>
  <text x="160" y="230" text-anchor="middle" class="caption">قناع في الداخل، دبوس في الخارج</text>
  <text x="160" y="248" text-anchor="middle" class="caption">9 قنوات يو نت:</text>
  <text x="160" y="264" text-anchor="middle" class="mono">صاخبة | encoded_src | قناع</text>

  <!-- outpainting -->
  <text x="450" y="70" text-anchor="middle" class="label">outpainting</text>
  <rect x="310" y="80" width="260" height="130" class="box"/>
  <rect x="410" y="110" width="70" height="70" class="cold"/>
  <rect x="325" y="95" width="85" height="100" class="mask"/>
  <rect x="480" y="95" width="85" height="100" class="mask"/>
  <text x="450" y="230" text-anchor="middle" class="caption">عكس القناع</text>
  <text x="450" y="248" text-anchor="middle" class="caption">تمتد إلى ما هو أبعد من القماش</text>
  <text x="450" y="264" text-anchor="middle" class="caption">نفس النموذج، نفس الخسارة</text>

  <!-- SDEdit -->
  <text x="720" y="70" text-anchor="middle" class="label">SDEdit (لا يوجد إعادة تدريب)</text>
  <rect x="590" y="80" width="270" height="130" class="box"/>
  <text x="725" y="110" text-anchor="middle" class="mono">x_0 -&gt; إضافة ضوضاء إلى t -&gt; تقليل الضوضاء</text>
  <text x="725" y="135" text-anchor="middle" class="caption">t/T = 0.3 → تعديلات طفيفة</text>
  <text x="725" y="153" text-anchor="middle" class="caption">t/T = 0.6 → تعديلات معتدلة</text>
  <text x="725" y="171" text-anchor="middle" class="caption">t/T = 0.9 → شبه عشوائي</text>
  <text x="725" y="195" text-anchor="middle" class="caption">لا يوجد قناع، فقط شريط تمرير مستوى الضوضاء</text>

  <!-- pipeline flow -->
  <rect x="40" y="310" width="820" height="100" class="hot"/>
  <text x="450" y="335" text-anchor="middle" class="label">inpainting حلقة الاستدلال</text>
  <text x="450" y="358" text-anchor="middle" class="mono">لـ t = T.. 1: x_t[masked] = denoise; x_t[unmasked] = الضوضاء(clean_source, t)</text>
  <text x="450" y="380" text-anchor="middle" class="caption">استبدل المنطقة غير المقنعة بصورة نظيفة جديدة منتشرة للأمام في كل خطوة</text>
  <text x="450" y="398" text-anchor="middle" class="caption">الخطوة الأخيرة: تثبيت وحدات البكسل غير المقنعة على المصدر النظيف تمامًا</text>

  <!-- tools -->
  <rect x="40" y="425" width="820" height="60" class="box"/>
  <text x="450" y="448" text-anchor="middle" class="label">مكدس التحرير 2026</text>
  <text x="450" y="470" text-anchor="middle" class="caption">SAM 2 قناع → SD-Inpaint / Flux-Fill / GPT-تحرير الصورة → Flux-Kontext لتحرير التعليمات</text>
</svg>