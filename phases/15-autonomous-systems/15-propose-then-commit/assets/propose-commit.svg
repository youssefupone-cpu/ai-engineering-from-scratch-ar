<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">اقتراح → السطح → الالتزام → التحقق (الأربعة مطلوبة)</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Phases -->
  <rect x="60" y="80" width="170" height="90" class="cool"/>
  <text x="145" y="104" text-anchor="middle" class="label">1. اقتراح</text>
  <text x="76" y="126" class="small">نية + نسب +</text>
  <text x="76" y="142" class="small">الأذونات + الانفجار +</text>
  <text x="76" y="158" class="small">التراجع + العجز</text>

  <rect x="250" y="80" width="170" height="90" class="cold"/>
  <text x="335" y="104" text-anchor="middle" class="label">2. السطح</text>
  <text x="266" y="126" class="small">متجر دائم</text>
  <text x="266" y="142" class="small">(بوستغري إس كيو إل، ريديس،</text>
  <text x="266" y="158" class="small">كائن دائم)</text>

  <rect x="440" y="80" width="170" height="90" class="cool"/>
  <text x="525" y="104" text-anchor="middle" class="label">3. الالتزام</text>
  <text x="456" y="126" class="small">challenge-and-response</text>
  <text x="456" y="142" class="small">قائمة مرجعية، قبول إيجابي</text>
  <text x="456" y="158" class="small">إعادة تنفيذي عاجز</text>

  <rect x="630" y="80" width="170" height="90" class="cool"/>
  <text x="715" y="104" text-anchor="middle" class="label">4. تحقق</text>
  <text x="646" y="126" class="small">إعادة قراءة الهدف</text>
  <text x="646" y="142" class="small">تأكيد الآثار الجانبية</text>
  <text x="646" y="158" class="small">تنبيه بشأن عدم التطابق</text>

  <path d="M230 125 L250 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420 125 L440 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M610 125 L630 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rubber stamp vs checklist -->
  <rect x="60" y="200" width="360" height="140" class="hot"/>
  <text x="240" y="224" text-anchor="middle" class="label">ختم مطاطي (فشل في التدقيق)</text>
  <text x="76" y="248" class="content">واحد "الموافقة؟" زر</text>
  <text x="76" y="264" class="content">لم تظهر أي بيانات وصفية منظمة</text>
  <text x="76" y="280" class="content">ينقر المراجع في أقل من 1 ثانية</text>
  <text x="76" y="296" class="content">الموافقات لا تتنبأ بأي شيء</text>
  <text x="76" y="320" class="small">EU AI القانون المادة 14 صريحة: الرقابة البشرية الفعالة</text>
  <text x="76" y="334" class="small">يستبعد أنماط الطوابع المطاطية.</text>

  <rect x="460" y="200" width="360" height="140" class="cool"/>
  <text x="640" y="224" text-anchor="middle" class="label">التحدي والرد (التمريرات)</text>
  <text x="476" y="248" class="content">[ ] أنا أفهم ما يمس هذا</text>
  <text x="476" y="264" class="content">[ ] لقد تحققت من نصف قطر الانفجار</text>
  <text x="476" y="280" class="content">[ ] لدي خطة التراجع</text>
  <text x="476" y="296" class="content">الموافقة ممكنة فقط عندما يتم تعيين كل ثلاثة</text>
  <text x="476" y="320" class="small">موثقة في مستندات الامتثال الإنسانية وMS؛</text>
  <text x="476" y="334" class="small">مطلوب بموجب EU AI قانون المادة 14 للأنظمة عالية المخاطر.</text>

  <!-- Idempotency detail -->
  <rect x="60" y="370" width="760" height="120" class="cold"/>
  <text x="440" y="394" text-anchor="middle" class="label">مفتاح الفاعلية = التجزئة (thread_id، الإجراء، الحمولة)</text>
  <text x="80" y="416" class="content">اقتراح(P) + اقتراح(P) -&gt; نفس السجل (بدون تكرار)</text>
  <text x="80" y="432" class="content">الالتزام(ك) + الالتزام(ك) -&gt; التنفيذ مرة واحدة، أما الالتزامات اللاحقة فهي عدم تنفيذ</text>
  <text x="80" y="448" class="content">إعادة المحاولة بعد فشل عابر: نمط الشريط/AWS غير الفعال، يُعاد استخدامه للحصول على موافقات الوكيل</text>
  <text x="80" y="468" class="content">ساعة الحائط الموجودة في المفتاح هي طابع زمني للتسجيل، وليست مفتاحًا للعجز</text>
  <text x="80" y="484" class="small">مقاطعة LangGraph() · MS RequestInfoEvent · Cloudflare waitForApproval() — نفس الشكل، بأسماء مختلفة</text>
</svg>