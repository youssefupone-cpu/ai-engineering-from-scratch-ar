<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">أربعة أساسيات لتحسين الذات المحدودة</text>

  <rect x="40" y="50" width="800" height="440" class="box"/>

  <!-- Proposed edit -->
  <rect x="80" y="80" width="140" height="60" class="cool"/>
  <text x="150" y="108" text-anchor="middle" class="label">التعديل المقترح</text>
  <text x="150" y="126" text-anchor="middle" class="small">من حلقة التحسين الذاتي</text>

  <!-- Four gate boxes -->
  <rect x="260" y="80" width="140" height="60" class="hot"/>
  <text x="330" y="102" text-anchor="middle" class="label">1. الثوابت</text>
  <text x="330" y="120" text-anchor="middle" class="small">تجزئات الوحدة النمطية,</text>
  <text x="330" y="134" text-anchor="middle" class="small">بيان الأداة</text>

  <rect x="420" y="80" width="140" height="60" class="cold"/>
  <text x="490" y="102" text-anchor="middle" class="label">2. مرساة المحاذاة</text>
  <text x="490" y="120" text-anchor="middle" class="small">تجزئة الدستور</text>
  <text x="490" y="134" text-anchor="middle" class="small">مثبت للقراءة فقط</text>

  <rect x="580" y="80" width="140" height="60" class="dsk"/>
  <text x="650" y="102" text-anchor="middle" class="label">3. متعددة الأهداف</text>
  <text x="650" y="120" text-anchor="middle" class="small">الأداء + السلامة +</text>
  <text x="650" y="134" text-anchor="middle" class="small">العدالة + المتانة</text>

  <rect x="740" y="80" width="90" height="60" class="cool"/>
  <text x="785" y="102" text-anchor="middle" class="label">4. الانحدار</text>
  <text x="785" y="120" text-anchor="middle" class="small">per-axis</text>
  <text x="785" y="134" text-anchor="middle" class="small">فحص التاريخ</text>

  <!-- Arrows left-to-right -->
  <path d="M220 110 L260 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 110 L420 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 110 L580 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 110 L740 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- What each catches -->
  <rect x="260" y="170" width="140" height="90" class="box"/>
  <text x="330" y="190" text-anchor="middle" class="label">catches</text>
  <text x="330" y="210" text-anchor="middle" class="small">أداة مهربة</text>
  <text x="330" y="225" text-anchor="middle" class="small">غير مصرح به API</text>
  <text x="330" y="240" text-anchor="middle" class="small">تعديلات المقيم</text>
  <text x="330" y="255" text-anchor="middle" class="small">(DGM دراسة حالة)</text>

  <rect x="420" y="170" width="140" height="90" class="box"/>
  <text x="490" y="190" text-anchor="middle" class="label">catches</text>
  <text x="490" y="210" text-anchor="middle" class="small">الانجراف الموضوعي</text>
  <text x="490" y="225" text-anchor="middle" class="small">reinterpretation</text>
  <text x="490" y="240" text-anchor="middle" class="small">constitutional</text>
  <text x="490" y="255" text-anchor="middle" class="small">تعديل النص</text>

  <rect x="580" y="170" width="140" height="90" class="box"/>
  <text x="650" y="190" text-anchor="middle" class="label">catches</text>
  <text x="650" y="210" text-anchor="middle" class="small">single-axis</text>
  <text x="650" y="225" text-anchor="middle" class="small">optimization</text>
  <text x="650" y="240" text-anchor="middle" class="small">انخفاض السلامة في حين</text>
  <text x="650" y="255" text-anchor="middle" class="small">يتسلق الأداء</text>

  <rect x="740" y="170" width="90" height="90" class="box"/>
  <text x="785" y="190" text-anchor="middle" class="label">catches</text>
  <text x="785" y="210" text-anchor="middle" class="small">silent</text>
  <text x="785" y="225" text-anchor="middle" class="small">capability</text>
  <text x="785" y="240" text-anchor="middle" class="small">الانخفاضات استيعابها</text>
  <text x="785" y="255" text-anchor="middle" class="small">في التحرك في المتوسط</text>

  <!-- Information-theoretic limit box -->
  <rect x="80" y="290" width="740" height="78" class="hot"/>
  <text x="100" y="312" class="label">السقف النظري للمعلومات</text>
  <text x="100" y="332" class="content">إن تعقيد كولموجوروف يحد مما يمكن لأي نظام أن يثبته عن خليفته.</text>
  <text x="100" y="350" class="content">نظرية لوب: يمكن للنظام أن يتصرف بناءً على "يجب" دون إثبات أنه ينبغي ذلك.</text>
  <text x="100" y="365" class="content">هذه هي التخفيفات، وليس أدلة على السلامة.</text>

  <!-- Accept/reject -->
  <rect x="80" y="388" width="360" height="80" class="cool"/>
  <text x="260" y="412" text-anchor="middle" class="label">قم بتحرير الأراضي فقط إذا مرت جميع البوابات الأربعة</text>
  <text x="260" y="432" text-anchor="middle" class="content">فشل أي بوابة -&gt; تم رفض التعديل</text>
  <text x="260" y="450" text-anchor="middle" class="small">بوابة الانحدار + المراجعة البشرية للرفض الحدي</text>

  <rect x="460" y="388" width="360" height="80" class="hot"/>
  <text x="640" y="412" text-anchor="middle" class="label">واقع الإنتاج (RSI ورشة عمل 2026)</text>
  <text x="640" y="432" text-anchor="middle" class="content">تقوم المعامل بتنفيذ مجموعات فرعية؛ المكدس الكامل نادر</text>
  <text x="640" y="450" text-anchor="middle" class="small">Meta HyperAgents، SAHOO (مارس 2026) = مراجع جزئية</text>
</svg>