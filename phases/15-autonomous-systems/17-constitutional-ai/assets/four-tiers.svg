<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">دستور كلود (يناير 2026، 79 صفحة، CC0): أرضية مضمنة + أربعة مستويات</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Hardcoded floor -->
  <rect x="60" y="80" width="760" height="86" class="hot"/>
  <text x="440" y="104" text-anchor="middle" class="label">المحظورات الثابتة (لا يمكن للمشغلين والمستخدمين تجاوزها)</text>
  <text x="80" y="126" class="content">الأسلحة البيولوجية / CBRN رفع · CSAM · التخطيط لهجوم على البنية التحتية الحيوية</text>
  <text x="80" y="142" class="content">الخداع حول هوية AI عند سؤالك مباشرةً · يُسمح بالإضافات الخاصة بالنشر</text>
  <text x="80" y="158" class="small">يتم فرضه على أوزان النموذج (CAI تدريب + RLAIF) وعند طبقة الاستدلال</text>

  <!-- Tier 1 -->
  <rect x="60" y="190" width="760" height="60" class="cool"/>
  <text x="80" y="212" class="label">المستوى 1 - السلامة ودعم الرقابة البشرية (الأعلى)</text>
  <text x="80" y="232" class="content">لا تتصرف بطرق make يصعب على البشر الإشراف عليها وتصحيحها AI</text>

  <!-- Tier 2 -->
  <rect x="60" y="260" width="760" height="60" class="cold"/>
  <text x="80" y="282" class="label">المستوى 2 - الأخلاق</text>
  <text x="80" y="302" class="content">الصدق · تجنب الإضرار بالأشخاص · عدم الخداع · عدم التلاعب</text>

  <!-- Tier 3 -->
  <rect x="60" y="330" width="760" height="60" class="warn"/>
  <text x="80" y="352" class="label">المستوى 3 - إرشادات إنسانية (يمكن للمشغل ضبطها ضمن الحدود المعلنة)</text>
  <text x="80" y="372" class="content">طول الاستجابة · النطاق الموضعي · الأسلوب · أنماط استخدام الأداة</text>

  <!-- Tier 4 -->
  <rect x="60" y="400" width="760" height="60" class="box"/>
  <text x="80" y="422" class="label">المستوى 4 – المساعدة (الأدنى)</text>
  <text x="80" y="442" class="content">تكون مفيدة قدر الإمكان ضمن المستويات الثلاثة العليا</text>

  <!-- Resolution note -->
  <rect x="60" y="466" width="760" height="36" class="box"/>
  <text x="440" y="490" text-anchor="middle" class="small">عندما تتعارض المستويات، يفوز الأعلى؛ عندما تكون المبادئ غامضة، الأسباب النموذجية (المحاذاة القائمة على السبب)</text>
</svg>