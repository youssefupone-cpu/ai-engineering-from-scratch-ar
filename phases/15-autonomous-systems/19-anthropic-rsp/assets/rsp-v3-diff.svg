<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">RSP الإصدار 2 (2023) → الإصدار 3.0 (24 فبراير 2026): ما الذي تغير</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Two columns: additions / removals -->
  <rect x="60" y="80" width="370" height="280" class="cool"/>
  <text x="245" y="104" text-anchor="middle" class="label">الإضافات في v3.0</text>
  <text x="76" y="126" class="content">• جدول التخفيف ذو المستويين</text>
  <text x="76" y="142" class="small">  (توصية إنسانية أحادية الجانب مقابل توصية الصناعة)</text>
  <text x="76" y="162" class="content">• AI عتبة البحث والتطوير-4 (أتمتة البحث)</text>
  <text x="76" y="178" class="small">  عبرت مرة واحدة: نشر حالة إيجابية</text>
  <text x="76" y="198" class="content">• خارطة طريق السلامة على الحدود (وثيقة دائمة)</text>
  <text x="76" y="214" class="content">• تقرير المخاطر (الوثيقة الدائمة، بأثر رجعي)</text>
  <text x="76" y="234" class="content">• RAND SL-4 مرجع أمني</text>
  <text x="76" y="250" class="small">  (في طبقة توصية الصناعة)</text>
  <text x="76" y="270" class="content">• الإقرار: "الاستبعاد بثقة</text>
  <text x="76" y="286" class="content">   AI أصبح البحث والتطوير-4 صعبًا"</text>
  <text x="76" y="318" class="small">يشير إعلان الإصدار 3.0 إلى أن العتبة تمثل مصدر قلق مباشر</text>
  <text x="76" y="334" class="small">حتى على الجيل الحالي كلود أوبوس 4.6</text>

  <rect x="450" y="80" width="370" height="280" class="hot"/>
  <text x="635" y="104" text-anchor="middle" class="label">عمليات الإزالة / التخفيفات في الإصدار 3.0</text>
  <text x="466" y="126" class="content">• التزام وقفة 2023 REMOVED</text>
  <text x="466" y="142" class="small">  (تم إسقاط جملة الإيقاف المؤقت للتدريب الصريح)</text>
  <text x="466" y="162" class="content">• تخفيف العتبات الكمية</text>
  <text x="466" y="178" class="small">  إلى الأحكام النوعية</text>
  <text x="466" y="198" class="content">• استبدال التخفيفات المحددة ب</text>
  <text x="466" y="214" class="content">  تأطير "الحالة الإيجابية".</text>
  <text x="466" y="234" class="content">• ظلت المراجعة المستقلة ضعيفة</text>
  <text x="466" y="250" class="small">  (المجموعة الاستشارية للسلامة الداخلية الأولية)</text>
  <text x="466" y="270" class="content">• يسمح مستوى توصية الصناعة</text>
  <text x="466" y="286" class="content">  تأطير الدعوة للسياسات دون التزام</text>

  <!-- SaferAI rating -->
  <rect x="60" y="380" width="760" height="110" class="warn"/>
  <text x="440" y="404" text-anchor="middle" class="label">تصنيف مستقل SaferAI</text>
  <text x="80" y="426" class="content">الإصدار 2 (2023): 2.2 - متوسط</text>
  <text x="80" y="442" class="content">الإصدار 3.0 (2026): 1.9 — ضعيف (ينضم إلى OpenAI Preparedness وDeepMind FSF في الفئة "الضعيفة")</text>
  <text x="80" y="462" class="content">دوافع التخفيض: عتبات نوعية · إزالة مؤقتة · رقابة مستقلة محدودة</text>
  <text x="80" y="482" class="small">وتصبح السياسة أقل صرامة بينما تبدو أكثر صقلاً؛ القراءة عن كثب هي المهارة.</text>
</svg>