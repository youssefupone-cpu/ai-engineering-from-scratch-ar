<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">الحقن الفوري غير المباشر: سطح الهجوم وطبقات الدفاع</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Untrusted content sources -->
  <rect x="60" y="80" width="200" height="120" class="hot"/>
  <text x="160" y="102" text-anchor="middle" class="label">محتوى خارج الثقة</text>
  <text x="76" y="128" class="small">• أي صفحة خارجية</text>
  <text x="76" y="144" class="small">• المشاركات التي أنشأها المستخدم</text>
  <text x="76" y="160" class="small">• مقتطفات من محرك البحث</text>
  <text x="76" y="176" class="small">• URL جزء / استعلام</text>
  <text x="76" y="192" class="small">• إدخالات الذاكرة السابقة</text>

  <!-- Agent -->
  <rect x="320" y="80" width="240" height="120" class="cool"/>
  <text x="440" y="102" text-anchor="middle" class="label">وكيل المتصفح</text>
  <text x="336" y="128" class="small">قراءة + السبب + حلقة الفعل</text>
  <text x="336" y="144" class="small">القائمة المسموح بها للأداة لكل مهمة</text>
  <text x="336" y="160" class="small">بيانات الاعتماد النطاق فقط</text>
  <text x="336" y="176" class="small">مساحة عمل معزولة عن الجلسة</text>
  <text x="336" y="192" class="small">السجلات المحفوظة للتدقيق</text>

  <!-- Consequential sinks -->
  <rect x="620" y="80" width="200" height="120" class="cold"/>
  <text x="720" y="102" text-anchor="middle" class="label">المصارف اللاحقة</text>
  <text x="636" y="128" class="small">• يقدم النموذج</text>
  <text x="636" y="144" class="small">• مكالمات أداة الواجهة الخلفية</text>
  <text x="636" y="160" class="small">• يكتب الذاكرة</text>
  <text x="636" y="176" class="small">• تنزيل الملفات</text>
  <text x="636" y="192" class="small">• استخدام بيانات الاعتماد</text>

  <path d="M260 140 L320 140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 140 L620 140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Defense layers -->
  <text x="60" y="230" class="label">طبقات الدفاع</text>

  <rect x="60" y="240" width="240" height="100" class="cool"/>
  <text x="180" y="262" text-anchor="middle" class="label">1. مطهر للمحتوى</text>
  <text x="76" y="284" class="small">تجريد الأنماط السيئة المعروفة</text>
  <text x="76" y="300" class="small">"تجاهل السابق"، "النشر إلى"</text>
  <text x="76" y="316" class="small">يمسك حقن النص المرئي</text>
  <text x="76" y="332" class="small">MISSES URL-حمولات مجزأة</text>

  <rect x="320" y="240" width="240" height="100" class="cold"/>
  <text x="440" y="262" text-anchor="middle" class="label">2. حدود R/W</text>
  <text x="336" y="284" class="small">يقرأ مجانا؛ يكتب تتطلب</text>
  <text x="336" y="300" class="small">موافقة جديدة متى</text>
  <text x="336" y="316" class="small">content_origin = خارج الثقة</text>
  <text x="336" y="332" class="small">يمسك حقن جزء أيضا</text>

  <rect x="580" y="240" width="240" height="100" class="hot"/>
  <text x="700" y="262" text-anchor="middle" class="label">3. القائمة المسموح بها للأدوات + HITL</text>
  <text x="596" y="284" class="small">القائمة المسموح بها للأداة لكل مهمة</text>
  <text x="596" y="300" class="small">HITL على عمليات الكتابة التي لا رجعة فيها</text>
  <text x="596" y="316" class="small">اقترح ثم التزم (L15)</text>
  <text x="596" y="332" class="small">رموز الكناري في الذاكرة (L14)</text>

  <!-- Attack corpus -->
  <rect x="60" y="360" width="760" height="130" class="hot"/>
  <text x="440" y="384" text-anchor="middle" class="label">هجمات 2025-2026 موثقة</text>
  <text x="80" y="406" class="content">الذكريات الملوثة (أطلس CSRF، 2025) — صفحة المهاجم تربط التعليمات بذاكرة العميل</text>
  <text x="80" y="422" class="content">HashJack (Cato Networks, 2026) — الحمولة مخفية في URL جزء/سلسلة استعلام</text>
  <text x="80" y="438" class="content">Perplexity Comet Hijacks (2026) - زر بنقرة واحدة يركب الحمولة النافعة</text>
  <text x="80" y="458" class="content">OpenAI رأس الاستعداد (2025): الحقن الفوري غير المباشر "ليس خطأ يمكن تصحيحه بالكامل"</text>
  <text x="80" y="478" class="small">الدفاع المتعمق: المطهر + حدود R/W + القائمة المسموح بها + HITL + جزر الكناري؛ أي طبقة واحدة غير كافية</text>
</svg>