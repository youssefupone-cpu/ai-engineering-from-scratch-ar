<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">ثلاثة كاشفات، ثلاث فئات الفشل</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Agent -->
  <rect x="330" y="80" width="220" height="80" class="cool"/>
  <text x="440" y="104" text-anchor="middle" class="label">agent</text>
  <text x="346" y="128" class="small">يقرأ، الأسباب، الأفعال</text>
  <text x="346" y="144" class="small">لا يمكن لمس أسلاك التعثر</text>

  <!-- Kill switch -->
  <rect x="60" y="200" width="220" height="120" class="hot"/>
  <text x="170" y="222" text-anchor="middle" class="label">قتل التبديل</text>
  <text x="76" y="244" class="small">منطقية خارجية</text>
  <text x="76" y="260" class="small">• ميزة العلم / Redis / CFG الموقعة</text>
  <text x="76" y="276" class="small">• فحص كل عمل، وليس التمهيد</text>
  <text x="76" y="292" class="small">• لا يمكن للوكيل تعيين OFF</text>
  <text x="76" y="308" class="small">• إعادة التمكين = الإنسان الصريح</text>

  <!-- Circuit breaker -->
  <rect x="330" y="200" width="220" height="120" class="warn"/>
  <text x="440" y="222" text-anchor="middle" class="label">قاطع الدائرة</text>
  <text x="346" y="244" class="small">وقفة نمطية محددة</text>
  <text x="346" y="260" class="small">• 5 استدعاءات أداة متطابقة</text>
  <text x="346" y="276" class="small">• N حالات الفشل المتتالية</text>
  <text x="346" y="292" class="small">• معدل أعلى من العتبة</text>
  <text x="346" y="308" class="small">• مغلق / مفتوح / نصف مفتوح</text>

  <!-- Canary -->
  <rect x="600" y="200" width="220" height="120" class="cold"/>
  <text x="710" y="222" text-anchor="middle" class="label">رمز الكناري</text>
  <text x="616" y="244" class="small">الطعم بدون استخدام legitimate</text>
  <text x="616" y="260" class="small">• AWS_SECRET_ACCESS_KEY وهمية</text>
  <text x="616" y="276" class="small">• وهمية DB سجل الحارس</text>
  <text x="616" y="292" class="small">• ملف مزيف في مساحة العمل</text>
  <text x="616" y="308" class="small">• إدخال ذاكرة وهمية</text>

  <path d="M390 160 L250 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 160 L440 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 160 L630 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Catches vs misses -->
  <rect x="60" y="350" width="760" height="76" class="cool"/>
  <text x="440" y="374" text-anchor="middle" class="label">ما يمسك كل منهما</text>
  <text x="80" y="394" class="content">القتل: قرار المشغل · الكسارة: أنماط متكررة / معدلة · الكناري: نية لمس مورد غير محدود</text>
  <text x="80" y="412" class="content">إعادة توجيه خروج Cilium/eBPF (أقل من 500 مللي ثانية) تكمل طيور الكناري: تنتقل الكبسولة المعزولة إلى مصيدة الطب الشرعي</text>

  <!-- What nothing catches -->
  <rect x="60" y="430" width="760" height="60" class="hot"/>
  <text x="440" y="454" text-anchor="middle" class="label">ما لا يمسك كاشف</text>
  <text x="80" y="474" class="content">المركبات الدلالية: الأفعال الفردية تمر بكل كاشف؛ التكوين هو الهجوم (أنظر الدرس 10)</text>
</svg>