<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">تعمل السقالات على تحريك النتيجة أكثر من النموذج الأساسي</text>

  <rect x="40" y="50" width="800" height="440" class="box"/>

  <!-- Base model -->
  <rect x="80" y="80" width="160" height="70" class="cool"/>
  <text x="160" y="104" text-anchor="middle" class="label">النموذج الأساسي</text>
  <text x="160" y="124" text-anchor="middle" class="small">كلود سونيت 4.5</text>
  <text x="160" y="140" text-anchor="middle" class="small">(الأوزان الثابتة)</text>

  <!-- Two scaffolds -->
  <rect x="290" y="80" width="160" height="70" class="hot"/>
  <text x="370" y="104" text-anchor="middle" class="label">SWE-الوكيل v1</text>
  <text x="370" y="124" text-anchor="middle" class="small">ACI مجموعة الأوامر</text>
  <text x="370" y="140" text-anchor="middle" class="small">JSON مكالمات الأداة</text>

  <rect x="500" y="80" width="160" height="70" class="cold"/>
  <text x="580" y="104" text-anchor="middle" class="label">كلاين مستقل</text>
  <text x="580" y="124" text-anchor="middle" class="small">VS الكود + السياسة</text>
  <text x="580" y="140" text-anchor="middle" class="small">حلقة التحقق</text>

  <rect x="700" y="80" width="140" height="70" class="box"/>
  <text x="770" y="104" text-anchor="middle" class="label">SWE-مقعد تم التحقق منه</text>
  <text x="770" y="124" text-anchor="middle" class="small">500 مهمة منسقة</text>
  <text x="770" y="140" text-anchor="middle" class="small">(نفس المهام)</text>

  <path d="M240 115 L290 115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240 115 Q265 200 290 115" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <path d="M450 115 L500 115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660 115 L700 115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Score delta -->
  <rect x="80" y="180" width="580" height="80" class="box"/>
  <text x="100" y="202" class="label">دلتا النتيجة</text>
  <text x="100" y="226" class="content">نفس الموديل: SWE-agent v1 43.2% | كلاين مستقل 59.8%</text>
  <text x="100" y="244" class="content">+16.6 نقطة مطلقة من السقالات وحدها. (الأيدي المفتوحة، العصر AI 2026)</text>

  <!-- CodeAct vs JSON -->
  <rect x="80" y="290" width="360" height="160" class="hot"/>
  <text x="260" y="312" text-anchor="middle" class="label">سقالة CodeAct (OpenHands)</text>
  <text x="100" y="334" class="content">+ قابل للتركيب: إجراء واحد يقوم بتحرير العديد من الملفات</text>
  <text x="100" y="350" class="content">+ يلتقط الاستثناءات داخل الإجراء</text>
  <text x="100" y="366" class="content">- نصف قطر انفجار أكبر لكل إجراء</text>
  <text x="100" y="382" class="content">- يتطلب وضع الحماية المقوى (Docker)</text>
  <text x="100" y="402" class="content">يُستخدم عندما: يكون العامل داخل حاوية معزولة</text>
  <text x="100" y="418" class="content">         والقابلية للتركيب تستحق تكلفة التدقيق</text>
  <text x="100" y="434" class="small">أرخايف:2407.16741 · MIT الترخيص · المنصة المفتوحة الأكثر نشاطًا</text>

  <rect x="460" y="290" width="360" height="160" class="cold"/>
  <text x="640" y="312" text-anchor="middle" class="label">JSON سقالة استدعاء الأداة</text>
  <text x="480" y="334" class="content">+ كل إجراء يمر عبر أداة التحقق من الصحة</text>
  <text x="480" y="350" class="content">+ سهولة التدقيق خطوة بخطوة</text>
  <text x="480" y="366" class="content">- عمل واحد في كل دورة؛ المزيد من المنعطفات لنفس المهمة</text>
  <text x="480" y="382" class="content">- التركيبية تعيش في المنسق</text>
  <text x="480" y="402" class="content">استخدم عندما: يتحكم الموفر في المنفذ</text>
  <text x="480" y="418" class="content">         (وكلاء كلود المُدارون، OpenAI مساعدون)</text>
  <text x="480" y="434" class="small">هي المهيمنة في الخدمات المدارة، حيث السلامة عن طريق البناء</text>
</svg>