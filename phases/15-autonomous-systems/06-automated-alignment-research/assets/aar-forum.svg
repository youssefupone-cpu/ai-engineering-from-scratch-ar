<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">أبحاث المحاذاة الآلية - صناديق رمل متوازية، منتدى واحد</text>

  <!-- Three AAR sandboxes -->
  <rect x="40" y="60" width="240" height="190" class="cool"/>
  <text x="160" y="82" text-anchor="middle" class="label">AAR- ​​صندوق رمل</text>
  <text x="160" y="104" text-anchor="middle" class="small">كلود أوبوس 4.6</text>
  <text x="160" y="122" text-anchor="middle" class="small">خس / حدود الشبكة / العملية</text>
  <text x="160" y="146" text-anchor="middle" class="content">المهمة: التقطير الضعيف إلى القوي</text>
  <text x="160" y="164" text-anchor="middle" class="content">يسمح بالتحلل الحر</text>
  <text x="160" y="190" text-anchor="middle" class="small">لا يوجد وصول للكتابة إلى متجر المنتدى</text>
  <text x="160" y="206" text-anchor="middle" class="small">لا يوجد وصول للقراءة إلى سجلات الأقران</text>
  <text x="160" y="222" text-anchor="middle" class="small">النشر في المنتدى بواسطة API فقط</text>

  <rect x="320" y="60" width="240" height="190" class="cool"/>
  <text x="440" y="82" text-anchor="middle" class="label">AAR-ب رمل</text>
  <text x="440" y="104" text-anchor="middle" class="small">كلود أوبوس 4.6</text>
  <text x="440" y="122" text-anchor="middle" class="small">خس / حدود الشبكة / العملية</text>
  <text x="440" y="146" text-anchor="middle" class="content">المهمة: RLHF اكتساح</text>
  <text x="440" y="164" text-anchor="middle" class="content">يسمح بالتحلل الحر</text>

  <rect x="600" y="60" width="240" height="190" class="cool"/>
  <text x="720" y="82" text-anchor="middle" class="label">AAR-C رمل</text>
  <text x="720" y="104" text-anchor="middle" class="small">كلود أوبوس 4.6</text>
  <text x="720" y="122" text-anchor="middle" class="small">خس / حدود الشبكة / العملية</text>
  <text x="720" y="146" text-anchor="middle" class="content">المهمة: كاشف تزوير المحاذاة</text>
  <text x="720" y="164" text-anchor="middle" class="content">يسمح بالتحلل الحر</text>

  <!-- Forum -->
  <rect x="160" y="290" width="560" height="90" class="cold"/>
  <text x="440" y="314" text-anchor="middle" class="label">منتدى البحوث المشتركة</text>
  <text x="440" y="334" text-anchor="middle" class="content">سجل إلحاقي فقط، واضح التلاعب</text>
  <text x="440" y="350" text-anchor="middle" class="content">التخزين خارج كل رمل</text>
  <text x="440" y="366" text-anchor="middle" class="small">سجل n -&gt; H(سجل n-1) — اكتشاف الكسر عند أي تحرير</text>

  <!-- Arrows -->
  <path d="M160 250 L280 290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 250 L440 290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 250 L600 290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="270" y="278" class="small">آخر فقط</text>

  <!-- Human review -->
  <rect x="160" y="410" width="560" height="90" class="hot"/>
  <text x="440" y="434" text-anchor="middle" class="label">مراجعة البحوث البشرية</text>
  <text x="440" y="454" text-anchor="middle" class="content">يقرأ المنتدى، وينظم، ويقرر ما ينشر</text>
  <text x="440" y="470" text-anchor="middle" class="content">عمليات فحص متقاطعة ضد النسخ الاحتياطي خارج نطاق الحماية</text>
  <text x="440" y="486" text-anchor="middle" class="small">AARs تضغط منتصف الخط pip. البشر لديهم نهايات.</text>

  <path d="M440 380 L440 410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>