<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">ثلاث سياسات للقياس، ونفس القدرة، وثلاثة تصنيفات</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Column headers -->
  <rect x="60" y="80" width="250" height="36" class="cool"/>
  <text x="185" y="104" text-anchor="middle" class="label">OpenAI PF الإصدار الثاني (أبريل 2025)</text>

  <rect x="320" y="80" width="240" height="36" class="cold"/>
  <text x="440" y="104" text-anchor="middle" class="label">إنساني RSP الإصدار 3.0 (فبراير 2026)</text>

  <rect x="570" y="80" width="250" height="36" class="warn"/>
  <text x="695" y="104" text-anchor="middle" class="label">DeepMind FSF الإصدار الثالث (سبتمبر 2025 + أبريل 2026)</text>

  <!-- Long-range Autonomy row -->
  <rect x="60" y="130" width="760" height="46" class="box"/>
  <text x="76" y="152" class="label">الحكم الذاتي طويل المدى</text>
  <text x="76" y="170" class="content">OpenAI: البحث (وليس التحفيز) · أنثروبي: مسمى؛ حالة إيجابية عند العتبة · DeepMind: مطوية في ML البحث والتطوير / الإنترنت</text>

  <!-- Undermining safeguards -->
  <rect x="60" y="184" width="760" height="46" class="box"/>
  <text x="76" y="206" class="label">تقويض الضمانات</text>
  <text x="76" y="224" class="content">OpenAI: البحث · الأنثروبي: الحظر المضمن (الرفض) · DeepMind: مراقبة الانحياز الخادع</text>

  <!-- R&D automation -->
  <rect x="60" y="238" width="760" height="46" class="box"/>
  <text x="76" y="260" class="label">أتمتة البحث والتطوير</text>
  <text x="76" y="278" class="content">OpenAI: متتبع · إنساني: AI عتبة البحث والتطوير-4 (حالة إيجابية) · DeepMind: ML مستوى استقلالية البحث والتطوير 1 (TCL، أبريل 2026)</text>

  <!-- Sandbagging -->
  <rect x="60" y="292" width="760" height="46" class="box"/>
  <text x="76" y="314" class="label">sandbagging</text>
  <text x="76" y="332" class="content">OpenAI: البحث · الأنثروبي: يتم تناوله عبر فجوة سياق التقييم · DeepMind: مراقبة المحاذاة الخادعة (الاستدلال الذرائعي)</text>

  <!-- Cyber uplift -->
  <rect x="60" y="346" width="760" height="46" class="box"/>
  <text x="76" y="368" class="label">رفع السيبرانية</text>
  <text x="76" y="386" class="content">OpenAI: متعقب · إنساني: ASL-3 المشغل (الأمن + النشر) · DeepMind: Cyber ​​CCL</text>

  <!-- Convergence note -->
  <rect x="60" y="400" width="760" height="90" class="hot"/>
  <text x="440" y="424" text-anchor="middle" class="label">التقارب + التباعد</text>
  <text x="80" y="446" class="content">تتقارب: داخلي SAG، محاذاة خادعة كفئة خطر محددة، قطع أثرية ثابتة</text>
  <text x="80" y="462" class="content">يتباعد: تقسيم المتتبع مقابل البحث فقط في PF الإصدار الثاني؛ تطوي DeepMind الاستقلالية؛ تمت إزالة جملة الإيقاف المؤقت</text>
  <text x="80" y="478" class="content">تبعية القياس: تعمل الأطر الثلاثة جميعها فقط إذا كان قياس القدرة غير قابل للتلاعب</text>
</svg>