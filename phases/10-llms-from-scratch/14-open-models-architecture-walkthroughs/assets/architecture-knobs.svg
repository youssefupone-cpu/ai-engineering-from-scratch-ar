<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">ستة مقابض: GPT-2 → الحدود المفتوحة</text>

  <!-- Six rows, two columns: "was" (left) vs "now" (right) -->
  <!-- Row 1: Norm -->
  <text x="30" y="72" class="head">1 / القاعدة</text>
  <rect x="130" y="55" width="330" height="36" class="old"/>
  <text x="295" y="78" text-anchor="middle" class="step">LayerNorm - المتوسط ​​+ المعياري + المقياس + التحيز</text>
  <line x1="465" y1="73" x2="495" y2="73" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="55" width="330" height="36" class="cool"/>
  <text x="665" y="78" text-anchor="middle" class="step">RMSNorm - مقياس + قياسي</text>

  <!-- Row 2: Position -->
  <text x="30" y="122" class="head">2/ المنصب</text>
  <rect x="130" y="105" width="330" height="36" class="old"/>
  <text x="295" y="128" text-anchor="middle" class="step">تعلمت تضمين الجدول</text>
  <line x1="465" y1="123" x2="495" y2="123" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="105" width="330" height="36" class="cool"/>
  <text x="665" y="128" text-anchor="middle" class="step">حبل (+ غزل / NTK للتمدد)</text>

  <!-- Row 3: Activation -->
  <text x="30" y="172" class="head">3/ التنشيط</text>
  <rect x="130" y="155" width="330" height="36" class="old"/>
  <text x="295" y="178" text-anchor="middle" class="step">GELU — إسقاط واحد</text>
  <line x1="465" y1="173" x2="495" y2="173" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="155" width="330" height="36" class="cool"/>
  <text x="665" y="178" text-anchor="middle" class="step">SwiGLU — بوابة · حفيف (بوابة) · أعلى</text>

  <!-- Row 4: Attention -->
  <text x="30" y="222" class="head">4/الانتباه</text>
  <rect x="130" y="205" width="330" height="36" class="old"/>
  <text x="295" y="228" text-anchor="middle" class="step">MHA — واحد K,V لكل رأس</text>
  <line x1="465" y1="223" x2="495" y2="223" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="205" width="330" height="36" class="cool"/>
  <text x="665" y="228" text-anchor="middle" class="step">GQA → MQA → MLA (تقليص KV ذاكرة التخزين المؤقت)</text>

  <!-- Row 5: MLP density -->
  <text x="30" y="272" class="head">5 / MLP</text>
  <rect x="130" y="255" width="330" height="36" class="old"/>
  <text x="295" y="278" text-anchor="middle" class="step">كثيفة - كل معلمة لكل رمز</text>
  <line x1="465" y1="273" x2="495" y2="273" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="255" width="330" height="36" class="cool"/>
  <text x="665" y="278" text-anchor="middle" class="step">MoE - أعلى عدد من الخبراء N لكل رمز مميز</text>

  <!-- Row 6: Norm placement -->
  <text x="30" y="322" class="head">6/ مكان عادي</text>
  <rect x="130" y="305" width="330" height="36" class="old"/>
  <text x="295" y="328" text-anchor="middle" class="step">ما بعد المعيار - من الصعب التدريب العميق</text>
  <line x1="465" y1="323" x2="495" y2="323" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="305" width="330" height="36" class="cool"/>
  <text x="665" y="328" text-anchor="middle" class="step">القاعدة المسبقة (يبقى في كل مكان)</text>

  <!-- Model comparison strip -->
  <rect x="30" y="360" width="900" height="140" class="box"/>
  <text x="480" y="383" text-anchor="middle" class="label">الفرق لكل نموذج مفتوح الحدود</text>

  <text x="50" y="410" class="step">GPT-2 صغير</text>
  <text x="200" y="410" class="small">LayerNorm · GELU · تعلمت · MHA · كثيفة · 1k ctx</text>

  <text x="50" y="432" class="step">اللاما 3 8ب</text>
  <text x="200" y="432" class="small">RMSNorm · SwiGLU · حبل · GQA 32/8 · كثيف · 128 كيلو</text>

  <text x="50" y="454" class="step">ميكسترال 8x7B</text>
  <text x="200" y="454" class="small">RMSNorm · SwiGLU · RoPE · GQA · MoE 8/top-2 · 32k</text>

  <text x="50" y="476" class="step">ديب سيك V3</text>
  <text x="200" y="476" class="small">RMSNorm · SwiGLU · RoPE · MLA · MoE 256/top-8 · 128k · 671B/37B نشط</text>

  <text x="480" y="515" text-anchor="middle" class="caption">نفس الهيكل العظمي، وستة مقابض مضبوطة - يختار النموذج الحدودي التالي مجموعة فرعية منها</text>
</svg>