<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">حلقة فك التشفير التأملية — نمط EAGLE-3</text>

  <!-- prefix -->
  <rect x="30" y="60" width="200" height="40" class="box"/>
  <text x="130" y="85" text-anchor="middle" class="step">البادئة x_1... x_k</text>

  <!-- draft step -->
  <rect x="260" y="60" width="280" height="40" class="cool"/>
  <text x="400" y="85" text-anchor="middle" class="step">رموز مسودة N: d_1، d_2،...، d_N ~ p</text>
  <line x1="232" y1="80" x2="258" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- verify -->
  <rect x="570" y="60" width="360" height="40" class="hot"/>
  <text x="750" y="85" text-anchor="middle" class="step">أداة التحقق q(بادئة + مسودات) — ONE تمريرة أمامية</text>
  <line x1="542" y1="80" x2="568" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Leviathan rule -->
  <rect x="30" y="140" width="900" height="60" class="box"/>
  <text x="50" y="165" class="head">قاعدة ليفياثان (لكل i = 1..N)</text>
  <text x="50" y="185" class="step">اقبل d_i إذا u &lt; min(1, q(d_i) / p(d_i)) وإلا قم بإصدار التصحيح ~ (q - p)_+ / ||(q - p)_+||_1 و STOP</text>

  <!-- outcome A -->
  <rect x="30" y="220" width="430" height="80" class="cool"/>
  <text x="245" y="243" text-anchor="middle" class="head">تم قبول كل N</text>
  <text x="245" y="263" text-anchor="middle" class="step">تنبعث d_1... d_N + مكافأة ~ q_{N+1}</text>
  <text x="245" y="282" text-anchor="middle" class="small">kv_length += N + 1 | ما يصل إلى N+1 من الرموز المميزة لكل عملية تحقق</text>

  <!-- outcome B -->
  <rect x="500" y="220" width="430" height="80" class="hot"/>
  <text x="715" y="243" text-anchor="middle" class="head">رفض في الموقف ي</text>
  <text x="715" y="263" text-anchor="middle" class="step">تنبعث منها d_1... d_{j-1} + التصحيح ~ المتبقي</text>
  <text x="715" y="282" text-anchor="middle" class="small">كيلو فولت truncate_to(ك + ي) | تجاهل المسودات بعد j</text>

  <!-- draft evolution table -->
  <rect x="30" y="320" width="900" height="150" class="box"/>
  <text x="480" y="343" text-anchor="middle" class="label">مشروع التطور – ما اشتراه كل جيل</text>

  <text x="50" y="372" class="step">ليفياثان 2023</text>
  <text x="220" y="372" class="small">منفصل صغير LLM · ألفا ~ 0.60 · تسريع 2x</text>

  <text x="50" y="392" class="step">EAGLE-1 (2024)</text>
  <text x="220" y="392" class="small">محول ذو طبقة واحدة للتحقق من الحالات المخفية · ألفا ~ 0.75 · 2.5x</text>

  <text x="50" y="412" class="step">EAGLE-2 (2024)</text>
  <text x="220" y="412" class="small">+ شجرة مسودة ديناميكية · ألفا ~ 0.85 · 3x-4x</text>

  <text x="50" y="432" class="step">EAGLE-3 (2025)</text>
  <text x="220" y="432" class="small">فقدان ميزة الإسقاط + اختبار وقت التدريب · ألفا ~ 0.90+ · 3x-6.5x</text>

  <text x="50" y="452" class="step">ميدوسا (2024)</text>
  <text x="220" y="452" class="small">LM رؤوس إضافية على أداة التحقق (لا يوجد نموذج مسودة) · ألفا ~ 0.70 · 2x-3x</text>

  <text x="480" y="500" text-anchor="middle" class="caption">توزيع المخرجات = توزيع المدقق. بالضبط. المتغير الوحيد هو alpha و N.</text>
</svg>