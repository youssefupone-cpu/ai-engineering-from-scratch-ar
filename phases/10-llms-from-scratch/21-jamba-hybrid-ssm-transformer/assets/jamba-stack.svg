<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .mamba { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.2; }
      .attn { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.2; }
      .moe { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 11px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Jamba — طبقة محولة واحدة لكل 7 طبقات Mamba، MoE على البدائل</text>

  <!-- One Jamba block (8 layers) -->
  <rect x="60" y="50" width="280" height="480" class="box"/>
  <text x="200" y="72" text-anchor="middle" class="head">كتلة جامبا واحدة (8 طبقات)</text>

  <!-- 7 Mamba + 1 Attention, MoE on alternating -->
  <rect x="80" y="90" width="240" height="44" class="mamba"/>
  <text x="200" y="110" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="126" text-anchor="middle" class="small">+ موجه وزارة التربية</text>

  <rect x="80" y="140" width="240" height="44" class="mamba"/>
  <text x="200" y="160" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="176" text-anchor="middle" class="small">كثيفة MLP</text>

  <rect x="80" y="190" width="240" height="44" class="mamba"/>
  <text x="200" y="210" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="226" text-anchor="middle" class="small">+ موجه وزارة التربية</text>

  <rect x="80" y="240" width="240" height="44" class="mamba"/>
  <text x="200" y="260" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="276" text-anchor="middle" class="small">كثيفة MLP</text>

  <rect x="80" y="290" width="240" height="44" class="mamba"/>
  <text x="200" y="310" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="326" text-anchor="middle" class="small">+ موجه وزارة التربية</text>

  <rect x="80" y="340" width="240" height="44" class="mamba"/>
  <text x="200" y="360" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="376" text-anchor="middle" class="small">كثيفة MLP</text>

  <rect x="80" y="390" width="240" height="44" class="mamba"/>
  <text x="200" y="410" text-anchor="middle" class="step">مامبا (SSM)</text>
  <text x="200" y="426" text-anchor="middle" class="small">+ موجه وزارة التربية</text>

  <rect x="80" y="440" width="240" height="44" class="attn"/>
  <text x="200" y="460" text-anchor="middle" class="step">محول (انتباه)</text>
  <text x="200" y="476" text-anchor="middle" class="small">كثيفة MLP</text>

  <text x="200" y="510" text-anchor="middle" class="caption">كرر هذه الكتلة N مرات</text>

  <!-- Memory comparison -->
  <rect x="380" y="50" width="540" height="220" class="box"/>
  <text x="650" y="72" text-anchor="middle" class="head">الذاكرة في سياق 256 كيلو بايت (BF16)</text>

  <text x="400" y="104" class="step">محول نقي MHA 32 لتر</text>
  <text x="680" y="104" class="step" fill="#c0392b">128 GB</text>
  <rect x="400" y="110" width="495" height="14" fill="#c0392b"/>

  <text x="400" y="144" class="step">محول نقي GQA(8) 32 لتر</text>
  <text x="680" y="144" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="150" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="184" class="step">جامبا 1:3 هجين 32 لتر</text>
  <text x="680" y="184" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="190" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="224" class="step">جامبا 1:7 هجين 32 لتر</text>
  <text x="680" y="224" class="step" fill="#2e7d32">16 GB</text>
  <rect x="400" y="230" width="62" height="14" fill="#2e7d32"/>

  <text x="400" y="260" class="step">مامبا بيور 32 لتر</text>
  <text x="680" y="260" class="step" fill="#2e7d32">&lt;1 MB</text>
  <rect x="400" y="262" width="4" height="14" fill="#2e7d32"/>

  <!-- Ratio rationale -->
  <rect x="380" y="290" width="540" height="240" class="box"/>
  <text x="650" y="312" text-anchor="middle" class="head">لماذا نسبة 1:7</text>

  <text x="400" y="340" class="step">1:1 (محول نقي)</text>
  <text x="620" y="340" class="small">أفضل نوعية، أسوأ الذاكرة</text>

  <text x="400" y="362" class="step">1:3 (25% انتباه)</text>
  <text x="620" y="362" class="small">لا يزال KV- فوز ثقيل وصغير الجودة</text>

  <text x="400" y="384" class="step">1:7 (12.5% ​​انتباه) ✓</text>
  <text x="620" y="384" class="small">AI21 مكان رائع — 256 ألفًا على 80 جيجابايت GPU</text>

  <text x="400" y="406" class="step">1:15 (6% انتباه)</text>
  <text x="620" y="406" class="small">يبدأ الاستدعاء في السياق بالفشل</text>

  <text x="400" y="428" class="step">0:N (مامبا نقية)</text>
  <text x="620" y="428" class="small">فشل تتبع الحالة دون الاهتمام</text>

  <text x="400" y="465" class="step">مامبا-3 (ICLR 2026)</text>
  <text x="620" y="465" class="small">حالة معقدة + MIMO; يدفع نسبة أقل؟</text>

  <text x="400" y="488" class="step">الهجينة الحدودية في عام 2026</text>
  <text x="620" y="488" class="small">Jamba 1.5 كبير: 398B/94B نشط، مؤسسة</text>
  <text x="620" y="504" class="small">الجيل التالي: من المحتمل Mamba-3 + انتبه عند الدقيقة 1:10+</text>
</svg>