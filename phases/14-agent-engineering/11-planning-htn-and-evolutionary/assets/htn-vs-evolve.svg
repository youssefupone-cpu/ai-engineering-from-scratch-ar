<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .htn { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .ev { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .compare { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">ChatHTN وAlphaEvolve — مخططان مختلطان لعام 2025</text>

  <rect x="40" y="50" width="440" height="210" class="htn"/>
  <text x="260" y="72" text-anchor="middle" class="head">ChatHTN رمزي + LLM محلل</text>
  <text x="60" y="96" class="small">تتحلل المهمة المركبة عبر مكتبة الطريقة</text>
  <rect x="60" y="108" width="400" height="40" class="box"/>
  <text x="78" y="130" class="step">1. تنطبق الطريقة؟ توسيع المهام الفرعية (يبدو أنه سليم)</text>
  <rect x="60" y="156" width="400" height="40" class="box"/>
  <text x="78" y="178" class="step">2. لا توجد طريقة؟ اطلب LLM للتحلل</text>
  <rect x="60" y="204" width="400" height="40" class="box"/>
  <text x="78" y="226" class="step">3. التحقق من صحة مخطط المشغل؛ ذاكرة التخزين المؤقت على النجاح</text>

  <rect x="500" y="50" width="420" height="210" class="ev"/>
  <text x="710" y="72" text-anchor="middle" class="head">AlphaEvolve البحث عن الكود التطوري</text>
  <text x="520" y="96" class="small">برنامج البذور + مقيم الحتمية</text>
  <rect x="520" y="108" width="380" height="40" class="box"/>
  <text x="538" y="130" class="step">1. مجموعة LLMs تقترح الطفرات</text>
  <rect x="520" y="156" width="380" height="40" class="box"/>
  <text x="538" y="178" class="step">2. يقوم المقيم بتسجيل درجات كل برنامج طفل</text>
  <rect x="520" y="204" width="380" height="40" class="box"/>
  <text x="538" y="226" class="step">3. حافظ على أعلى ك؛ تحور؛ يكرر</text>

  <rect x="40" y="290" width="880" height="220" class="compare"/>
  <text x="480" y="312" text-anchor="middle" class="head">متى تستخدم الذي</text>

  <rect x="60" y="330" width="840" height="40" class="box"/>
  <text x="78" y="352" class="step">الجدولة والامتثال والأتمتة المرتبطة بالسياسة HTN (ChatHTN)</text>
  <text x="78" y="368" class="small">سلامة يمكن إثباتها؛ LLM يوسع مكتبة الطريقة فقط</text>

  <rect x="60" y="380" width="840" height="40" class="box"/>
  <text x="78" y="402" class="step">حبات المصفوفة المتعددة، تمريرات المترجم، الاستدلال على الجدولة AlphaEvolve</text>
  <text x="78" y="418" class="small">يجب أن تكون اللياقة حتمية؛ يعمل عندما تكون الاختبارات/المقاييس هي المقيم</text>

  <rect x="60" y="430" width="840" height="40" class="box"/>
  <text x="78" y="452" class="step">مهام الوكيل المفتوحة ReAct / ReWOO (وليست هذه)</text>
  <text x="78" y="468" class="small">لا يوجد مخطط للمشغل، ولا يمكن فحص اللياقة البدنية بواسطة الآلة؛ الوصول إلى الدروس 01-02</text>

  <rect x="60" y="480" width="840" height="26" class="box"/>
  <text x="78" y="498" class="step">هجين: HTN في المستوى الأعلى، Alpha يتطور في كل مشغل بدائي على حدة</text>

  <text x="480" y="540" text-anchor="middle" class="caption">LLMs تضخيم؛ فهم لا يملكون الصواب. الطبقة الرمزية والمقيم يملكان الضمانات الصعبة.</text>
</svg>