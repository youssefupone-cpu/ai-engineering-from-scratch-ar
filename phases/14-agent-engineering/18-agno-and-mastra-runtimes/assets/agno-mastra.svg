<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .agno { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .mastra { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .diff { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Agno vs Mastra — وقتا تشغيل للإنتاج، ومكدسان</text>

  <rect x="40" y="50" width="440" height="280" class="agno"/>
  <text x="260" y="72" text-anchor="middle" class="head">Agno Python، FastAPI، حمل قريب من الصفر</text>
  <rect x="60" y="90" width="400" height="40" class="box"/>
  <text x="78" y="112" class="step">الهدف: إنشاء مثيل للعامل ~2μs</text>
  <text x="78" y="126" class="small">يهم الآلاف من الوكلاء قصيري العمر في الثانية</text>
  <rect x="60" y="140" width="400" height="40" class="box"/>
  <text x="78" y="162" class="step">الهدف: ~3.75 كيلو بايت من الذاكرة لكل وكيل</text>
  <text x="78" y="176" class="small">معالج FastAPI عديم الجنسية لكل طلب</text>
  <rect x="60" y="190" width="400" height="40" class="box"/>
  <text x="78" y="212" class="step">~23 موفري النماذج، الوسائط المتعددة الأصلية</text>
  <text x="78" y="226" class="small">نص، صورة، صوت، فيديو، ملف</text>
  <rect x="60" y="240" width="400" height="40" class="box"/>
  <text x="78" y="262" class="step">"لا توجد رسوم بيانية أو سلاسل أو أنماط معقدة"</text>
  <text x="78" y="276" class="small">الفلسفة: لغة بايثون النقية، الحد الأدنى من سطح الإطار</text>
  <rect x="60" y="290" width="400" height="34" class="box"/>
  <text x="78" y="312" class="step">حالة الجلسة في DB؛ الوكيل سريع الزوال</text>

  <rect x="500" y="50" width="420" height="280" class="mastra"/>
  <text x="710" y="72" text-anchor="middle" class="head">ماسترا TypeScript، فيرسيل AI SDK الركيزة</text>
  <rect x="520" y="90" width="380" height="40" class="box"/>
  <text x="538" y="112" class="step">ثلاثة أساسيات: الوكلاء، الأدوات (Zod)، سير العمل</text>
  <text x="538" y="126" class="small">الأدوات المكتوبة بـ Zod؛ سلامة وقت التجميع</text>
  <rect x="520" y="140" width="380" height="40" class="box"/>
  <text x="538" y="162" class="step">جهاز التوجيه الموحد: أكثر من 3300 طراز و94 مزودًا</text>
  <text x="538" y="176" class="small">عميل واحد عبر النظام البيئي (مارس 2026)</text>
  <rect x="520" y="190" width="380" height="40" class="box"/>
  <text x="538" y="212" class="step">التخزين المركب: الذاكرة / سير العمل / obs</text>
  <text x="538" y="226" class="small">يوصى بـ ClickHouse على نطاق إمكانية الملاحظة</text>
  <rect x="520" y="240" width="380" height="40" class="box"/>
  <text x="538" y="262" class="step">محولات السيرفر: Express، Hono، Fastify، Koa</text>
  <text x="538" y="276" class="small">تكامل Next.js + Astro من الدرجة الأولى</text>
  <rect x="520" y="290" width="380" height="34" class="box"/>
  <text x="538" y="312" class="step">ستوديو ماسترا على المضيف المحلي:4111 لتصحيح الأخطاء</text>

  <rect x="40" y="350" width="880" height="160" class="diff"/>
  <text x="480" y="372" text-anchor="middle" class="head">اختر بواسطة المكدس</text>
  <rect x="60" y="388" width="840" height="36" class="box"/>
  <text x="78" y="410" class="step">python backend + FastAPI + وكلاء قصيري العمر Agno</text>
  <rect x="60" y="430" width="840" height="36" class="box"/>
  <text x="78" y="452" class="step">الواجهة الخلفية للنسخة المطبوعة + Next.js/Vercel + Mastera الموحد متعدد الموفرين</text>
  <rect x="60" y="472" width="840" height="36" class="box"/>
  <text x="78" y="494" class="step">حالة دائمة، رسوم بيانية واضحة، مسارات طويلة الأفق LangGraph (الدرس 13)</text>

  <text x="480" y="540" text-anchor="middle" class="caption">تكون أهداف الأداء مهمة عندما تكون النفقات العامة بمثابة عنق الزجاجة؛ في كثير من الأحيان ليس كذلك.</text>
</svg>