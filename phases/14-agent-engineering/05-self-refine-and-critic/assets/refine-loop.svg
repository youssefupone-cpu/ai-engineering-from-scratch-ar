<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">التحسين الذاتي (2023) وCRITIC (2023) - التحسين التكراري</text>

  <rect x="40" y="60" width="420" height="440" class="box"/>
  <text x="250" y="84" text-anchor="middle" class="head">الصقل الذاتي: نموذج واحد وثلاث مطالبات</text>

  <rect x="70" y="110" width="360" height="50" class="cool"/>
  <text x="90" y="132" class="step">إنشاء (مهمة) -&gt; الإخراج</text>
  <text x="90" y="148" class="small">منتج أساسي - موجه المهام، لا يوجد تاريخ</text>

  <rect x="70" y="170" width="360" height="50" class="cold"/>
  <text x="90" y="192" class="step">ردود الفعل (المهمة، الإخراج) -&gt; النقد</text>
  <text x="90" y="208" class="small">الناقد الذاتي؛ الحلقة الأضعف - نموذج التسجيل نفسه</text>

  <rect x="70" y="230" width="360" height="50" class="hot"/>
  <text x="90" y="252" class="step">صقل (المهمة، الإخراج، النقد، HISTORY) -&gt; الإخراج'</text>
  <text x="90" y="268" class="small">التاريخ حامل. إسقاطه والدبابات الجودة</text>

  <rect x="70" y="290" width="360" height="50" class="dsk"/>
  <text x="90" y="312" class="step">توقف: التعليقات تقول حسنًا OR max_iters</text>
  <text x="90" y="328" class="small">إقران كلا الشرطين؛ توقف واحد لإخفاء الأخطاء</text>

  <text x="70" y="360" class="step">المتوسط ​​+20 المطلق لأكثر من 7 مهام (ورقية)</text>
  <text x="70" y="376" class="small">الرياضيات، الكود، الاختصار، الحوار؛ يتضمن GPT-4</text>
  <text x="70" y="400" class="step">المأزق: حلقة ختم مطاطي</text>
  <text x="70" y="416" class="small">نفس الناقد الفوري يتفق مع نفسه</text>
  <text x="70" y="432" class="small">الإصلاح: أسلوب موجه مختلف أو ناقد أصغر</text>
  <text x="70" y="460" class="step">يناسب "المُقيّم المُحسِّن" الأنثروبي</text>
  <text x="70" y="476" class="small">أحد أنماط سير العمل الخمسة (ديسمبر 2024)</text>

  <rect x="500" y="60" width="420" height="440" class="box"/>
  <text x="710" y="84" text-anchor="middle" class="head">CRITIC: التحقق من خلال أدوات خارجية</text>

  <rect x="530" y="110" width="360" height="50" class="cool"/>
  <text x="550" y="132" class="step">إنشاء (مهمة) -&gt; الإخراج</text>
  <text x="550" y="148" class="small">نفس المنتج</text>

  <rect x="530" y="170" width="360" height="50" class="cold"/>
  <text x="550" y="192" class="step">التحقق (المهمة، الإخراج، TOOLS) -&gt; النقد</text>
  <text x="550" y="208" class="small">بحث، رمز، آلة حاسبة، اختبارات - مؤرضة</text>

  <rect x="530" y="230" width="360" height="50" class="hot"/>
  <text x="550" y="252" class="step">صقل (المهمة، الإخراج، النقد، HISTORY) -&gt; الإخراج'</text>
  <text x="550" y="268" class="small">نفس الصقل، ونقد أفضل -&gt; إنتاج أفضل</text>

  <rect x="530" y="290" width="360" height="50" class="dsk"/>
  <text x="550" y="312" class="step">توقف: يمر المدقق بـ OR max_iters</text>
  <text x="550" y="328" class="small">إشارة التحقق تهيمن على النقد الذاتي</text>

  <text x="530" y="360" class="step">المطالبة الرئيسية</text>
  <text x="530" y="376" class="small">LLMs لا يمكن الاعتماد عليها في التحقق الذاتي دون أسس خارجية</text>
  <text x="530" y="400" class="step">يعين OpenAI الوكلاء SDK حواجز الحماية للإخراج</text>
  <text x="530" y="416" class="small">يمكن أن تستدعي حواجز الحماية الأدوات؛ تقوم أسلاك التعثر بفرض إعادة المحاولة</text>
  <text x="530" y="440" class="step">خرائط لسلامة الجوزاء 2.5 لكل خطوة</text>
  <text x="530" y="456" class="small">تم التحقق من كل إجراء قبل الالتزام</text>
  <text x="530" y="480" class="small">لا يوجد مدقق خارجي؟ CRITIC يُختزل إلى التحسين الذاتي</text>
</svg>