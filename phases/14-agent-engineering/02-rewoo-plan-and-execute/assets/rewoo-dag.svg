<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">ReWOO — مخطط، عمال، حلال (Xu et al., 2023)</text>

  <rect x="40" y="60" width="170" height="80" class="cool"/>
  <text x="125" y="88" text-anchor="middle" class="step">Planner</text>
  <text x="125" y="108" text-anchor="middle" class="small">مكالمة واحدة؛ يرى فقط</text>
  <text x="125" y="124" text-anchor="middle" class="small">سؤال المستخدم</text>

  <rect x="260" y="60" width="460" height="320" class="box"/>
  <text x="490" y="84" text-anchor="middle" class="head">خطة DAG والعاملين</text>

  <rect x="290" y="110" width="160" height="60" class="cold"/>
  <text x="370" y="134" text-anchor="middle" class="step">E1 = بحث</text>
  <text x="370" y="152" text-anchor="middle" class="small">عاصمة فرنسا</text>

  <rect x="530" y="110" width="160" height="60" class="cold"/>
  <text x="610" y="134" text-anchor="middle" class="step">E2 = بحث</text>
  <text x="610" y="152" text-anchor="middle" class="small">عدد سكان #E1</text>

  <rect x="410" y="220" width="160" height="60" class="hot"/>
  <text x="490" y="244" text-anchor="middle" class="step">E3 = round_million</text>
  <text x="490" y="262" text-anchor="middle" class="small">النص = #E2</text>

  <line x1="210" y1="100" x2="290" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="530" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="610" y1="170" x2="520" y2="220" class="edge" marker-end="url(#arrow)"/>
  <line x1="370" y1="170" x2="470" y2="220" class="edge" marker-end="url(#arrow)"/>

  <rect x="290" y="310" width="400" height="50" class="dsk"/>
  <text x="490" y="334" text-anchor="middle" class="step">جدول الأدلة: E1=باريس، E2="11.2 مليون مترو"، E3="11 مليون"</text>

  <rect x="750" y="60" width="170" height="80" class="cool"/>
  <text x="835" y="88" text-anchor="middle" class="step">Solver</text>
  <text x="835" y="108" text-anchor="middle" class="small">مكالمة واحدة؛ يقرأ</text>
  <text x="835" y="124" text-anchor="middle" class="small">الأدلة + الخطة</text>

  <line x1="720" y1="335" x2="790" y2="140" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="160" width="170" height="220" class="box"/>
  <text x="125" y="184" text-anchor="middle" class="head">لماذا ReWOO</text>
  <text x="50" y="206" class="small">لا ملاحظة في المخطط</text>
  <text x="50" y="222" class="small">يعني عدم وجود ضجيج ردود الفعل</text>
  <text x="50" y="246" class="small">العمال يخرجون بالتوازي</text>
  <text x="50" y="262" class="small">على طول فروع مستقلة</text>
  <text x="50" y="286" class="small">رموز أقل:</text>
  <text x="50" y="302" class="small">1 مخطط + ن عامل صغير</text>
  <text x="50" y="318" class="small">المطالبات + 1 مكالمة حلالا</text>
  <text x="50" y="342" class="small">الورق: تخفيض بمقدار 5x</text>
  <text x="50" y="358" class="small">على HotpotQA، دقة +4</text>

  <rect x="750" y="160" width="170" height="220" class="box"/>
  <text x="835" y="184" text-anchor="middle" class="head">متى تختاره</text>
  <text x="760" y="206" class="small">شكل المهمة منظم</text>
  <text x="760" y="222" class="small">الأدوات معروفة مقدمًا</text>
  <text x="760" y="246" class="small">الأدلة قابلة للتوازي</text>
  <text x="760" y="262" class="small">الميزانية الرمزية مهمة</text>
  <text x="760" y="286" class="small">آخر يفضل ReAct ل</text>
  <text x="760" y="302" class="small">بيئات غير معروفة أو</text>
  <text x="760" y="318" class="small">خطط وتصرف لأكثر من 30 خطوة</text>
  <text x="760" y="334" class="small">مسارات الويب/الجوال</text>

  <rect x="40" y="400" width="880" height="100" class="box"/>
  <text x="480" y="424" text-anchor="middle" class="head">زاوية التقطير (قسم ReWOO 4)</text>
  <text x="60" y="446" class="small">لا يرى المخطط أي ملاحظات، لذا فإن إشارة التدريب الخاصة به نظيفة؛ يمكن ضبط LLaMA 7B من</text>
  <text x="60" y="462" class="small">GPT-3.5 آثار المخطط ومطابقة جودة المخطط. إنتاج 2026: مخطط صغير + منفذ كبير</text>
  <text x="60" y="478" class="small">(أو العكس) عبر جهاز التوجيه النموذجي (Mastra) أو التسليم الديناميكي (OpenAI الوكلاء SDK).</text>
</svg>