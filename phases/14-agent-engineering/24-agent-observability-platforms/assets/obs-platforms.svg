<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .lf { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .px { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .op { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .shared { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">إمكانية ملاحظة الوكيل 2026 — ثلاث منصات مفتوحة المصدر، وثلاثة تركيزات</text>

  <rect x="40" y="50" width="290" height="240" class="lf"/>
  <text x="185" y="72" text-anchor="middle" class="head">لانغفيوز MIT</text>
  <text x="60" y="96" class="small">6 مليون+ SDK عملية تثبيت/شهر، 19 ألف+ نجمة</text>
  <rect x="60" y="108" width="250" height="30" class="box"/>
  <text x="78" y="128" class="step">تتبع + إدارة سريعة</text>
  <rect x="60" y="142" width="250" height="30" class="box"/>
  <text x="78" y="162" class="step">LLM-كحكم، تعليقات المستخدمين، التقييمات المخصصة</text>
  <rect x="60" y="176" width="250" height="30" class="box"/>
  <text x="78" y="196" class="step">عمليات إعادة الجلسة وقوائم انتظار التعليقات التوضيحية</text>
  <rect x="60" y="210" width="250" height="30" class="box"/>
  <text x="78" y="230" class="step">ملعب + تجارب سريعة</text>
  <rect x="60" y="244" width="250" height="40" class="box"/>
  <text x="78" y="264" class="step">الأفضل لـ: الكل في واحد مع حلقة سريعة</text>
  <text x="78" y="280" class="small">الإصدارات السريعة مرتبطة بالآثار</text>

  <rect x="340" y="50" width="290" height="240" class="px"/>
  <text x="485" y="72" text-anchor="middle" class="head">أريزي فينيكس مطاطا 2.0</text>
  <text x="360" y="96" class="small">تركيز التقييم الخاص بالوكيل</text>
  <rect x="360" y="108" width="250" height="30" class="box"/>
  <text x="378" y="128" class="step">تتبع المجموعات + الكشف عن الشذوذ</text>
  <rect x="360" y="142" width="250" height="30" class="box"/>
  <text x="378" y="162" class="step">RAG الملاءمة + تقييم الاسترجاع</text>
  <rect x="360" y="176" width="250" height="30" class="box"/>
  <text x="378" y="196" class="step">أداة OpenInference التلقائية</text>
  <rect x="360" y="210" width="250" height="30" class="box"/>
  <text x="378" y="230" class="step">أزواج مع Arize المُدارة AX</text>
  <rect x="360" y="244" width="250" height="40" class="box"/>
  <text x="378" y="264" class="step">الأفضل لـ: RAG الملاءمة + الانجراف</text>
  <text x="378" y="280" class="small">لا يوجد إصدار سريع جنبًا إلى جنب، وليس الاستبدال</text>

  <rect x="640" y="50" width="290" height="240" class="op"/>
  <text x="785" y="72" text-anchor="middle" class="head">المذنب أوبيك أباتشي 2.0</text>
  <text x="660" y="96" class="small">التحسين الآلي + الدرابزين</text>
  <rect x="660" y="108" width="250" height="30" class="box"/>
  <text x="678" y="128" class="step">تجارب A/B السريعة التلقائية</text>
  <rect x="660" y="142" width="250" height="30" class="box"/>
  <text x="678" y="162" class="step">حواجز الحماية: PII تنقيح، موضعي</text>
  <rect x="660" y="176" width="250" height="30" class="box"/>
  <text x="678" y="196" class="step">LLM-كشف الهلوسة القاضي</text>
  <rect x="660" y="210" width="250" height="30" class="box"/>
  <text x="678" y="230" class="step">معيار البائع: ~14x Langfuse</text>
  <rect x="660" y="244" width="250" height="40" class="box"/>
  <text x="678" y="264" class="step">الأفضل لـ: حلقة التحسين</text>
  <text x="678" y="280" class="small">أرقام البائعين الاتجاه؛ قياس بنفسك</text>

  <rect x="40" y="310" width="880" height="200" class="shared"/>
  <text x="480" y="332" text-anchor="middle" class="head">الركيزة المشتركة OpenTelemetry GenAI تمتد (الدرس 23)</text>
  <rect x="60" y="348" width="840" height="30" class="box"/>
  <text x="78" y="368" class="step">يستهلك الثلاثة امتدادات OTel GenAI؛ يمكنك التبديل دون إعادة الأجهزة</text>
  <rect x="60" y="382" width="840" height="30" class="box"/>
  <text x="78" y="402" class="step">التقاط المحتوى: مخزن خارجي + مراجع ممتدة (PII-آمنة)</text>
  <rect x="60" y="416" width="840" height="30" class="box"/>
  <text x="78" y="436" class="step">89% من المؤسسات لديها إمكانية ملاحظة الوكيل (بيانات ماكسيم الميدانية، 2026)</text>
  <rect x="60" y="450" width="840" height="30" class="box"/>
  <text x="78" y="470" class="step">أشار 32% من المشاركين إلى أن الجودة هي العائق الأكبر أمام الإنتاج</text>
  <rect x="60" y="484" width="840" height="22" class="box"/>
  <text x="78" y="500" class="step">خرائط Datadog v1.37+ سمات GenAI العمليات المختلطة أصلاً + فرق ML مناسبة هنا</text>

  <text x="480" y="540" text-anchor="middle" class="caption">التتبع بدون تقييم هو عملية تسجيل مكلفة. تتبعات زوجية + LLM- القاضي + الإصدار الفوري.</text>
</svg>