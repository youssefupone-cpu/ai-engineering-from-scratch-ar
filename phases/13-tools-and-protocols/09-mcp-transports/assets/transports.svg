<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">MCP وسائل النقل: ستديو، قابل للبث HTTP، تراث SSE</text>

  <rect x="40" y="60" width="290" height="400" class="cool"/>
  <text x="185" y="82" text-anchor="middle" class="head">ستديو (محلي)</text>
  <text x="56" y="108" class="step">عملية الطفل</text>
  <text x="56" y="126" class="small">خادم يولد العميل,</text>
  <text x="56" y="142" class="small">محادثات عبر stdin/stdout</text>
  <text x="56" y="174" class="step">تنسيق الأسلاك</text>
  <text x="56" y="192" class="small">واحد JSON لكل سطر، \n</text>
  <text x="56" y="208" class="small">ستدوت ONLY لـ JSON-RPC</text>
  <text x="56" y="224" class="small">stderr للسجلات</text>
  <text x="56" y="256" class="step">session</text>
  <text x="56" y="274" class="small">العملية = الجلسة</text>
  <text x="56" y="290" class="small">لا حاجة معرف</text>
  <text x="56" y="322" class="step">auth</text>
  <text x="56" y="340" class="small">يرث ثقة الوالدين</text>
  <text x="56" y="372" class="step">verdict</text>
  <text x="56" y="390" class="small">الخوادم المحلية فقط.</text>
  <text x="56" y="406" class="small">أبسط وأكثر موثوقية.</text>

  <rect x="345" y="60" width="290" height="400" class="cold"/>
  <text x="490" y="82" text-anchor="middle" class="head">قابل للبث HTTP (عن بعد)</text>
  <text x="361" y="108" class="step">نقطة نهاية واحدة /mcp</text>
  <text x="361" y="126" class="small">POST: JSON-RPC طلب</text>
  <text x="361" y="142" class="small">GET: فتح تيار SSE</text>
  <text x="361" y="158" class="small">DELETE: إنهاء الجلسة</text>
  <text x="361" y="190" class="step">session</text>
  <text x="361" y="208" class="small">رأس معرف جلسة Mcp</text>
  <text x="361" y="224" class="small">تشفير عشوائي,</text>
  <text x="361" y="240" class="small">server-assigned</text>
  <text x="361" y="272" class="step">security</text>
  <text x="361" y="290" class="small">القائمة المسموح بها للأصل</text>
  <text x="361" y="306" class="small">DNS- ​​إعادة الدفاع</text>
  <text x="361" y="322" class="small">OAuth 2.1 (الدرس 16)</text>
  <text x="361" y="354" class="step">reconnect</text>
  <text x="361" y="372" class="small">إعادة GET بنفس الجانب؛</text>
  <text x="361" y="388" class="small">إعادة تشغيل معرف الحدث الأخير</text>
  <text x="361" y="420" class="step">verdict</text>
  <text x="361" y="438" class="small">معيار 2026</text>

  <rect x="650" y="60" width="290" height="400" class="hot"/>
  <text x="795" y="82" text-anchor="middle" class="head">تراث HTTP+SSE</text>
  <text x="666" y="108" class="step">نقطتي النهاية</text>
  <text x="666" y="126" class="small">POST /الرسائل</text>
  <text x="666" y="142" class="small">GET /sse (تيار)</text>
  <text x="666" y="174" class="step">problems</text>
  <text x="666" y="192" class="small">CDN / WAF معادٍ</text>
  <text x="666" y="208" class="small">دورتين للمتابعة</text>
  <text x="666" y="224" class="small">مهلات طويلة SSE</text>
  <text x="666" y="256" class="step">deprecation</text>
  <text x="666" y="274" class="small">أتلاسيان روفو: 30-06-2026</text>
  <text x="666" y="290" class="small">كيبولا: 2026-04-01</text>
  <text x="666" y="306" class="small">أعلام المواصفات الرسمية LEGACY</text>
  <text x="666" y="338" class="step">migration</text>
  <text x="666" y="356" class="small">أضعاف نقطتي النهاية إلى واحدة؛</text>
  <text x="666" y="372" class="small">توليد سيد جديد.</text>
  <text x="666" y="388" class="small">إضافة الشيكات الأصل</text>
  <text x="666" y="420" class="step">verdict</text>
  <text x="666" y="438" class="small">الهجرة قبل منتصف عام 2026.</text>

  <text x="480" y="498" text-anchor="middle" class="caption">اختر stdio للبث المحلي، HTTP للتحكم عن بعد؛ الوضع SSE هو جسر مؤقت.</text>
</svg>