<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">سبع فئات MCP للهجوم والدفاع في العمق</text>

  <rect x="40" y="50" width="880" height="210" class="hot"/>
  <text x="480" y="72" text-anchor="middle" class="head">attacks</text>

  <rect x="60" y="90" width="270" height="60" class="box"/>
  <text x="76" y="110" class="step">1/تسمم الأدوات</text>
  <text x="76" y="128" class="small">تعليمات مخفية في</text>
  <text x="76" y="144" class="small">وصف الأداة</text>

  <rect x="345" y="90" width="270" height="60" class="box"/>
  <text x="361" y="110" class="step">2/ سحب البساط</text>
  <text x="361" y="128" class="small">حميدة أولا، مسمومة</text>
  <text x="361" y="144" class="small">بعد موافقة المستخدم</text>

  <rect x="630" y="90" width="270" height="60" class="box"/>
  <text x="646" y="110" class="step">3/ أداة التظليل</text>
  <text x="646" y="128" class="small">خادمين بنفس الاسم؛</text>
  <text x="646" y="144" class="small">طريق الانتصارات الخبيثة</text>

  <rect x="60" y="160" width="270" height="60" class="box"/>
  <text x="76" y="180" class="step">4 / MPMA</text>
  <text x="76" y="198" class="small">التعامل مع تفضيلات النموذج</text>
  <text x="76" y="214" class="small">لتصاعد التكلفة أو إضعافها</text>

  <rect x="345" y="160" width="270" height="60" class="box"/>
  <text x="361" y="180" class="step">5/ السلسلة الطفيلية</text>
  <text x="361" y="198" class="small">الخادم "أ" ينسق</text>
  <text x="361" y="214" class="small">الخادم B عبر أخذ العينات</text>

  <rect x="630" y="160" width="270" height="60" class="box"/>
  <text x="646" y="180" class="step">6/ هجمات أخذ العينات</text>
  <text x="646" y="198" class="small">المنطق السري / السرقة /</text>
  <text x="646" y="214" class="small">اختطاف المحادثة</text>

  <rect x="60" y="230" width="840" height="28" class="box"/>
  <text x="76" y="248" class="step">7/ حفلة تنكرية لسلسلة التوريد</text>
  <text x="300" y="248" class="small">خادم مزيف في التسجيل (حادثة Postmark، سبتمبر 2025). علامات الناشر، عكس-DNS الأسماء.</text>

  <rect x="40" y="280" width="880" height="260" class="cool"/>
  <text x="480" y="302" text-anchor="middle" class="head">دفاع متعمق (لا يفوز أي فحص واحد)</text>

  <rect x="60" y="320" width="270" height="80" class="box"/>
  <text x="76" y="340" class="step">تثبيت التجزئة</text>
  <text x="76" y="358" class="small">SHA256 لكل وصف؛</text>
  <text x="76" y="374" class="small">طفرة -&gt; إعادة الموافقة.</text>
  <text x="76" y="390" class="small">يمسك البساط يسحب.</text>

  <rect x="345" y="320" width="270" height="80" class="box"/>
  <text x="361" y="340" class="step">كاشف ثابت</text>
  <text x="361" y="358" class="small">التعبير العادي: علامة SYSTEM، تجاهل-</text>
  <text x="361" y="374" class="small">السابق، قراءة سرية، URL-</text>
  <text x="361" y="390" class="small">المختصر. CI جاهز.</text>

  <rect x="630" y="320" width="270" height="80" class="box"/>
  <text x="646" y="340" class="step">قاعدة اثنين</text>
  <text x="646" y="358" class="small">الحد الأقصى اثنين من: المدخلات غير الموثوق بها،</text>
  <text x="646" y="374" class="small">البيانات الحساسة، التبعية</text>
  <text x="646" y="390" class="small">فعل. رفض إذا كان كل ثلاثة.</text>

  <rect x="60" y="410" width="270" height="80" class="box"/>
  <text x="76" y="430" class="step">MELON</text>
  <text x="76" y="448" class="small">إعادة التنفيذ المقنع +</text>
  <text x="76" y="464" class="small">مقارنة الأداة. &gt;99%</text>
  <text x="76" y="480" class="small">الصيد بالحقن غير المباشر.</text>

  <rect x="345" y="410" width="270" height="80" class="box"/>
  <text x="361" y="430" class="step">gateway</text>
  <text x="361" y="448" class="small">السياسة المركزية، سجل التدقيق،</text>
  <text x="361" y="464" class="small">قائمة الخوادم المسموح بها.</text>
  <text x="361" y="480" class="small">المرحلة 13. 17.</text>

  <rect x="630" y="410" width="270" height="80" class="box"/>
  <text x="646" y="430" class="step">التسجيل الموقع</text>
  <text x="646" y="448" class="small">تم التحقق من مساحة الاسم، عكسي</text>
  <text x="646" y="464" class="small">DNS (io.github.user/server).</text>
  <text x="646" y="480" class="small">توقيعات الناشر.</text>

  <text x="480" y="530" text-anchor="middle" class="caption">لا يزال المهاجمون المتكيفون يصلون إلى 85% تقريبًا مقابل SOTA (arXiv مارس 2026). استمر في التراص.</text>
</svg>