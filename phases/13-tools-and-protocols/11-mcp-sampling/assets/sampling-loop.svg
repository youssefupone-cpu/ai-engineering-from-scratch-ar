<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">حلقة الوكيل التي يستضيفها الخادم عبر أخذ العينات (لا يوجد مفتاح خادم API)</text>

  <rect x="40" y="60" width="260" height="440" class="cool"/>
  <text x="170" y="82" text-anchor="middle" class="head">العميل (مضيف المستخدم)</text>
  <text x="56" y="108" class="small">يحمل LLM أوراق الاعتماد</text>
  <text x="56" y="128" class="step">LLM مزود</text>
  <text x="56" y="146" class="small">(كلود، GPT، الجوزاء،</text>
  <text x="56" y="162" class="small">محلي Ollama،...)</text>
  <text x="56" y="194" class="step">معالج أخذ العينات</text>
  <text x="56" y="212" class="small">يعمل LLM على الخادم</text>
  <text x="56" y="228" class="small">طلب؛ إرجاع الانتهاء</text>
  <text x="56" y="260" class="step">safety</text>
  <text x="56" y="278" class="small">- يظهر للمستخدم الطلب</text>
  <text x="56" y="294" class="small">- ينطبق معدل لكل جلسة</text>
  <text x="56" y="310" class="small">- يكرم نموذج التفضيلات</text>
  <text x="56" y="342" class="step">billing</text>
  <text x="56" y="360" class="small">يدفع المستخدم لأخذ العينات</text>
  <text x="56" y="376" class="small">المكالمات عبر المفتاح الخاص بهم</text>

  <path d="M300,180 L420,180" class="edge" marker-end="url(#arrow)"/>
  <text x="360" y="174" text-anchor="middle" class="small">الأدوات/استدعاء Summary_repo</text>

  <path d="M660,260 L300,260" class="edge" marker-end="url(#arrow)"/>
  <text x="480" y="254" text-anchor="middle" class="small">أخذ العينات/إنشاء رسالة {اختيار الملفات}</text>

  <path d="M300,310 L660,310" class="edge" marker-end="url(#arrow)"/>
  <text x="480" y="304" text-anchor="middle" class="small">&lt;- completion {picked: [...]}</text>

  <path d="M660,370 L300,370" class="edge" marker-end="url(#arrow)"/>
  <text x="480" y="364" text-anchor="middle" class="small">أخذ العينات/إنشاء رسالة {تلخيص}</text>

  <path d="M300,420 L660,420" class="edge" marker-end="url(#arrow)"/>
  <text x="480" y="414" text-anchor="middle" class="small">&lt;- completion {summary}</text>

  <path d="M660,460 L420,460" class="edge" marker-end="url(#arrow)"/>
  <text x="540" y="454" text-anchor="middle" class="small">الأدوات/نتيجة المكالمة {الملخص}</text>

  <rect x="660" y="60" width="260" height="440" class="cold"/>
  <text x="790" y="82" text-anchor="middle" class="head">الخادم (summarize_repo)</text>
  <text x="676" y="108" class="small">NO LLM أوراق الاعتماد</text>
  <text x="676" y="128" class="step">algorithm</text>
  <text x="676" y="146" class="small">1. قائمة ملف السير</text>
  <text x="676" y="162" class="small">2. اطلب من العميل الاختيار</text>
  <text x="676" y="178" class="small">3. قراءة الملفات المختارة</text>
  <text x="676" y="194" class="small">4. اطلب من العميل التلخيص</text>
  <text x="676" y="210" class="small">5. إرجاع النتيجة</text>
  <text x="676" y="240" class="step">modelPreferences</text>
  <text x="676" y="258" class="small">اختيار الملفات: التكلفة 0.5، int 0.2</text>
  <text x="676" y="274" class="small">تلخيص: التكلفة 0.2، كثافة العمليات 0.6</text>
  <text x="676" y="306" class="step">guardrails</text>
  <text x="676" y="324" class="small">- max_samples_per_tool</text>
  <text x="676" y="340" class="small">- تضمين السياق: "لا شيء"</text>
  <text x="676" y="356" class="small">- عدم أخذ العينات السرية</text>
  <text x="676" y="388" class="step">SEP-1577 (خطر الانجراف)</text>
  <text x="676" y="406" class="small">الأدوات[] داخل أخذ العينات</text>
  <text x="676" y="422" class="small">لـ ReAct المستضاف على الخادم</text>
  <text x="676" y="438" class="small">SDK الأشكال ما زالت تستقر</text>
</svg>