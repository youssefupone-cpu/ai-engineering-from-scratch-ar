<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">OAuth 2.1 + PKCE + خطوة المتابعة (SEP-835)</text>

  <rect x="40" y="60" width="180" height="460" class="cool"/>
  <text x="130" y="82" text-anchor="middle" class="head">client</text>
  <text x="56" y="108" class="small">كلود سطح المكتب,</text>
  <text x="56" y="124" class="small">المؤشر، VS الكود</text>
  <text x="56" y="156" class="step">holds</text>
  <text x="56" y="174" class="small">- رموز الوصول</text>
  <text x="56" y="190" class="small">  مرتبطا بالموارد</text>
  <text x="56" y="206" class="small">- تحديث الرموز</text>
  <text x="56" y="222" class="small">- PKCE المتحققون</text>

  <rect x="400" y="60" width="180" height="460" class="cold"/>
  <text x="490" y="82" text-anchor="middle" class="head">خادم الترخيص</text>
  <text x="416" y="108" class="small">مصادقة0 / عباءة المفاتيح /</text>
  <text x="416" y="124" class="small">المعرفة / العرف</text>
  <text x="416" y="156" class="step">responsibilities</text>
  <text x="416" y="174" class="small">- موافقة UI</text>
  <text x="416" y="190" class="small">- إصدار الرموز</text>
  <text x="416" y="206" class="small">- PKCE الشيك</text>
  <text x="416" y="222" class="small">- دبوس الجمهور عبر</text>
  <text x="416" y="238" class="small">  مؤشر الموارد</text>
  <text x="416" y="254" class="small">  (RFC 8707)</text>

  <rect x="760" y="60" width="180" height="460" class="hot"/>
  <text x="850" y="82" text-anchor="middle" class="head">خادم الموارد</text>
  <text x="776" y="108" class="small">MCP الخادم</text>
  <text x="776" y="124" class="small">على سبيل المثال ملاحظات.مثال</text>
  <text x="776" y="156" class="step">responsibilities</text>
  <text x="776" y="174" class="small">- التحقق من صحة الصوت</text>
  <text x="776" y="190" class="small">- التحقق من النطاق</text>
  <text x="776" y="206" class="small">- 403 على العجز</text>
  <text x="776" y="222" class="small">- WWW-توثيق</text>
  <text x="776" y="238" class="small">  مع تلميح النطاق</text>
  <text x="776" y="254" class="small">- نشر.معروف/</text>
  <text x="776" y="270" class="small">  oauth-protected-</text>
  <text x="776" y="286" class="small">  الموارد (RFC 9728)</text>

  <path d="M220,280 L400,280" class="edge" marker-end="url(#arrow)"/>
  <text x="310" y="270" text-anchor="middle" class="small">تفويض code_challenge</text>
  <text x="310" y="298" text-anchor="middle" class="small">موافقات المستخدم</text>

  <path d="M400,330 L220,330" class="edge" marker-end="url(#arrow)"/>
  <text x="310" y="322" text-anchor="middle" class="small">code</text>

  <path d="M220,360 L400,360" class="edge" marker-end="url(#arrow)"/>
  <text x="310" y="352" text-anchor="middle" class="small">منحة رمزية + أداة التحقق + الموارد</text>

  <path d="M400,400 L220,400" class="edge" marker-end="url(#arrow)"/>
  <text x="310" y="392" text-anchor="middle" class="small">رمز الوصول (aud، النطاقات)</text>

  <path d="M220,440 L760,440" class="edge" marker-end="url(#arrow)"/>
  <text x="490" y="432" text-anchor="middle" class="small">التفويض: حامل...</text>

  <path d="M760,480 L220,480" class="edge" marker-end="url(#arrow)"/>
  <text x="490" y="472" text-anchor="middle" class="small">403 نطاق غير كاف (SEP-835)</text>
  <text x="490" y="498" text-anchor="middle" class="caption">يقوم العميل بإعادة توجيه المستخدم لنطاق أكبر، ويكرر التدفق، ويعيد محاولة الطلب</text>
</svg>