<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">الأداة مقابل المورد مقابل الموجه - قاعدة القرار</text>

  <rect x="40" y="60" width="290" height="420" class="hot"/>
  <text x="185" y="82" text-anchor="middle" class="head">tool</text>
  <text x="185" y="106" text-anchor="middle" class="small">يقرر النموذج متى يتم الاتصال به</text>
  <text x="56" y="140" class="step">examples:</text>
  <text x="56" y="158" class="small">  notes_search(query)</text>
  <text x="56" y="174" class="small">  notes_create(...)</text>
  <text x="56" y="190" class="small">  github_open_pr(...)</text>
  <text x="56" y="210" class="step">شكل المكالمة:</text>
  <text x="56" y="228" class="small">  أدوات/اسم المكالمة، الحجج</text>
  <text x="56" y="244" class="small">  إرجاع كتل المحتوى</text>
  <text x="56" y="260" class="small">  خطأ في الفشل</text>
  <text x="56" y="280" class="step">UX:</text>
  <text x="56" y="298" class="small">  تم استدعاؤه في منتصف المحادثة</text>
  <text x="56" y="314" class="small">  تلميح التعليقات التوضيحية UI</text>
  <text x="56" y="334" class="step">يختار عندما:</text>
  <text x="56" y="352" class="small">  الآثار الجانبية أو العمل</text>
  <text x="56" y="368" class="small">  التحويل المحسوب</text>
  <text x="56" y="384" class="small">  طفرة في البيانات</text>
  <text x="56" y="410" class="step">إشارة القرار:</text>
  <text x="56" y="428" class="small">  يجب أن يقرر النموذج</text>
  <text x="56" y="444" class="small">  كل الاستعلام ذات الصلة</text>

  <rect x="345" y="60" width="290" height="420" class="cool"/>
  <text x="490" y="82" text-anchor="middle" class="head">resource</text>
  <text x="490" y="106" text-anchor="middle" class="small">يقرر المستخدم متى يتم إرفاقه</text>
  <text x="361" y="140" class="step">examples:</text>
  <text x="361" y="158" class="small">  notes://note-1</text>
  <text x="361" y="174" class="small">  file:///path/to.md</text>
  <text x="361" y="190" class="small">  db://schema/tables</text>
  <text x="361" y="210" class="step">شكل المكالمة:</text>
  <text x="361" y="228" class="small">  resources/list</text>
  <text x="361" y="244" class="small">  الموارد/قراءة أوري</text>
  <text x="361" y="260" class="small">  resources/subscribe</text>
  <text x="361" y="280" class="step">UX:</text>
  <text x="361" y="298" class="small">  لوحة منتقي الموارد</text>
  <text x="361" y="314" class="small">  مربع حوار تضمين الملف</text>
  <text x="361" y="334" class="step">يختار عندما:</text>
  <text x="361" y="352" class="small">  بيانات للقراءة فقط</text>
  <text x="361" y="368" class="small">  قابل للتوجيه بحلول URI</text>
  <text x="361" y="384" class="small">  قد تحتاج الاشتراك</text>
  <text x="361" y="410" class="step">إشارة القرار:</text>
  <text x="361" y="428" class="small">  يريد المستخدم أن يشمل</text>
  <text x="361" y="444" class="small">  كسياق</text>

  <rect x="650" y="60" width="290" height="420" class="cold"/>
  <text x="795" y="82" text-anchor="middle" class="head">prompt</text>
  <text x="795" y="106" text-anchor="middle" class="small">قالب سير العمل القابل لإعادة الاستخدام</text>
  <text x="666" y="140" class="step">examples:</text>
  <text x="666" y="158" class="small">  /review_note note_id</text>
  <text x="666" y="174" class="small">  /summarize_pr pr_id</text>
  <text x="666" y="190" class="small">  /triage_issue tag</text>
  <text x="666" y="210" class="step">شكل المكالمة:</text>
  <text x="666" y="228" class="small">  prompts/list</text>
  <text x="666" y="244" class="small">  المطالبات/الحصول على الاسم، الحجج</text>
  <text x="666" y="260" class="small">  إرجاع الرسائل[]</text>
  <text x="666" y="280" class="step">UX:</text>
  <text x="666" y="298" class="small">  أمر القطع في الدردشة</text>
  <text x="666" y="314" class="small">  مربع حوار منتقي الوسيطة</text>
  <text x="666" y="334" class="step">يختار عندما:</text>
  <text x="666" y="352" class="small">  سير العمل متعدد الخطوات</text>
  <text x="666" y="368" class="small">  إعادة استخدامها عبر الجلسات</text>
  <text x="666" y="384" class="small">  يريد المستخدمون اختصارًا</text>
  <text x="666" y="410" class="step">إشارة القرار:</text>
  <text x="666" y="428" class="small">  التسلسل الفوري الكنسي</text>
  <text x="666" y="444" class="small">  يستحق التسمية</text>
</svg>