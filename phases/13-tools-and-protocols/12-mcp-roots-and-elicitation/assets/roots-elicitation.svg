<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">الجذور = النطاق، الاستنباط = إدخال المستخدم في منتصف المكالمة</text>

  <rect x="40" y="60" width="440" height="440" class="cool"/>
  <text x="260" y="82" text-anchor="middle" class="head">الجذور (نطاق الموافقة)</text>

  <rect x="60" y="100" width="400" height="80" class="box"/>
  <text x="76" y="122" class="step">يعلن العميل عند التهيئة:</text>
  <text x="76" y="142" class="small">{URI: ملف:///.../ملاحظات، الاسم: ملاحظات}</text>
  <text x="76" y="160" class="small">{أوري: ملف:///.../سكراتش، الاسم: سكراتش}</text>

  <rect x="60" y="190" width="400" height="60" class="hot"/>
  <text x="76" y="212" class="step">قاعدة الخادم:</text>
  <text x="76" y="230" class="small">أي URI خارج مجموعة الجذر -&gt; عملية الرفض</text>

  <rect x="60" y="260" width="400" height="60" class="box"/>
  <text x="76" y="282" class="step">نطاق تغييرات المستخدم -&gt;</text>
  <text x="76" y="300" class="small">notifications/roots/list_changed</text>

  <rect x="60" y="270" width="0" height="0"/>

  <rect x="60" y="330" width="400" height="160" class="box"/>
  <text x="76" y="352" class="step">التدفق النموذجي:</text>
  <text x="76" y="372" class="small">1. يقوم العميل بتعيين الجذور عند الحرف الأول</text>
  <text x="76" y="388" class="small">2. قائمة حدود مخازن الخادم</text>
  <text x="76" y="404" class="small">3. كل أداة تستدعي الشيكات URI في الجذر</text>
  <text x="76" y="420" class="small">4. الإخطار -&gt; إعادة الاستعلام عن الجذور/القائمة</text>
  <text x="76" y="440" class="step">إذا كان خارج الجذر:</text>
  <text x="76" y="458" class="small">الرفض مع وجود خطأ "الجذور الخارجية"؛</text>
  <text x="76" y="474" class="small">افعل NOT احتياطي للوصول المحيط</text>

  <rect x="500" y="60" width="420" height="440" class="cold"/>
  <text x="710" y="82" text-anchor="middle" class="head">الاستنباط (إدخال منتصف الرحلة)</text>

  <rect x="520" y="100" width="380" height="100" class="box"/>
  <text x="536" y="122" class="step">وضع النموذج (الافتراضي):</text>
  <text x="536" y="142" class="small">الخادم -&gt; الاستنباط/الإنشاء {المخطط،</text>
  <text x="536" y="158" class="small">  الرسالة: "اختر واحدًا"}</text>
  <text x="536" y="176" class="small">العميل -&gt; يعرض النموذج ويعيد الإجابة</text>
  <text x="536" y="192" class="small">العمل: قبول | تراجع | يلغي</text>

  <rect x="520" y="210" width="380" height="100" class="hot"/>
  <text x="536" y="232" class="step">وضع عنوان URL (SEP-1036، تجريبي):</text>
  <text x="536" y="252" class="small">الخادم -&gt; الاستنباط/الإنشاء {url،</text>
  <text x="536" y="268" class="small">  الرسالة: "تسجيل الدخول"}</text>
  <text x="536" y="286" class="small">العميل -&gt; يفتح المتصفح، ينتظر</text>
  <text x="536" y="302" class="small">خطر الانجراف: الشكل لا يزال مستقرًا</text>

  <rect x="520" y="320" width="380" height="170" class="box"/>
  <text x="536" y="342" class="step">استخدم عندما:</text>
  <text x="536" y="360" class="small">- توضيح (N مباريات)</text>
  <text x="536" y="376" class="small">- التأكيد المدمر</text>
  <text x="536" y="392" class="small">- الإعداد للتشغيل الأول</text>
  <text x="536" y="408" class="small">- OAuth / الدفع / تسجيل الدخول (URL)</text>
  <text x="536" y="430" class="step">استخدم NOT عندما:</text>
  <text x="536" y="448" class="small">- نموذج يمكن فقط إعادة طرحه في النثر</text>
  <text x="536" y="464" class="small">- في حلقة ضيقة (مقاطعات UX)</text>
  <text x="536" y="480" class="small">- لحشو الوسائط المفقودة التي عرفها LLM</text>
</svg>