<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">دمج مساحة اسم العميل متعدد الخوادم</text>

  <rect x="40" y="60" width="880" height="60" class="cold"/>
  <text x="480" y="84" text-anchor="middle" class="head">العميل: مساحة اسم أداة مدمجة واحدة</text>
  <text x="480" y="108" text-anchor="middle" class="small">إنشاء | قراءة | ملفات/بحث | بحث | list_issues | open_pr</text>

  <path d="M200,120 L200,170" class="edge" marker-end="url(#arrow)"/>
  <path d="M480,120 L480,170" class="edge" marker-end="url(#arrow)"/>
  <path d="M760,120 L760,170" class="edge" marker-end="url(#arrow)"/>

  <rect x="60" y="180" width="280" height="160" class="cool"/>
  <text x="200" y="202" text-anchor="middle" class="head">الخادم: ملاحظات</text>
  <text x="74" y="228" class="step">tools:</text>
  <text x="74" y="246" class="small">  البحث (الفوز، من يأتي أولاً)</text>
  <text x="74" y="262" class="small">  create</text>
  <text x="74" y="294" class="step">القبعات: الأدوات</text>
  <text x="74" y="314" class="step">النقل: عملية الطفل stdio</text>

  <rect x="360" y="180" width="240" height="160" class="hot"/>
  <text x="480" y="202" text-anchor="middle" class="head">الخادم: الملفات</text>
  <text x="374" y="228" class="step">tools:</text>
  <text x="374" y="246" class="small">  read</text>
  <text x="374" y="262" class="small">  بحث (تصادم)</text>
  <text x="374" y="278" class="small">    إعادة تسمية الملفات/البحث</text>
  <text x="374" y="310" class="step">القبعات: الأدوات والموارد</text>

  <rect x="620" y="180" width="280" height="160" class="cold"/>
  <text x="760" y="202" text-anchor="middle" class="head">الخادم: github</text>
  <text x="634" y="228" class="step">tools:</text>
  <text x="634" y="246" class="small">  list_issues</text>
  <text x="634" y="262" class="small">  open_pr</text>
  <text x="634" y="278" class="small">  بحث (تصادم)</text>
  <text x="634" y="294" class="small">    تمت إعادة تسميته github/search</text>
  <text x="634" y="326" class="step">القبعات: الأدوات</text>

  <rect x="40" y="360" width="880" height="140" class="box"/>
  <text x="480" y="382" text-anchor="middle" class="head">سياسات حل الاصطدام</text>
  <text x="60" y="408" class="step">بادئة عند الاصطدام: تمت إعادة تسمية أداة الخادم الثانية `files/search`، `githubhub/search`</text>
  <text x="60" y="426" class="small">                         كلود سطح المكتب، VS الكود.</text>
  <text x="60" y="446" class="step">الرفض عند الاصطدام: تم رفض أداة الخادم الثاني، وتم إخطار المستخدم</text>
  <text x="60" y="464" class="small">                         المؤشر. أكثر أمانا أخطاء أكثر وضوحا.</text>
  <text x="60" y="484" class="step">الكتابة الصامتة: آخر انتصارات تم تحميلها. لا تستخدم أبدا. يخفي السجلات.</text>
</svg>