<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">MCP التطبيقات (SEP-1724): ui:// الموارد في إطار iframe في وضع الحماية</text>

  <rect x="40" y="60" width="240" height="440" class="cool"/>
  <text x="160" y="82" text-anchor="middle" class="head">server</text>
  <text x="56" y="108" class="step">الأدوات/نتيجة المكالمة</text>
  <text x="56" y="126" class="small">content[]:</text>
  <text x="56" y="142" class="small">  النص، ui_resource</text>
  <text x="56" y="158" class="step">_meta.ui</text>
  <text x="56" y="174" class="small">  resourceUri:</text>
  <text x="56" y="190" class="small">    ui://notes/timeline</text>
  <text x="56" y="206" class="small">  سي اس بي: {...}</text>
  <text x="56" y="222" class="small">  الأذونات: [...]</text>
  <text x="56" y="254" class="step">resources/read</text>
  <text x="56" y="270" class="small">  mimeType:</text>
  <text x="56" y="286" class="small">  text/html;profile=</text>
  <text x="56" y="302" class="small">  mcp-app</text>
  <text x="56" y="334" class="step">HTML حزمة</text>
  <text x="56" y="350" class="small">  single-file,</text>
  <text x="56" y="366" class="small">  الأنماط المضمنة,</text>
  <text x="56" y="382" class="small">  البيانات المضمنة,</text>
  <text x="56" y="398" class="small">  عميل ما بعد الرسالة</text>

  <path d="M280,280 L360,280" class="edge" marker-end="url(#arrow)"/>

  <rect x="360" y="60" width="280" height="440" class="box"/>
  <text x="500" y="82" text-anchor="middle" class="head">المضيف (العميل)</text>
  <text x="376" y="108" class="step">رمل iframe</text>
  <text x="376" y="126" class="small">sandbox="allow-scripts</text>
  <text x="376" y="142" class="small">        allow-same-origin"</text>
  <text x="376" y="174" class="step">قم بتطبيق رؤوس CSP</text>
  <text x="376" y="190" class="small">  الافتراضي src "الذات"</text>
  <text x="376" y="206" class="small">  البرنامج النصي src "الذاتي"</text>
  <text x="376" y="222" class="small">  ربط src "الذاتي"</text>
  <text x="376" y="254" class="step">تطبيق الأذونات</text>
  <text x="376" y="270" class="small">  الكاميرا / الميكروفون /</text>
  <text x="376" y="286" class="small">  الموقع الجغرافي / الشبكة:*</text>
  <text x="376" y="302" class="small">  كل منها موجه للمستخدم</text>
  <text x="376" y="334" class="step">توسط رسالة ما بعد</text>
  <text x="376" y="350" class="small">  iframe -&gt; مكالمة المضيف</text>
  <text x="376" y="366" class="small">  المضيف -&gt; خادم MCP</text>
  <text x="376" y="382" class="small">  MCP النتيجة -&gt; iframe</text>
  <text x="376" y="414" class="step">التمييز بصريا</text>
  <text x="376" y="430" class="small">  الخادم UI من المضيف</text>
  <text x="376" y="446" class="small">  (هزيمة موجه-</text>
  <text x="376" y="462" class="small">  الحقن عبر UI)</text>

  <path d="M640,280 L720,280" class="edge" marker-end="url(#arrow)"/>

  <rect x="720" y="60" width="200" height="440" class="cold"/>
  <text x="820" y="82" text-anchor="middle" class="head">رسالة ما بعد JSON-RPC</text>
  <text x="736" y="108" class="step">إطار iframe -&gt; المضيف</text>
  <text x="736" y="126" class="small">host.callTool</text>
  <text x="736" y="142" class="small">host.readResource</text>
  <text x="736" y="158" class="small">host.getPrompt</text>
  <text x="736" y="174" class="small">host.close</text>
  <text x="736" y="206" class="step">المضيف -&gt; iframe</text>
  <text x="736" y="222" class="small">ui/initialize</text>
  <text x="736" y="238" class="small">notifications/*</text>
  <text x="736" y="270" class="step">shape</text>
  <text x="736" y="286" class="small">{jsonrpc، معرف،</text>
  <text x="736" y="302" class="small"> الطريقة، المعلمات }</text>
  <text x="736" y="334" class="step">نموذج الثقة</text>
  <text x="736" y="350" class="small">كل مضيف.* اتصل</text>
  <text x="736" y="366" class="small">يمر عبر MCP</text>
  <text x="736" y="382" class="small">أذونات الخادم</text>
  <text x="736" y="414" class="step">الدعم (2026-04)</text>
  <text x="736" y="430" class="small">كلود ديسك توب، غوس</text>
  <text x="736" y="446" class="small">ChatGPT، الإصدار التجريبي من المؤشر</text>
  <text x="736" y="462" class="small">VS الكود الداخلي</text>
</svg>