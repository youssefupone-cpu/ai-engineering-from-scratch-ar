<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .oa { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .an { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .gm { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="500" y="26" text-anchor="middle" class="title">نفس الأداة، ثلاثة أشكال الموفر</text>

  <rect x="40" y="50" width="920" height="80" class="box"/>
  <text x="60" y="72" class="head">الأداة الأساسية (الرمز الخاص بك)</text>
  <text x="60" y="96" class="step">الأداة (الاسم = "get_weather"، الوصف = "..."، input_schema = {...}، الصارم = صحيح)</text>
  <text x="60" y="118" class="small">مصدر واحد للحقيقة؛ يقوم المترجمون بإصدار مظاريف خاصة بالمزود.</text>

  <rect x="40" y="150" width="300" height="180" class="oa"/>
  <text x="190" y="172" text-anchor="middle" class="head">OpenAI</text>
  <text x="56" y="198" class="step">أدوات: [{</text>
  <text x="72" y="214" class="step">  النوع: "وظيفة"،</text>
  <text x="72" y="230" class="step">  وظيفة: {</text>
  <text x="88" y="246" class="step">    الاسم والوصف,</text>
  <text x="88" y="262" class="step">    المعلمات: المخطط،</text>
  <text x="88" y="278" class="step">    صارم: صحيح</text>
  <text x="72" y="294" class="step">  }</text>
  <text x="56" y="310" class="step">}]</text>

  <rect x="360" y="150" width="300" height="180" class="an"/>
  <text x="510" y="172" text-anchor="middle" class="head">Anthropic</text>
  <text x="376" y="198" class="step">أدوات: [{</text>
  <text x="392" y="214" class="step">  name,</text>
  <text x="392" y="230" class="step">  description,</text>
  <text x="392" y="246" class="step">  input_schema: المخطط</text>
  <text x="376" y="262" class="step">}]</text>
  <text x="376" y="294" class="small">المخطط هو العقد.</text>
  <text x="376" y="310" class="small">لا يوجد علامة `strict`.</text>

  <rect x="680" y="150" width="280" height="180" class="gm"/>
  <text x="820" y="172" text-anchor="middle" class="head">Gemini</text>
  <text x="696" y="198" class="step">أدوات: [{</text>
  <text x="712" y="214" class="step">  إعلانات الوظيفة: [{</text>
  <text x="728" y="230" class="step">    name,</text>
  <text x="728" y="246" class="step">    description,</text>
  <text x="728" y="262" class="step">    المعلمات: openapi</text>
  <text x="712" y="278" class="step">  }]</text>
  <text x="696" y="294" class="step">}]</text>
  <text x="696" y="314" class="small">OpenAPI 3.0 مجموعة فرعية</text>

  <rect x="40" y="350" width="300" height="180" class="oa"/>
  <text x="190" y="372" text-anchor="middle" class="head">OpenAI الرد</text>
  <text x="56" y="398" class="step">msg.tool_calls: [{</text>
  <text x="72" y="414" class="step">  المعرف: "call_abc123"،</text>
  <text x="72" y="430" class="step">  النوع: "وظيفة"،</text>
  <text x="72" y="446" class="step">  وظيفة: {</text>
  <text x="88" y="462" class="step">    name,</text>
  <text x="88" y="478" class="step">    الوسائط: "{json}"</text>
  <text x="72" y="494" class="step">  }</text>
  <text x="56" y="510" class="step">}]</text>

  <rect x="360" y="350" width="300" height="180" class="an"/>
  <text x="510" y="372" text-anchor="middle" class="head">رد فعل أنثروبي</text>
  <text x="376" y="398" class="step">محتوى: [{</text>
  <text x="392" y="414" class="step">  اكتب: "tool_use"،</text>
  <text x="392" y="430" class="step">  المعرف: "toolu_xyz789"،</text>
  <text x="392" y="446" class="step">  name,</text>
  <text x="392" y="462" class="step">  الإدخال: {...} // obj</text>
  <text x="376" y="478" class="step">}]</text>
  <text x="376" y="510" class="small">تم تحليل الإدخال بالفعل.</text>

  <rect x="680" y="350" width="280" height="180" class="gm"/>
  <text x="820" y="372" text-anchor="middle" class="head">رد الجوزاء</text>
  <text x="696" y="398" class="step">الأجزاء: [{</text>
  <text x="712" y="414" class="step">  استدعاء الوظيفة: {</text>
  <text x="728" y="430" class="step">    المعرف: uuid،</text>
  <text x="728" y="446" class="step">    name,</text>
  <text x="728" y="462" class="step">    الوسائط: {...}</text>
  <text x="712" y="478" class="step">  }</text>
  <text x="696" y="494" class="step">}]</text>
  <text x="696" y="514" class="small">معرف فريد في الجوزاء 3+</text>

  <text x="500" y="548" text-anchor="middle" class="caption">دلالات الاسم/الوسائط متطابقة عبر الثلاثة؛ يختلف نظام المغلف والمعرف.</text>
</svg>