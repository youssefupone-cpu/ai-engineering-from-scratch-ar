<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .host { fill: #e8f0ff; stroke: #0f3460; stroke-width: 1.5; }
      .server { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .primitive { fill: #e8f7e8; stroke: #2d7a2d; stroke-width: 1.2; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #333; }
      .tag { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">مضيف واحد، جلسة JSON-RPC واحدة، ثلاثة عناصر أولية</text>

  <!-- Host -->
  <rect x="40" y="70" width="240" height="300" class="host"/>
  <text x="160" y="95" text-anchor="middle" class="label">المضيف (تطبيق LLM)</text>
  <text x="160" y="113" text-anchor="middle" class="tag">كلود ديسكتوب / كلود كود / ChatGPT</text>

  <rect x="70" y="135" width="180" height="55" class="box"/>
  <text x="160" y="155" text-anchor="middle" class="sub">LLM وقت التشغيل</text>
  <text x="160" y="175" text-anchor="middle" class="tag">نموذج + موجه + سياق</text>

  <rect x="70" y="205" width="180" height="55" class="box"/>
  <text x="160" y="225" text-anchor="middle" class="sub">MCP العميل</text>
  <text x="160" y="245" text-anchor="middle" class="tag">واحد لكل خادم مثبت</text>

  <rect x="70" y="275" width="180" height="55" class="box"/>
  <text x="160" y="295" text-anchor="middle" class="sub">المستخدم UI / الموافقة</text>
  <text x="160" y="315" text-anchor="middle" class="tag">أوامر القطع، تؤكد</text>

  <!-- Wire -->
  <path d="M280 235 L500 235" class="line" marker-end="url(#arrow)"/>
  <text x="390" y="220" text-anchor="middle" class="tag">JSON-RPC 2.0 (استوديو / HTTP)</text>
  <text x="390" y="252" text-anchor="middle" class="tag">تهيئة → قائمة → اتصال</text>

  <!-- Server -->
  <rect x="500" y="70" width="360" height="300" class="server"/>
  <text x="680" y="95" text-anchor="middle" class="label">Server</text>
  <text x="680" y="113" text-anchor="middle" class="tag">الكود الخاص بك: FastMCP / SDK / مخصص</text>

  <rect x="525" y="140" width="310" height="60" class="primitive"/>
  <text x="680" y="161" text-anchor="middle" class="sub">Tools</text>
  <text x="680" y="181" text-anchor="middle" class="tag">وظائف يستدعي النموذج. JSON إدخال المخطط</text>

  <rect x="525" y="215" width="310" height="60" class="primitive"/>
  <text x="680" y="236" text-anchor="middle" class="sub">Resources</text>
  <text x="680" y="256" text-anchor="middle" class="tag">URI-محتوى مخصص للقراءة فقط</text>

  <rect x="525" y="290" width="310" height="60" class="primitive"/>
  <text x="680" y="311" text-anchor="middle" class="sub">Prompts</text>
  <text x="680" y="331" text-anchor="middle" class="tag">القوالب التي يستدعيها المستخدم (أوامر الشرطة المائلة)</text>

  <!-- Caption -->
  <text x="450" y="410" text-anchor="middle" class="tag">
    تضيف مراجعة المواصفات 18-06-2025 وسيلة نقل HTTP قابلة للبث؛ يقوم كل مضيف/خادم بتثبيت إصدار بروتوكول في التهيئة.
  </text>
  <text x="450" y="435" text-anchor="middle" class="tag">
    مجموعة الأدوات المدمرة تلميح تدميري: صحيح حتى يتمكن المضيف من الحصول على موافقة الإنسان.
  </text>
</svg>