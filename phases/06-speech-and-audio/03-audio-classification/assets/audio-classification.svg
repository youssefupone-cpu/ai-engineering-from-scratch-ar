<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .col { font-size: 11px; fill: #1a1a1a; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="30" text-anchor="middle" class="title">ثلاثة عقود من مصنفات الصوت، نفس مدخلات السجل</text>

  <!-- shared input -->
  <rect x="40" y="60" width="800" height="60" class="box"/>
  <text x="440" y="82" text-anchor="middle" class="label">الإدخال: مخطط طيفي لسجل ميل لمدة 10 ثوانٍ - الشكل [T = 998، n_mels = 80]</text>
  <text x="440" y="102" text-anchor="middle" class="caption">نفس الواجهة الأمامية، وثلاثة أجيال من الواجهات الخلفية</text>

  <!-- Era 1: k-NN -->
  <rect x="40" y="145" width="250" height="280" class="box"/>
  <text x="165" y="170" text-anchor="middle" class="label">التسعينات — k-NN بشأن البلدان متعددة الأطراف</text>
  <rect x="60" y="195" width="210" height="35" class="box"/>
  <text x="165" y="218" text-anchor="middle" class="content">MFCC-13 + تجمع متوسط/فار</text>
  <line x1="165" y1="232" x2="165" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="255" width="210" height="35" class="box"/>
  <text x="165" y="278" text-anchor="middle" class="content">جيب التمام → التصويت أعلى K</text>
  <text x="165" y="318" text-anchor="middle" class="caption">صفر تدريب، لا GPU</text>
  <text x="165" y="336" text-anchor="middle" class="caption">قوي في ESC-50</text>
  <text x="165" y="354" text-anchor="middle" class="caption">فشل في AudioSet</text>
  <text x="165" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 حسابًا: ~65%</text>
  <text x="165" y="406" text-anchor="middle" class="caption">خط الأساس الأول الخاص بك</text>

  <!-- Era 2: CNN -->
  <rect x="315" y="145" width="250" height="280" class="box"/>
  <text x="440" y="170" text-anchor="middle" class="label">2015–2021 — ثنائي الأبعاد CNN</text>
  <rect x="335" y="195" width="210" height="35" class="box"/>
  <text x="440" y="218" text-anchor="middle" class="content">سجل ميل كصورة</text>
  <line x1="440" y1="232" x2="440" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="335" y="255" width="210" height="35" class="box"/>
  <text x="440" y="278" text-anchor="middle" class="content">التحويل + التجمع × 3، softmax</text>
  <text x="440" y="318" text-anchor="middle" class="caption">3M بارامترات، قطار 10 دقائق</text>
  <text x="440" y="336" text-anchor="middle" class="caption">SpecAugment + الخلط</text>
  <text x="440" y="354" text-anchor="middle" class="caption">لا يزال خط الأساس في KWS</text>
  <text x="440" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 حسابًا: ~82%</text>
  <text x="440" y="406" text-anchor="middle" class="caption">أوامر الحافة + الكلام</text>

  <!-- Era 3: SSL -->
  <rect x="590" y="145" width="250" height="280" class="hot"/>
  <text x="715" y="170" text-anchor="middle" class="label">2024–2026 — الفوز / AST</text>
  <rect x="610" y="195" width="210" height="35" class="box"/>
  <text x="715" y="218" text-anchor="middle" class="content">باتشيفي لوغ ميل (16×16)</text>
  <line x1="715" y1="232" x2="715" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="610" y="255" width="210" height="35" class="box"/>
  <text x="715" y="278" text-anchor="middle" class="content">SSL- محول مُدرب مسبقًا</text>
  <text x="715" y="318" text-anchor="middle" class="caption">ضبط دقيق على الملصقات بنسبة 1-10%</text>
  <text x="715" y="336" text-anchor="middle" class="caption">يتصدر BEATs-iter3 مجموعة الصوت</text>
  <text x="715" y="354" text-anchor="middle" class="caption">الافتراضي لعدم الكلام 2026</text>
  <text x="715" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 Ac: 97.0%</text>
  <text x="715" y="406" text-anchor="middle" class="caption">خريطة مجموعة الصوت: 0.548</text>

  <text x="440" y="450" text-anchor="middle" class="caption">ظلت الميزات على حالها لمدة 30 عامًا. الخلفية هي الرافعة</text>
</svg>