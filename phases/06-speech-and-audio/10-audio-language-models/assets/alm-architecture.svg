<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">نموذج اللغة الصوتية - قالب ثلاثي المكونات (2026)</text>

  <rect x="30" y="55" width="180" height="100" class="box"/>
  <text x="120" y="78" text-anchor="middle" class="label">1. التشفير الصوتي</text>
  <text x="120" y="96" text-anchor="middle" class="content">همس / دقات / CLAP</text>
  <text x="120" y="114" text-anchor="middle" class="content">→ (T، d_audio)</text>
  <text x="120" y="138" text-anchor="middle" class="caption">المجمدة في المرحلة 1</text>

  <line x1="212" y1="105" x2="233" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="235" y="55" width="180" height="100" class="hot"/>
  <text x="325" y="78" text-anchor="middle" class="label">2. جهاز عرض</text>
  <text x="325" y="96" text-anchor="middle" class="content">1-3 طبقات خطية</text>
  <text x="325" y="114" text-anchor="middle" class="content">d_audio → d_llm</text>
  <text x="325" y="138" text-anchor="middle" class="caption">تدرب أولا</text>

  <line x1="417" y1="105" x2="438" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="440" y="55" width="180" height="100" class="box"/>
  <text x="530" y="78" text-anchor="middle" class="label">3. LLM فك</text>
  <text x="530" y="96" text-anchor="middle" class="content">اللاما / كوين / جيما</text>
  <text x="530" y="114" text-anchor="middle" class="content">الرموز النصية + الصوتية</text>
  <text x="530" y="138" text-anchor="middle" class="caption">LoRA-المرحلة الثانية المضبوطة بدقة</text>

  <line x1="622" y1="105" x2="643" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="645" y="55" width="200" height="100" class="box"/>
  <text x="745" y="78" text-anchor="middle" class="label">4. نص OR خطاب</text>
  <text x="745" y="96" text-anchor="middle" class="content">Qwen2.5-أومني: كلاهما</text>
  <text x="745" y="114" text-anchor="middle" class="content">GPT-4o الصوت: كلاهما</text>
  <text x="745" y="138" text-anchor="middle" class="caption">فك تشفير الكلام اختياري</text>

  <rect x="30" y="175" width="815" height="100" class="box"/>
  <text x="437" y="195" text-anchor="middle" class="label">وصفة التدريب</text>
  <text x="60" y="220" class="content">المرحلة 1 · تجميد التشفير + LLM؛ تدريب جهاز العرض على ASR / أزواج التسميات التوضيحية</text>
  <text x="60" y="238" class="content">المرحلة 2 · LoRA على جهاز التشفير + LLM; صوت-QA/بيانات متابعة التعليمات</text>
  <text x="60" y="256" class="content">المرحلة 3 · (اختياري) قم بتثبيت جهاز فك تشفير الكلام لإدخال الصوت/إخراج الصوت</text>

  <rect x="30" y="295" width="815" height="130" class="hot"/>
  <text x="437" y="315" text-anchor="middle" class="label">MMAU-Pro 2026 — الأوزان المفتوحة سدت الفجوة، باستثناء الصوت المتعدد</text>
  <text x="60" y="342" class="content">Gemini 2.5 Pro ~60% الإجمالي 73.4% الكلام 51.9% الصوت 64.9% الموسيقى ~22% متعدد</text>
  <text x="60" y="360" class="content">GPT-4o الصوت 52.5% — — — 26.5% متعدد</text>
  <text x="60" y="378" class="content">Qwen2.5-Omni-7B 52.2% 57.4% الكلام 47.6% الصوت 61.5% الموسيقى ~20% متعدد</text>
  <text x="60" y="396" class="content">الصوت Flamingo 3 ~54% — (متخصص الموسيقى عبر AF-CLAP)</text>
  <text x="60" y="414" class="caption">فرصة عشوائية للاختيار المتعدد في 4 اتجاهات = 25% — الصوت المتعدد منقطع بشكل حقيقي في جميع الطرز</text>
</svg>