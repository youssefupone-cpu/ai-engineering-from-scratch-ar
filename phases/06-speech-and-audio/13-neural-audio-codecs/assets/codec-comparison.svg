<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">برامج ترميز الصوت العصبية - أربعة أشكال مختلفة في RVQ، تقسيم دلالي/صوتي واحد</text>

  <rect x="20" y="55" width="200" height="150" class="box"/>
  <text x="120" y="78" text-anchor="middle" class="label">ترميز (ميتا، 2022)</text>
  <text x="120" y="96" text-anchor="middle" class="tag">الصوتية RVQ خط الأساس</text>
  <text x="30" y="120" class="content">واف → تحويل + محول + تحويل</text>
  <text x="30" y="138" class="content"> → RVQ (4-32 كتاب رموز)</text>
  <text x="30" y="156" class="content"> → وحدة فك التشفير → wav</text>
  <text x="30" y="178" class="caption">75 هرتز · 24 كيلو هرتز · يستخدم بواسطة MusicGen</text>
  <text x="30" y="196" class="caption">PESQ 3.2 بسرعة 6 كيلوبت في الثانية</text>

  <rect x="235" y="55" width="200" height="150" class="box"/>
  <text x="335" y="78" text-anchor="middle" class="label">DAC (الوصف، 2023)</text>
  <text x="335" y="96" text-anchor="middle" class="tag">ملك إعادة الإعمار</text>
  <text x="245" y="120" class="content">ترميز +</text>
  <text x="245" y="138" class="content"> L2- كتب الشفرات القياسية</text>
  <text x="245" y="156" class="content"> التنشيط الدوري</text>
  <text x="245" y="174" class="content"> تحسين الخسائر</text>
  <text x="245" y="196" class="caption">نطاق كامل 44.1 كيلو هرتز · PESQ 3.5 @ 6 كيلوبت في الثانية</text>

  <rect x="450" y="55" width="200" height="150" class="box"/>
  <text x="550" y="78" text-anchor="middle" class="label">SNAC (سيوزداك 2024)</text>
  <text x="550" y="96" text-anchor="middle" class="tag">متعدد المقاييس RVQ</text>
  <text x="460" y="120" class="content">رموز خشنة @ 12 هرتز</text>
  <text x="460" y="138" class="content">متوسطة @ 25 هرتز</text>
  <text x="460" y="156" class="content">غرامة @ 50 هرتز</text>
  <text x="460" y="178" class="caption">هرمي → AR-LM ودود</text>
  <text x="460" y="196" class="caption">يستخدم بواسطة Orpheus-3B</text>

  <rect x="665" y="55" width="200" height="150" class="hot"/>
  <text x="765" y="78" text-anchor="middle" class="label">ميمي (كيوتاي 2024)</text>
  <text x="765" y="96" text-anchor="middle" class="tag">تقسيم دلالي + صوتي</text>
  <text x="675" y="120" class="content">كتاب الشفرات 0 - WavLM المقطر</text>
  <text x="675" y="138" class="content">            (semantic)</text>
  <text x="675" y="156" class="content">كتب الشفرات 1-7 - الصوتية</text>
  <text x="675" y="178" class="caption">12.5 هرتز · 4.4 كيلو بايت في الثانية · قوى موشي</text>
  <text x="675" y="196" class="caption">يستخدم بواسطة سمسم CSM</text>

  <rect x="20" y="225" width="845" height="100" class="box"/>
  <text x="440" y="247" text-anchor="middle" class="label">لماذا هذا مهم لنمذجة اللغة على الصوت</text>
  <text x="50" y="274" class="content">خطاب 10 ثوانٍ × 12.5 هرتز × 8 كتب تشفير = 1000 رمز → سياق محول تافه</text>
  <text x="50" y="294" class="content">التحليل: LM يتنبأ بكتاب الرموز الدلالي 0 أولاً (محاذاة النص)، ثم كتب الرموز الصوتية 1-7</text>
  <text x="50" y="314" class="content">النتيجة: استنساخ صوت بدون طلقة (دلالي = محتوى، صوتي مشروط بالمرجع)</text>

  <rect x="20" y="335" width="845" height="115" class="hot"/>
  <text x="440" y="356" text-anchor="middle" class="label">اختر حسب المشكلة</text>
  <text x="50" y="382" class="content">توليد الموسيقى → EnCodec-24k · MusicGen، AudioLDM</text>
  <text x="50" y="400" class="content">أعلى دقة → DAC-44.1k · استعادة الصوت وتحريره</text>
  <text x="50" y="418" class="content">AR LM فوق الكلام → SNAC أو Mimi · TTS، برنامج الترميز LM</text>
  <text x="50" y="436" class="content">تدفق مزدوج كامل → ميمي فقط · موشي، سمسم CSM</text>
</svg>